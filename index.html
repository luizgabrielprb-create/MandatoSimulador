<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>MANDATO — Simulador Político</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--panel2:#111f2c;--line:#203241;--text:#e9f1f7;--muted:#8fa3b4;--accent:#35c2a0;--accent2:#4f8cff;--warn:#f2b84b;--danger:#ed6a7a;--good:#5bd18a;--shadow:0 14px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 80% -10%,#16324b 0,#071018 38%);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(7,16,24,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em}.brandMark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#071018;font-weight:1000}
.topstats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 68px)}
.side{border-right:1px solid var(--line);padding:16px 12px;background:rgba(8,17,25,.72)}
.navbtn{width:100%;border:1px solid transparent;background:transparent;color:#b9c9d6;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0}.navbtn:hover,.navbtn.active{background:var(--panel2);border-color:var(--line);color:#fff}.navgroup{margin:18px 7px 7px;color:#61798a;text-transform:uppercase;font-size:10px;letter-spacing:.16em}
.main{padding:24px;max-width:1500px;width:100%;margin:auto}.view{display:none}.view.active{display:block}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:31px}.hero p{margin:0;color:var(--muted)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(180deg,rgba(17,31,44,.95),rgba(10,22,32,.95));border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.card h3,.card h4{margin:0 0 11px}.metric{font-size:28px;font-weight:850;margin:3px 0}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.bar{height:7px;background:#1a2a36;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.btn{border:1px solid var(--line);background:#122230;color:#e9f1f7;padding:10px 13px;border-radius:10px;font-weight:750}.btn:hover{filter:brightness(1.15)}.btn.primary{background:linear-gradient(135deg,#27b998,#2d8fe0);border:0;color:#061117}.btn.danger{background:#331c26;border-color:#5a2938;color:#ffabb7}.btn.warn{background:#322918;border-color:#624d22;color:#ffd783}.btn.sm{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack>*+*{margin-top:10px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:#8299aa;font-weight:650}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);background:rgba(10,22,32,.55);padding:12px;border-radius:11px}
input,select,textarea{width:100%;background:#09151e;border:1px solid #284050;color:#eef6fb;border-radius:9px;padding:10px;outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#3d7996}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field label{display:block;font-size:12px;color:#91a5b4;margin:0 0 6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}.modal.show{display:flex}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#0b1721;border:1px solid #294050;border-radius:18px;padding:20px;box-shadow:0 25px 90px rgba(0,0,0,.5)}
.toast{position:fixed;right:18px;bottom:18px;background:#10232f;border:1px solid #2d5367;color:#eaf7ff;padding:12px 15px;border-radius:11px;z-index:200;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.25s}.toast.show{opacity:1;transform:none}
.news{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}.dot.warn{background:var(--warn)}.dot.red{background:var(--danger)}
.timeline{border-left:2px solid #274252;margin-left:7px;padding-left:18px}.timeline .item{position:relative}.timeline .item:before{content:"";position:absolute;left:-25px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.chart{height:180px;display:flex;align-items:flex-end;gap:5px;padding-top:15px}.chart span{flex:1;background:linear-gradient(180deg,var(--accent2),#1c4258);border-radius:5px 5px 0 0;min-height:5px;position:relative}.chart span b{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:#7890a0;font-weight:500}
.kpi{display:flex;justify-content:space-between;align-items:end}.up{color:var(--good)}.down{color:var(--danger)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#19394f 0,#071018 52%)}.loginbox{width:min(470px,100%);background:rgba(10,23,34,.94);border:1px solid #294152;border-radius:20px;padding:28px;box-shadow:0 30px 100px rgba(0,0,0,.5)}.loginlogo{font-size:42px;font-weight:1000;letter-spacing:.08em}.loginlogo span{color:var(--accent)}.credit{color:#718899;font-size:11px;margin-top:18px}.googleBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#202124;border:1px solid #dadce0}.googleBtn:hover{background:#f7f7f7}.googleIcon{font-weight:900;font-size:18px}.authDivider{display:flex;align-items:center;gap:10px;color:#61798a;font-size:11px;margin:14px 0}.authDivider:before,.authDivider:after{content:'';height:1px;background:#243746;flex:1}
.authRemember{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 4px}.rememberLabel{display:flex;align-items:center;gap:9px;color:#a9b9c5;font-size:13px;cursor:pointer}.rememberLabel input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}.passwordWrap{position:relative}.passwordWrap input{padding-right:78px}.passwordToggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);height:32px;padding:0 10px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(255,255,255,.035);color:#9eb0bc;cursor:pointer;font-size:11px;font-weight:700;transition:.18s}.passwordToggle:hover{background:rgba(255,255,255,.07);color:#fff}.authError{display:none;margin-top:4px;padding:10px 12px;border:1px solid rgba(229,91,116,.34);border-radius:11px;background:rgba(120,30,52,.13);color:#ffb6c4;font-size:12px;line-height:1.4}.authError.show{display:block}.authFieldError{border-color:#c6536c!important;box-shadow:0 0 0 3px rgba(198,83,108,.09)!important}.authBusy{opacity:.72;pointer-events:none}.authLoading{display:inline-flex;align-items:center;justify-content:center;gap:8px}.authSpinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:authSpin .7s linear infinite}@keyframes authSpin{to{transform:rotate(360deg)}}
@media(max-width:560px){.login{padding:14px}.loginbox{padding:22px 18px;border-radius:17px}.loginlogo{font-size:36px}.authRemember{align-items:flex-start}}
.startcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.startcard{padding:18px;border:1px solid var(--line);border-radius:14px;background:#0d1c28;cursor:pointer}.startcard:hover{border-color:#3c7187}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#71899a}.big{font-size:17px;font-weight:800}
.mobileOnly{display:none}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.mobileOnly{display:block}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.main{padding:14px}.topbar{height:auto;min-height:62px;padding:10px 12px}.topstats{max-width:70%}.g2,.g3,.g4,.formgrid,.startcards{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:25px}.topstats .pill:nth-child(n+4){display:none}}

.commandHero{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin-bottom:16px}
.commandHero .card{min-height:190px}
.avatar{width:52px;height:52px;border-radius:15px;object-fit:cover;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-weight:900;font-size:20px}
.avatar.sm{width:38px;height:38px;border-radius:11px;font-size:15px}
.saveTools{display:flex;gap:8px;flex-wrap:wrap}
.saveSearch{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:8px;margin-bottom:12px}
.wizardStep{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}
.wizardStep span{padding:6px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}
.wizardStep span.active{background:var(--accent);color:#071018;border-color:var(--accent);font-weight:800}
.optionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.optionCard{border:1px solid var(--line);background:var(--panel2);padding:11px;border-radius:11px;cursor:pointer}
.optionCard:hover,.optionCard.selected{border-color:var(--accent);box-shadow:0 0 0 1px rgba(53,194,160,.15)}
.positionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.positionGrid .field{margin:0}
.profileLine{display:flex;gap:12px;align-items:center}
.noticeDot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.adminLock{border:1px dashed #6d3040;background:rgba(109,48,64,.12)}
@media(max-width:800px){.commandHero{grid-template-columns:1fr}.saveSearch,.positionGrid,.optionGrid{grid-template-columns:1fr}}

.layoutShell{width:100%;height:calc(100vh - 60px)}
.layoutShell.hidden{display:none!important}
.accountSide,.careerSide{min-height:100%}

.stateCard{min-height:240px;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:16px;background:rgba(13,24,34,.72);padding:28px}.stateCard>*{max-width:720px}.errorState{border-color:#6d3040;background:rgba(109,48,64,.10)}.emptyState{min-height:220px;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:16px;padding:28px}.spinner{width:28px;height:28px;border:3px solid #294050;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}@keyframes spin{to{transform:rotate(360deg)}}.sideCredit{position:sticky;bottom:0;margin-top:20px;padding:12px 7px 3px;color:#526b7c;font-size:10px;border-top:1px solid rgba(32,50,65,.7)}.mobileMenuBtn{display:none}.layoutShell{height:calc(100vh - 68px);min-height:calc(100vh - 68px);overflow:hidden}.layoutShell .side{overflow:auto}.layoutShell .main{overflow:auto;min-height:0;height:100%;padding-bottom:42px}@media(max-width:1000px){.mobileMenuBtn{display:inline-flex}.layoutShell{position:relative;overflow:hidden}.layoutShell .side{display:none;position:fixed;top:68px;left:0;bottom:0;width:min(290px,86vw);z-index:80;box-shadow:20px 0 50px rgba(0,0,0,.45)}.layoutShell .side.open{display:block}.layoutShell .main{width:100%;overflow:auto}.main{max-width:none}}@media(max-width:650px){.g2,.g3,.g4,.formgrid,.optionGrid,.positionGrid{grid-template-columns:1fr}.commandHero{grid-template-columns:1fr}.hero h1{font-size:25px}.saveTools .btn{flex:1 1 auto}.topstats{max-width:62%}.topstats .pill:nth-child(n+3){display:none}.mobileMenuBtn{flex:0 0 auto}.layoutShell .side{top:62px}}

/* MANDATO — expansão avançada */
.feedWrap{max-width:760px;margin:0 auto}.feedCard{overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border-radius:18px}.feedHead{padding:14px 16px;display:flex;align-items:center;gap:10px}.feedAvatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:800}.feedImage{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--panel2)}.feedBody{padding:16px}.feedActions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}.feedTag{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px}.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.calendarDay{min-height:105px;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.018)}.calendarDay.today{outline:2px solid var(--accent)}.calendarDay.mutedDay{opacity:.48}.calendarEvent{font-size:11px;margin-top:5px;padding:5px;border-radius:7px;background:var(--panel2);cursor:pointer}.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}.timelineItem{position:relative;margin:0 0 18px}.timelineItem:before{content:'';position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}.noticeDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}.unread{box-shadow:inset 3px 0 0 var(--accent)}.statusFlow{display:flex;gap:6px;flex-wrap:wrap}.statusFlow span{padding:6px 9px;border-radius:999px;background:var(--panel2);font-size:11px}.statusFlow span.on{background:var(--accent);color:#071014;font-weight:800}.miniBar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}.miniBar i{display:block;height:100%;background:var(--accent)}.chipRow{display:flex;gap:6px;flex-wrap:wrap}.sourceMark{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.8}.priorityHigh{border-color:#8f5a63}.softPanel{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.018)}@media(max-width:780px){.calendarGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.calendarDay{min-height:90px}.feedWrap{max-width:none}}
.premiumNews{overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}.premiumNews:hover{transform:translateY(-2px)}.newsCover{min-height:210px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,rgba(53,194,160,.18),rgba(79,140,255,.18));border-bottom:1px solid var(--border)}.newsCover h2{font-size:25px;margin:10px 0 6px}.newsCover p{max-width:760px;color:var(--muted)}.newsStats{display:flex;gap:18px;padding:10px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}.actionCard{height:100%;background:rgba(255,255,255,.02)}.softPanel{padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02)}
/* MANDATO VISUAL REDESIGN v1 */
:root{--bg:#070711;--panel:#0e0e1a;--panel2:#151326;--line:#29243f;--text:#f4f1fb;--muted:#9e98b2;--accent:#9b6cff;--accent2:#6f4bd8;--good:#5bd18a;--warn:#f2b84b;--danger:#ed6a7a;--shadow:0 18px 55px rgba(0,0,0,.34)}
html,body{background:radial-gradient(circle at 78% -12%,rgba(120,73,220,.28),transparent 34%),radial-gradient(circle at 8% 35%,rgba(66,45,130,.16),transparent 30%),var(--bg);scroll-behavior:smooth}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.6),transparent 78%)}
.topbar{height:64px;background:rgba(7,7,17,.82);border-bottom-color:rgba(155,108,255,.16);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.brand{font-size:15px}.brandMark{background:linear-gradient(135deg,#b58aff,#6945d5);color:#fff;box-shadow:0 0 24px rgba(155,108,255,.28)}
.shell{grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}.side{background:rgba(9,8,18,.72);border-right-color:rgba(155,108,255,.13);backdrop-filter:blur(18px)}
.navgroup{color:#6e6684;margin-top:20px}.navbtn{color:#aaa3bb;border-radius:12px;padding:10px 12px;transition:background .18s ease,border .18s ease,color .18s ease,transform .18s ease}.navbtn:hover{transform:translateX(2px);background:rgba(155,108,255,.07);border-color:rgba(155,108,255,.14)}.navbtn.active{background:linear-gradient(90deg,rgba(155,108,255,.18),rgba(155,108,255,.05));border-color:rgba(155,108,255,.28);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.main{padding:26px;max-width:1580px}.hero h1{letter-spacing:-.025em}.hero{animation:pageIn .28s ease both}
.card,.startcard{background:linear-gradient(145deg,rgba(20,18,34,.96),rgba(11,10,20,.96));border-color:rgba(155,108,255,.15);box-shadow:0 14px 42px rgba(0,0,0,.22);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.card:hover{border-color:rgba(155,108,255,.28)}
.btn{background:#171528;border-color:#332d4c;transition:transform .14s ease,filter .14s ease,box-shadow .14s ease,border-color .14s ease}.btn:hover{filter:none;transform:translateY(-1px);border-color:rgba(155,108,255,.38);box-shadow:0 8px 20px rgba(0,0,0,.18)}.btn:active{transform:translateY(1px) scale(.985)}.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #b58aff;outline-offset:2px}.btn.primary{background:linear-gradient(135deg,#a779ff,#6945d5);color:#fff;box-shadow:0 8px 24px rgba(106,67,213,.22)}
.metric{letter-spacing:-.03em}.pill{background:rgba(255,255,255,.025);border-color:rgba(155,108,255,.16)}
input,select,textarea{background:#0b0a14;border-color:#302a45}input:focus,select:focus,textarea:focus{border-color:#8f65ef;box-shadow:0 0 0 3px rgba(155,108,255,.08)}
.modal{background:rgba(3,3,8,.78);backdrop-filter:blur(7px)}.modalbox{background:linear-gradient(145deg,#141222,#0b0a12);border-color:rgba(155,108,255,.24);animation:modalIn .2s ease both}
.toast{background:#151126;border-color:rgba(155,108,255,.28)}
.view.active{animation:viewIn .24s ease both}.card{animation:cardIn .25s ease both}.card:nth-child(2){animation-delay:.025s}.card:nth-child(3){animation-delay:.05s}.card:nth-child(4){animation-delay:.075s}

async function initDB(){
 return new Promise((res)=>{
  try{
   if(typeof indexedDB==='undefined')throw new Error('IndexedDB indisponível');
   const req=indexedDB.open(DB_NAME,1);
   req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};
   req.onsuccess=()=>{db=req.result;storageMode='indexeddb';res()};
   req.onerror=()=>{storageMode=canUseLocalStorage()?'localstorage':'memory';res()};
  }catch(e){storageMode=canUseLocalStorage()?'localstorage':'memory';res()}
 })
}
async function dbGet(id){
 if(storageMode==='indexeddb')return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 if(storageMode==='localstorage')return localProfiles().find(x=>x.id===id);
 return memoryProfiles.get(id);
}
async function dbPut(x){
 if(storageMode==='indexeddb')return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
 if(storageMode==='localstorage'){const arr=localProfiles();const i=arr.findIndex(v=>v.id===x.id);if(i>=0)arr[i]=x;else arr.push(x);writeLocalProfiles(arr);return}
 memoryProfiles.set(x.id,x);
}
async function dbAll(){
 if(storageMode==='indexeddb')return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 if(storageMode==='localstorage')return localProfiles();
 return [...memoryProfiles.values()];
}
async function dbDelete(id){
 if(storageMode==='indexeddb')return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
 if(storageMode==='localstorage'){writeLocalProfiles(localProfiles().filter(x=>x.id!==id));return}
 memoryProfiles.delete(id);
}

let firebaseReady=false;

const MANDATO_SESSION_KEY='MANDATO_AUTH_SESSION_V1';
const MANDATO_SESSION_MAX_AGE=3650*24*60*60*1000;
let authBusy=false;
function authStore(remember){return remember?localStorage:sessionStorage}
function clearAuthSessions(){try{localStorage.removeItem(MANDATO_SESSION_KEY)}catch(e){}try{sessionStorage.removeItem(MANDATO_SESSION_KEY)}catch(e){}}
function createSession(userId,remember){const token=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());const data={token,userId,createdAt:Date.now(),expiresAt:Date.now()+MANDATO_SESSION_MAX_AGE,sessionVersion:Number(user?.sessionVersion||0)};clearAuthSessions();try{authStore(remember).setItem(MANDATO_SESSION_KEY,JSON.stringify(data));return true}catch(e){return false}}
function readSession(){for(const store of [localStorage,sessionStorage]){try{const raw=store.getItem(MANDATO_SESSION_KEY);if(!raw)continue;const x=JSON.parse(raw);if(x&&x.userId&&x.expiresAt>Date.now())return {data:x,store}}catch(e){}}clearAuthSessions();return null}
function clearSession(){clearAuthSessions()}
function bytesToB64(bytes){let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin)}
function b64ToBytes(str){const bin=atob(str);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function hashPassword(password,saltB64){if(!crypto?.subtle)throw new Error('A criptografia segura do navegador não está disponível.');const salt=saltB64?b64ToBytes(saltB64):crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,256);return {hash:bytesToB64(new Uint8Array(bits)),salt:bytesToB64(salt)} }
async function verifyPassword(password,u){if(u?.passwordHashAlgo==='PBKDF2-SHA256'&&u.passwordHash&&u.passwordSalt){const x=await hashPassword(password,u.passwordSalt);return x.hash===u.passwordHash}return u?.passwordHash===btoa(unescape(encodeURIComponent(password)))}

async function initGoogleAuth(){
 try{
   await loadMandatoFirebaseConfig();
   const cfg=window.MANDATO_FIREBASE_CONFIG||{};
   if(!cfg.apiKey||!cfg.authDomain||!cfg.projectId||!cfg.appId)return false;
   if(!window.firebase){
     await new Promise((resolve,reject)=>{
       const s=document.createElement('script');
       s.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js';
       s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
     });
     await new Promise((resolve,reject)=>{
       const s=document.createElement('script');
       s.src='https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js';
       s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
     });
   }
   if(!firebase.apps.length)firebase.initializeApp(cfg);
   firebaseAuth=firebase.auth();
   firebaseReady=true;
   return true;
 }catch(e){
   firebaseReady=false;
   return false;
 }
}

async function loginGoogle(){
 if(authBusy)return;
 if(location.protocol==='file:')return authError('Google real exige que o jogo esteja publicado em um domínio autorizado.');
 setAuthBusy(true);clearAuthError();
 try{
   if(!firebaseReady)await initGoogleAuth();
   if(!firebaseReady)throw new Error('Configure o Firebase no bloco MANDATO_FIREBASE_CONFIG primeiro.');
   const remember=document.getElementById('aRemember')?.checked!==false;
   await firebaseAuth.setPersistence(remember?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);
   const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
   const result=await firebaseAuth.signInWithPopup(provider);const g=result.user;
   if(!g||!g.email)throw new Error('O Google não retornou um e-mail válido.');
   const all=await dbAll();let u=all.find(x=>x.googleUid===g.uid)||all.find(x=>x.email===g.email.toLowerCase());
   if(!u){u=blankProfile(g.displayName||'Usuário Google',(g.email.split('@')[0]||'usuario').replace(/[^a-zA-Z0-9_]/g,''),g.email.toLowerCase());u.googleUid=g.uid;u.authProvider='google';u.photoURL=g.photoURL||'';await dbPut(u)}else{u.googleUid=g.uid;u.authProvider='google';u.photoURL=g.photoURL||u.photoURL||'';u.lastLogin=Date.now();await dbPut(u)}
   user=u;enterGame();
 }catch(e){authError('Não foi possível entrar. Verifique a conexão e tente novamente.');}
 finally{setAuthBusy(false,'ENTRAR')}

function renderElections(){const el=document.getElementById('elections');if(!el||!save)return;ensureCampaignStrategy(save);const c=save.character,upcoming=save.elections.filter(e=>e.status!=='encerrada'),poll=generateSimulatedPoll(),max=Math.max(1,...poll.results.map(x=>x.value)),office=save.campaignStrategy.office||c.office||'Prefeito',top=poll.themeInterest||[],known=poll.proposalAwareness||[];el.innerHTML=`<div class="hero"><div><div class="tag">ELEIÇÕES E PESQUISAS</div><h1>Ciclos eleitorais</h1><p>Pesquisas são modelos do universo simulado. Interesse por tema não é intenção de voto.</p></div><div class="actions"><button class="btn primary" onclick="enterElection()">PREPARAR DISPUTA</button><button class="btn" onclick="strategyOpenForOffice('${escapeHtml(office)}')">${save.campaignStrategy.priorities.length?'REVISAR ESTRATÉGIA':'DEFINIR ESTRATÉGIA'}</button></div></div><div class="grid g4">${cardMetric('Próximo ciclo',upcoming[0]?dateLabel(upcoming[0].date):'A definir')}${cardMetric('Intenção',Math.round(poll.results[0].value)+'%','cenário simulado')}${cardMetric('Rejeição',Math.round(c.rejection)+'%')}${cardMetric('Conhecimento',Math.round(poll.diagnostics.knowledge)+'%','modelo simulado')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="row"><div><h3>Pesquisa simulada</h3><div class="small muted">${poll.institute} · ${dateLabel(poll.date)} · ${poll.scope}</div></div><span class="pill">±${poll.margin.toFixed(1)} p.p.</span></div>${poll.results.map(x=>`<div class="item"><div class="row"><span>${escapeHtml(x.name)}</span><b>${x.value.toFixed(1)}%</b></div><div class="miniBar"><i style="width:${Math.min(100,x.value/max*100)}%"></i></div></div>`).join('')}<p class="small muted">Amostra simulada: ${fmt(poll.sample)} entrevistas · confiança ${poll.confidence}%. Intenção de voto considera também rejeição, reconhecimento, recursos, contexto e adversários.</p><button class="btn sm" onclick="savePollSnapshot()">REGISTRAR PESQUISA</button></div><div class="card"><h3>O que preocupa os eleitores</h3><p class="small muted">Importância temática na amostra-modelo; não representa voto no candidato.</p>${top.map(x=>`<div class="item"><div class="row"><span>${escapeHtml(x.theme)}</span><b>${x.importance.toFixed(0)}/100</b></div><div class="miniBar"><i style="width:${Math.min(100,x.importance)}%"></i></div></div>`).join('')||'<div class="muted">Sem diagnóstico temático.</div>'}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Conhecimento das propostas</h3>${known.map(x=>`<div class="item"><div class="row"><span>${escapeHtml(x.theme)}</span><b>${x.known.toFixed(0)}%</b></div><div class="miniBar"><i style="width:${Math.min(100,x.known)}%"></i></div><div class="small muted">Conhecimento estimado da proposta, não aprovação e não intenção de voto.</div></div>`).join('')||'<div class="muted">Apresente propostas alinhadas à estratégia para medir conhecimento.</div>'}</div><div class="card"><h3>Histórico de pesquisas</h3>${save.polls.slice(-6).reverse().map(p=>`<div class="item"><div class="row"><b>${escapeHtml(p.institute||'Instituto simulado')}</b><span>${dateLabel(p.date)}</span></div><div class="small muted">${p.results.map(r=>escapeHtml(r.name)+': '+Number(r.value).toFixed(1)+'%').join(' · ')}</div>${p.themeInterest?.length?`<div class="small muted">Temas mais citados: ${p.themeInterest.slice(0,3).map(x=>escapeHtml(x.theme)).join(' · ')}</div>`:''}</div>`).join('')||'<div class="muted">Nenhuma pesquisa registrada ainda.</div>'}</div></div>`}
function strategyThemeDiagnostics(office){ensureCampaignStrategy(save);const cs=save.campaignStrategy,segments=save.voterSegments||buildVoterSegments(save),rel=campaignContext(office||cs.office||save.character.office);const interest={};MANDATO_CAMPAIGN_THEMES.forEach(t=>{let sum=0,weight=0;segments.forEach(g=>{const gw=Number(g.weights?.[t.id]||1);sum+=gw*(g.size||0);weight+=g.size||0});interest[t.id]=weight?sum/weight:1});const proposalEval={};save.proposals.forEach(p=>{const text=(p.title||p.name||'')+' '+(p.area||'')+' '+(p.description||p.desc||'');MANDATO_CAMPAIGN_THEMES.forEach(t=>{if(t.areas.some(a=>text.toLowerCase().includes(a.toLowerCase())))proposalEval[t.id]=(proposalEval[t.id]||0)+1})});const knowledge=clamp(15+(cs.speeches?.length||0)*6+(cs.priorities?.length||0)*3+(save.proposals.length*2));const coherence=strategyCoherence();return {interest,proposalEval,knowledge,coherence,rel}}
function generateSimulatedPoll(){ensureCampaignStrategy(save);const c=save.character,office=save.campaignStrategy.office||c.office||'Prefeito',d=strategyThemeDiagnostics(office),top=save.campaignStrategy.priorities||[];let thematicFit=0,themeMass=0;top.forEach(p=>{const relevance=d.rel[p.id]||.5,interest=d.interest[p.id]||1;thematicFit+=relevance*interest*(p.weight||0);themeMass+=(p.weight||0)});thematicFit=themeMass?thematicFit/themeMass:0;const base=clamp(8+c.popularity*.42+c.reputation*.14+c.influence*.08+(c.party?2.5:0)-c.rejection*.28+thematicFit*3+(d.coherence-50)*.035);const regional=clamp(base+(c.regionalRep-30)*.10);const names=[c.politicalName||c.name,'Candidata adversária A','Candidato adversário B','Indecisos / brancos'];const raw=[regional,clamp(25+save.world.candidates[0].popularity*.40+save.world.candidates[0].reputation*.16),clamp(22+save.world.candidates[1].popularity*.40+save.world.candidates[1].reputation*.16),Math.max(5,18-rnd(0,5))];const total=raw.reduce((a,b)=>a+b,0);const themeInterest=Object.entries(d.interest).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,v])=>({theme:campaignTheme(id)?.label||id,importance:Number((v*100).toFixed(1))}));const proposalAwareness=Object.entries(d.proposalEval).map(([id,n])=>({theme:campaignTheme(id)?.label||id,known:clamp(d.knowledge+n*7)})).sort((a,b)=>b.known-a.known).slice(0,8);return {date:save.date,institute:pick(['Instituto MANDATO','Opinião Simulada','Painel Eleitoral MANDATO']),scope:`${save.municipality||save.region||'Brasil'} · cenário simulado`,sample:rndi(900,2400),margin:rnd(2.4,4.2),confidence:95,results:raw.map((v,i)=>({name:names[i],value:v/total*100})),themeInterest,proposalAwareness,diagnostics:{knowledge:d.knowledge,coherence:d.coherence,relevance:d.rel}}}

function electionEligibility(office){const c=save.character;const age=Number(c.age||0);const minAge={Vereador:18,Prefeito:21,'Deputado estadual':21,'Deputado federal':21,Governador:30,Senador:35,'Presidente da República':35}[office]||18;if(age<minAge)return `A idade mínima simulada para ${office} é ${minAge} anos.`;if(!c.party)return 'No cenário brasileiro, a candidatura exige filiação partidária deferida; escolha um partido antes de disputar.';if(Number(c.experience||0)<({Vereador:0,Prefeito:2,'Deputado estadual':3,'Deputado federal':4,Governador:8,Senador:8,'Presidente da República':12}[office]||0))return 'Sua trajetória ainda não oferece experiência política suficiente para esta disputa.';if(Number(c.cash||0)<5000)return 'Recursos insuficientes para estruturar uma candidatura responsável.';return ''}
function enterElection(){const c=save.character;const offices=['Vereador','Prefeito','Deputado estadual','Deputado federal','Governador','Senador','Presidente da República'];const eligible=offices.filter(o=>!electionEligibility(o));if(!eligible.length)return toast('Nenhum cargo atende aos requisitos atuais. Construa trajetória, filiação, recursos e experiência.',true);pendingElection={office:eligible[0]};ensureCampaignStrategy(save);if(!save.campaignStrategy.priorities.length){return strategyOpenForOffice(eligible[0])};modal(`<div class="row"><div><div class="tag">CANDIDATURA</div><h2>Preparar disputa eleitoral</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><p>O cargo é definido por requisitos institucionais e pela trajetória. Pesquisas são apenas modelos do universo simulado.</p><div class="field"><label>Cargo pretendido</label><select id="electionOffice" onchange="pendingElection.office=this.value;document.getElementById('electionEstimate').textContent=Math.round(pollEstimateForOffice(this.value))+'%';document.getElementById('electionReason').textContent=electionEligibility(this.value)||'Requisitos básicos atendidos.'">${offices.map(o=>`<option value="${escapeHtml(o)}" ${o===eligible[0]?'selected':''} ${electionEligibility(o)?'disabled':''}>${escapeHtml(o)}${electionEligibility(o)?' — indisponível':''}</option>`).join('')}</select></div><div class="grid g2" style="margin-top:12px"><div class="card metricCard"><div class="label">Pesquisa estimada</div><div class="metric" id="electionEstimate">${Math.round(pollEstimateForOffice(eligible[0]))}%</div><div class="small muted">cenário simulado</div></div>${cardMetric('Recursos',money(c.cash),'capacidade de campanha')}</div><p id="electionReason" class="small muted">Requisitos básicos atendidos.</p><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="runElection()">APURAR RESULTADO</button></div>`)}
function pollEstimateForOffice(office){const c=save.character;const officeFactor={Vereador:8,Prefeito:5,'Deputado estadual':2,'Deputado federal':0,Governador:-7,Senador:-8,'Presidente da República':-15}[office]||0;return clamp(10+c.popularity*.45+c.reputation*.16+c.influence*.12+c.partyRep*.05+c.regionalRep*.08-c.rejection*.28+officeFactor+(c.experience*.25))}
function runElection(){if(!save||!pendingElection)return;const c=save.character,office=pendingElection.office||'Vereador',reason=electionEligibility(office);if(reason)return toast(reason,true);const base=pollEstimateForOffice(office);const campaign=(c.communication+c.oratory+c.negotiation+c.strategy)/4;const context=(c.regionalRep*.10+c.partyRep*.08+c.influence*.08);const volatility=rnd(-5,5);const strength=clamp(base*.62+campaign*.18+context+volatility);const win=strength>=50;const votes=Math.max(1,Math.round(rndi(18000,85000)*(strength/100)));const result={id:uid(),date:save.date,year:save.year,office,party:c.party,result:win?'VITÓRIA':'DERROTA',votes,estimatedSupport:Math.round(base),finalStrength:Math.round(strength),simulated:true};save.elections.push(result);save.stats.elections++;if(win){save.stats.wins++;c.popularity=clamp(c.popularity+6);c.reputation=clamp(c.reputation+5);c.influence=clamp(c.influence+7);c.regionalRep=clamp(c.regionalRep+8);c.experience+=4;c.office=office}else{save.stats.losses++;c.popularity=clamp(c.popularity-3);c.reputation=clamp(c.reputation-2);c.influence=clamp(c.influence-1);c.regionalRep=clamp(c.regionalRep+1);c.experience+=1}addNews('ELEIÇÕES',win?'Vitória eleitoral':'Derrota eleitoral',win?`${c.politicalName} venceu a disputa simulada para ${office}.`:`${c.politicalName} perdeu a disputa para ${office}; a carreira continua com as consequências registradas.`,'info',save.region,{typeLabel:'Resultado eleitoral simulado',importance:'alta'});advHistory(win?'Vitória eleitoral':'Derrota eleitoral',`${office}: ${result.result}. Força final simulada ${result.finalStrength}%.`,result.id);advNotify('Resultado eleitoral',win?'Vitória registrada':'Derrota registrada',`${office}: ${result.result}.`,'elections',result.id,null,true);pendingElection=null;closeModal();saveState('Resultado eleitoral registrado');renderCareerApp();showCareerView('elections')}

function advanceWeek(){
 if(!save)return;
 const old=save.date,d=new Date(old+'T12:00:00');d.setDate(d.getDate()+7);save.date=iso(d);save.week++;save.year=d.getFullYear();save.stats.weeks++;
 simulateEconomy();simulateWorld();simulatePlayerLife();simulateElectionClock();
 save.history.push({date:save.date,title:'Semana concluída',text:`O mundo político avançou até ${dateLabel(save.date)}.`});

function simulateEconomy(){
 const e=save.economy,c=save.character;
 const shock=rnd(-.55,.55)+(c.approval-50)/700;
 e.growth=clamp(e.growth+rnd(-.25,.25),-3,6);e.inflation=clamp(e.inflation+rnd(-.12,.16)-e.growth*.025,0,15);e.unemployment=clamp(e.unemployment+rnd(-.15,.15)-e.growth*.035,3,18);e.confidence=clamp(e.confidence+shock+rnd(-1.2,1.2));e.debt=clamp(e.debt+rnd(-.25,.35));e.investment=clamp(e.investment+rnd(-.4,.4));e.gdp=clamp(e.gdp*(1+e.growth/520),1,5);
 if(Math.random()<.06){addNews('ECONOMIA','Pressão econômica aumenta',`Indicadores apontam volatilidade e exigem atenção dos governos.`, 'warn')}
}
function simulateWorld(){
 const c=save.character;
 save.world.candidates.forEach(p=>{
  p.popularity=clamp(p.popularity+rnd(-1.6,1.6));p.approval=clamp(p.approval+rnd(-1.4,1.4));p.reputation=clamp(p.reputation+rnd(-.7,.7));
  if(Math.random()<.025){p.party=pick(parties).sigla;p.history.push({date:save.date,event:'mudança partidária'});addNews('PARTIDOS',`${p.name} mudou de partido`,`O político agora atua pelo partido ${p.party}.`)}
  if(Math.random()<.015){p.influence=clamp((p.influence||50)+rndi(-8,10));}
 });
 if(Math.random()<.25){
  const ev=pick(eventTemplates);const text=ev[1];save.events.push({date:save.date,title:ev[1],text,scope:pick(['MINHA CIDADE','MEU ESTADO','OUTROS ESTADOS','BRASIL','MUNDO'])});addNews(ev[0],ev[1],text,ev[2],pick(['MINHA CIDADE','MEU ESTADO','BRASIL','MUNDO']));
 }
 if(Math.random()<.035){
  const p={id:uid(),name:pick(firstNames)+' '+pick(lastNames),age:rndi(26,42),state:pick(Object.keys(states)),city:'',party:pick(parties).sigla,ideology:pick(ideologies),office:'Liderança emergente',experience:rndi(0,4),reputation:rndi(30,55),popularity:rndi(20,45),approval:rndi(40,65),rejection:rndi(10,30),resources:rndi(10,35),goal:'ganhar eleição',personality:pick(['popular','técnico','negociador']),history:[]};p.city=pick(states[p.state]);save.world.candidates.push(p);addNews('POLÍTICA','Novo nome surge no cenário',`${p.name} começou a ganhar espaço em ${stateNames[p.state]}.`)}
}
function simulatePlayerLife(){
 const c=save.character;
 if(Math.random()<.35)c.experience+=1;
 if(Math.random()<.22)c.communication=clamp(c.communication+rnd(.1,.7));
 if(Math.random()<.18)c.negotiation=clamp(c.negotiation+rnd(.1,.8));
 if(Math.random()<.15)c.reputation=clamp(c.reputation+rnd(-1,1));
 if(c.office!=='Cidadão'&&Math.random()<.12)c.approval=clamp(c.approval+rnd(-2,2));
 if(Math.random()<.08){const good=Math.random()<.6;c.popularity=clamp(c.popularity+(good?rnd(.5,2):-rnd(.5,2)));addNews('POLÍTICA',good?'Sua atuação recebeu atenção positiva':'Críticas atingiram sua atuação',good?'Aliados destacaram seu trabalho.':'Adversários questionaram suas decisões.',good?'info':'warn')}
}
function simulateElectionClock(){
 const d=new Date(save.date+'T12:00:00');
 if(d.getMonth()===9&&d.getDate()<=14&&d.getDate()+7>4){addNews('ELEIÇÕES','Semana eleitoral no país','O ciclo eleitoral simulado movimenta partidos e candidatos.');save.events.push({date:save.date,title:'Ciclo eleitoral',text:'Eleições ocorreram em várias regiões.',scope:'BRASIL'})}
}

const MANDATO_SCHEMA_VERSION=3;
const appState={context:'auth',accountView:'command',careerView:'dashboard',adminView:'home',activeSaveId:null,pendingSave:false,initialized:false,loading:false,error:null};
window.MANDATO_ADMIN_GOOGLE_UIDS=window.MANDATO_ADMIN_GOOGLE_UIDS||[];
window.MANDATO_ADMIN_EMAILS=window.MANDATO_ADMIN_EMAILS||[];
function deepClone(x){return x==null?x:structuredClone(x)}
function normalizeSave(raw,ownerId){const s=deepClone(raw||{});s.schemaVersion=MANDATO_SCHEMA_VERSION;s.id=s.id||uid();s.ownerId=ownerId||s.ownerId||'';s.name=String(s.name||'Minha carreira');s.description=String(s.description||'');s.createdAt=Number(s.createdAt)||Date.now();s.updatedAt=Number(s.updatedAt)||s.createdAt;s.lastAccessAt=Number(s.lastAccessAt)||s.updatedAt;s.date=s.date||`${s.year||2026}-01-05`;s.week=Number(s.week)||1;s.year=Number(s.year)||Number(String(s.date).slice(0,4))||2026;s.country=s.country||s.scenario?.country||'Brasil';s.region=s.region||s.character?.uf||'';s.municipality=s.municipality||s.character?.city||'';s.scenario={mode:s.scenario?.mode||'atual',year:Number(s.scenario?.year)||s.year,difficulty:s.scenario?.difficulty||'normal',timeSpeed:s.scenario?.timeSpeed||'normal',realism:s.scenario?.realism||'padrão',rules:s.scenario?.rules||s.settings?.customRules||''};s.character=s.character||{};s.character.name=s.character.name||'Personagem';s.character.politicalName=s.character.politicalName||s.character.name;s.character.uf=s.character.uf||s.region;s.character.city=s.character.city||s.municipality;s.character.nationality=s.character.nationality||'Brasileira';s.character.party=s.character.party||'';s.character.partyHistory=Array.isArray(s.character.partyHistory)?s.character.partyHistory:[];s.character.ideology=s.character.ideology||'Independente';s.character.spectrum=s.character.spectrum||'Sem posicionamento definido';s.character.ideologyProfile=s.character.ideologyProfile||{};s.character.initialSituation=s.character.initialSituation||s.character.origin||'Cidadão sem experiência';s.settings={autosave:true,eventNotifications:true,eventFrequency:'normal',newsDetail:'normal',...s.settings};for(const k of ['proposals','promises','relations','events','news','history','polls','elections','calendar','investigations','achievements','documents','notifications'])if(!Array.isArray(s[k]))s[k]=[];s.stats={weeks:0,elections:0,wins:0,losses:0,decisions:0,...s.stats};s.economy=s.economy||{};s.budget=s.budget||{};s.world=s.world||makeWorld();return s}
function normalizeUser(raw){const u=deepClone(raw||{});u.schemaVersion=2;u.saves=(Array.isArray(u.saves)?u.saves:[]).map(x=>normalizeSave(x,u.id));u.achievements=Array.isArray(u.achievements)?u.achievements:[];u.settings={theme:'dark',accent:'#35c2a0',volume:70,animations:true,language:'pt-BR',uiScale:100,notifications:true,privacy:'private',...(u.settings||{})};return u}
async function persistUser(){if(!user)throw new Error('Sessão inexistente');user=normalizeUser(user);await dbPut(user);appState.pendingSave=false}
async function persistActiveSave(){if(!user||!save)return;const normalized=normalizeSave(save,user.id);normalized.updatedAt=Date.now();normalized.lastAccessAt=Date.now();const idx=user.saves.findIndex(x=>x.id===normalized.id);if(idx<0)user.saves.push(deepClone(normalized));else user.saves[idx]=deepClone(normalized);save=deepClone(normalized);appState.activeSaveId=save.id;await persistUser()}
function mountAuth(){
 const existing=document.getElementById('auth');
 if(existing)return existing;
 const tpl=document.getElementById('authTemplate');
 if(!tpl)return null;
 const auth=tpl.content.firstElementChild?.cloneNode(true);
 if(!auth)return null;
 document.body.insertBefore(auth,document.getElementById('gameTemplate')||document.body.firstChild);
 return auth;
}
function unmountAuth(){
 const auth=document.getElementById('auth');
 if(auth)auth.remove();
}
function mountGame(){
 const existing=document.getElementById('game');
 if(existing)return existing;
 const tpl=document.getElementById('gameTemplate');
 if(!tpl)return null;
 const game=tpl.content.firstElementChild?.cloneNode(true);
 if(!game)return null;
 document.body.appendChild(game);
 bindGameNavigation();
 return game;
}
function unmountGame(){
 const game=document.getElementById('game');
 if(game)game.remove();
}
function setContext(context){
 appState.context=context;
 if(context==='auth'){
   unmountGame();
   const auth=mountAuth();
   if(!auth)return;
   ['accountLayout','careerLayout','adminLayout'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
   auth.classList.remove('hidden');
 }else{
   unmountAuth();
   const game=mountGame();
   if(!game)return;
   ['accountLayout','careerLayout','adminLayout'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
   if(context==='account')document.getElementById('accountLayout')?.classList.remove('hidden');
   if(context==='career')document.getElementById('careerLayout')?.classList.remove('hidden');
   if(context==='admin')document.getElementById('adminLayout')?.classList.remove('hidden');
   game.classList.remove('hidden');
   document.getElementById('auth')?.classList.add('hidden');
 }
 document.querySelectorAll('.side').forEach(x=>x.classList.remove('open'));
}

function renderError(id,error){const el=document.getElementById(id);if(el)el.innerHTML=`<div class="stateCard errorState"><div class="tag">ERRO DE CARREGAMENTO</div><h2>Esta área não pôde ser carregada.</h2><p class="muted">${escapeHtml(error?.message||String(error||'Erro desconhecido'))}</p><button class="btn primary" onclick="renderCareerPage('${id}')">TENTAR NOVAMENTE</button></div>`}
function showAccountView(v){const valid=['command','saves','achievements','settings','profile','help','credits'];if(!valid.includes(v))v='command';appState.accountView=v;setContext('account');document.querySelectorAll('#accountLayout .view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.accountSide [data-account-view]').forEach(x=>x.classList.toggle('active',x.dataset.accountView===v));renderTopAccount()}
function showCareerView(v){if(!save)return showAccountView('command');const valid=['dashboard','character','actions','calendar','history','party','campaign','elections','legislative','government','proposals','policies','economy','network','relationsPolitics','news','national','regions','international','leaders','events','careerSettings'];if(!valid.includes(v))v='dashboard';appState.careerView=v;setContext('career');document.querySelectorAll('#careerLayout .view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.careerSide [data-career-view]').forEach(x=>x.classList.toggle('active',x.dataset.careerView===v));renderTopCareer();if(!document.getElementById(v)?.innerHTML.trim())renderCareerPage(v)}
function showView(v){if(['command','saves','achievements','settings','profile','help','credits'].includes(v))return showAccountView(v);if(save)return showCareerView(v);return showAccountView('command')}
function renderParty(){const el=document.getElementById('party');if(!el||!save)return;const q=(window.partySearch||'').toLowerCase();const list=MANDATO_REAL_PARTIES.filter(p=>!q||(p.sigla+' '+p.name).toLowerCase().includes(q));el.innerHTML=`<div class="hero"><div><div class="tag">PARTIDOS E FILIAÇÃO</div><h1>Catálogo partidário</h1><p>Dados de referência vêm do TSE; alianças, apoio e comportamento no save são simulados.</p></div></div><div class="card"><div class="field"><label>Pesquisar partido</label><input value="${escapeHtml(window.partySearch||'')}" oninput="window.partySearch=this.value;renderParty()"></div></div><div class="grid g3" style="margin-top:14px">${list.map(p=>`<div class="card"><div class="row"><div><span class="pill">${escapeHtml(p.sigla)}</span><h3>${escapeHtml(p.name)}</h3></div><b>${escapeHtml(p.number)}</b></div><p class="small muted">Registro de referência: ${p.founded} · fonte: ${escapeHtml(p.source)} · atualizado em ${escapeHtml(p.sourceDate)}</p><div class="actions"><button class="btn sm" onclick="showRealParty('${p.sigla}')">DETALHES</button><button class="btn primary sm" onclick="requestPartyAffiliation('${p.sigla}')">SOLICITAR FILIAÇÃO</button></div></div>`).join('')||'<div class="card"><p class="muted">Nenhum partido encontrado.</p></div>'}</div>`}
function showRealParty(sigla){const p=MANDATO_REAL_PARTIES.find(x=>x.sigla===sigla);if(!p)return;modal(`<div class="row"><div><div class="tag">PARTIDO · ${escapeHtml(p.sigla)}</div><h2>${escapeHtml(p.name)}</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><div class="grid g3">${cardMetric('Legenda',p.number)}${cardMetric('Referência',p.founded)}${cardMetric('Fonte',p.source)}</div><p class="small muted">Os dados factuais exibidos são referência cadastral. O posicionamento político e as consequências no jogo devem ser interpretados dentro do cenário.</p>`)}
function requestPartyAffiliation(sigla){const p=MANDATO_REAL_PARTIES.find(x=>x.sigla===sigla);if(!p||!save)return;save.character.party=p.sigla;save.character.partyHistory.push({date:save.date,party:p.sigla,action:'solicitação/registro simulado',source:'TSE-referência'});save.character.partyRep=clamp((save.character.partyRep||20)+3);advHistory('Filiação partidária',`Registro de filiação simulada a ${p.sigla}.`,p.sigla);advNotify('Filiação atualizada','Partido selecionado',`Sua carreira agora registra ${p.sigla}.`,'party',p.sigla,true);saveState('Filiação registrada');renderCareerApp();showCareerView('party')}
function renderCrises(){const el=document.getElementById('crises');if(!el||!save)return;const open=(save.investigations||[]).filter(x=>x.status!=='encerrada');el.innerHTML=`<div class="hero"><div><div class="tag">CRISES E CONTROVÉRSIAS</div><h1>Crises em andamento</h1><p>Alegações, investigações e conclusões são estados diferentes no mundo simulado.</p></div><button class="btn primary" onclick="createSimulatedCrisis()">+ NOVA CRISE</button></div><div class="grid g2">${open.map(x=>`<div class="card"><div class="row"><div><span class="pill">${escapeHtml(x.type||'Crise')}</span><h3>${escapeHtml(x.title||'Ocorrência')}</h3></div><span class="pill">${escapeHtml(x.status||'aberta')}</span></div><p>${escapeHtml(x.description||'')}</p><div class="small muted">${escapeHtml(x.date||save.date)} · envolvidos: ${escapeHtml((x.involved||[]).join(', ')||'não definidos')}</div><div class="actions" style="margin-top:10px"><button class="btn sm" onclick="advanceCrisis('${x.id}')">ATUALIZAR APURAÇÃO</button></div></div>`).join('')||'<div class="card"><h3>Nenhuma crise aberta</h3><p class="muted">O mundo pode gerar controvérsias conforme suas condições.</p></div>'}</div>`}
function createSimulatedCrisis(){const title=prompt('Título da crise simulada:');if(!title)return;const x={id:uid(),date:save.date,type:'Crise administrativa',title,description:prompt('Contexto da crise:')||'Acontecimento fictício em apuração.',status:'alegação/apuração',involved:[save.character.politicalName]};save.investigations.push(x);advHistory('Crise registrada',`A crise "${title}" entrou em apuração.`,x.id);advNotify('Crise política','Nova controvérsia registrada',title,'crises',x.id,true);addNews('CRISES',title,x.description,'warn',save.region,{typeLabel:'Acontecimento simulado',importance:'alta'});saveState('Crise registrada');renderCareerApp();showCareerView('crises')}
function advanceCrisis(id){const x=save.investigations.find(i=>i.id===id);if(!x)return;const stages=['alegação/apuração','investigação','decisão institucional','encerrada'];x.status=stages[Math.min(stages.indexOf(x.status)+1,stages.length-1)];x.updatedAt=save.date;advHistory('Apuração atualizada',`${x.title}: ${x.status}.`,x.id);saveState('Apuração atualizada');renderCareerApp();showCareerView('crises')}
function renderCareerPage(v){const map={dashboard:renderDashboard,character:renderCareer,actions:renderActions,calendar:renderCalendar,history:renderHistory,party:renderParty,campaign:renderCampaign,elections:renderElections,legislative:renderLegislative,government:renderGovernment,proposals:renderProposals,policies:renderPolicies,economy:renderEconomy,network:renderPoliticalNetwork,relationsPolitics:renderRelationsPolitics,news:renderNews,national:renderNational,regions:renderRegions,international:renderInternational,leaders:renderLeaders,events:renderEvents,careerSettings:renderCareerSettings};try{if(typeof map[v]!=='function')throw new Error('Página inexistente: '+v);map[v]()}catch(e){renderError(v,e)}}
function renderCareerApp(){if(!save)return;save=normalizeSave(save,user?.id);const pages=['dashboard','character','actions','calendar','history','party','campaign','elections','legislative','government','proposals','policies','economy','network','relationsPolitics','news','national','regions','international','leaders','events','careerSettings'];pages.forEach(id=>renderLoading(id));pages.forEach(renderCareerPage)}
function renderAccountApp(){const jobs={command:renderAccountDashboard,saves:renderSaves,achievements:renderAchievements,settings:renderAccountSettings,profile:renderAccountProfile,help:renderHelp,credits:renderCredits};Object.keys(jobs).forEach(renderLoading);for(const [id,fn] of Object.entries(jobs)){try{fn()}catch(e){renderError(id,e)}}}
function render(){if(!user){setContext('auth');return}renderAccountApp();if(save)renderCareerApp();if(appState.context==='career')showCareerView(appState.careerView);else if(appState.context==='admin')renderAdminContext();else showAccountView(appState.accountView)}
function enterGame(){appState.activeSaveId=null;appState.pendingSave=false;save=null;setContext('account');renderAccountApp();showAccountView('command')}
async function loadSave(id){if(!user)return showAccountView('command');const raw=user.saves.find(x=>x.id===id);if(!raw)return toast('Save não encontrado nesta conta.',true);try{const normalized=normalizeSave(raw,user.id);normalized.lastAccessAt=Date.now();save=deepClone(normalized);appState.activeSaveId=save.id;user.saves[user.saves.findIndex(x=>x.id===id)]=deepClone(normalized);await persistUser();showCareerLayout();renderCareerApp();showCareerView('dashboard');toast('Carreira carregada')}catch(e){save=null;appState.activeSaveId=null;toast('Falha ao carregar carreira: '+e.message,true);showAccountView('command')}}
async function backToAccount(){try{if(save)await persistActiveSave()}catch(e){toast('Falha ao salvar antes de sair da carreira.',true);return}save=null;appState.activeSaveId=null;appState.pendingSave=false;showAccountLayout();renderAccountApp();showAccountView('command');toast('Carreira salva. Voltou à Central de Comando')}
async function logoutAccount(){if(!user)return;if(!confirm('Sair da conta? O progresso ativo será salvo antes de sair.'))return;try{if(save)await persistActiveSave();clearSession();if(firebaseReady&&firebaseAuth?.currentUser)await firebaseAuth.signOut()}catch(e){toast('Não foi possível encerrar a sessão com segurança: '+(e?.message||e),true);return}const lastEmail=user?.email||'';rememberKnownAccount(user);user=null;save=null;appState.activeSaveId=null;appState.pendingSave=false;appState.accountView='command';appState.careerView='dashboard';appState.adminView='home';closeModal();setContext('auth');showAuth('login');prefillKnownAccount(lastEmail);toast('Sessão encerrada. Sua conta e seus saves continuam salvos.') }
async function saveState(msg='Jogo salvo'){if(!user||!save)return;try{await persistActiveSave();toast(mandatoIcon('check')+' '+msg)}catch(e){toast('Falha ao salvar: '+e.message,true)}}
function markDirty(){appState.pendingSave=true;renderTopCareer()}
function safeFileName(name){return String(name||'mandato-save').replace(/[^\w\- ]+/g,'').trim()||'mandato-save'}
function exportSpecificSave(id){const s=user?.saves?.find(x=>x.id===id);if(!s)return;const blob=new Blob([JSON.stringify(normalizeSave(s,user.id),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safeFileName(s.name)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportSave(){if(save)exportSpecificSave(save.id)}
function validateImportedSave(x){return !!(x&&x.character&&x.economy&&Array.isArray(x.history)&&x.date)}
function importSave(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const raw=JSON.parse(r.result);if(!validateImportedSave(raw))throw new Error('Estrutura de backup incompatível.');const x=normalizeSave(raw,user.id);x.id=uid();x.name=(x.name||'Carreira')+' (importado)';x.createdAt=Date.now();x.updatedAt=Date.now();user.saves.push(deepClone(x));await persistUser();renderAccountApp();await loadSave(x.id)}catch(e){toast('Backup inválido: '+e.message,true)}};r.readAsText(f)};i.click()}
function duplicateSave(id){const s=user?.saves?.find(x=>x.id===id);if(!s)return;const copy=normalizeSave(s,user.id);copy.id=uid();copy.name=(s.name||'Carreira')+' — cópia';copy.createdAt=Date.now();copy.updatedAt=Date.now();copy.lastAccessAt=Date.now();user.saves.push(deepClone(copy));persistUser().then(()=>{renderAccountApp();showAccountView('saves');toast('Save duplicado como carreira independente')}).catch(e=>toast('Falha ao duplicar: '+e.message,true))}
function renameSave(id){const s=user?.saves?.find(x=>x.id===id);if(!s)return;const n=prompt('Novo nome do save:',s.name);if(!n||!n.trim())return;s.name=n.trim();s.updatedAt=Date.now();if(save?.id===id)save.name=s.name;persistUser().then(()=>{renderAccountApp();showAccountView('saves');toast('Save renomeado')}).catch(e=>toast('Falha ao renomear',true))}
function requestDeleteSave(id){const s=user?.saves?.find(x=>String(x.id)===String(id));if(!s)return;modal(`<div class="row"><div><div class="tag">EXCLUSÃO DE CARREIRA</div><h2>Excluir “${escapeHtml(s.name)}”?</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><div class="card"><p>Esta ação remove somente esta carreira do perfil atual. <b>Não é possível desfazer pelo jogo.</b></p><p class="small muted">Use EXPORTAR antes se quiser manter um backup.</p></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn danger" onclick="deleteSave('${s.id}')">EXCLUIR DEFINITIVAMENTE</button></div>`)}
async function deleteSave(id){if(!user)return;const target=String(id);if(!user.saves?.some(x=>String(x.id)===target))return toast('Carreira não encontrada nesta conta.',true);try{const deletingActive=String(save?.id||appState.activeSaveId||'')===target;user.saves=user.saves.filter(x=>String(x.id)!==target);await dbPut(deepClone(user));if(deletingActive){save=null;appState.activeSaveId=null;closeModal();renderAccountApp();showAccountView('saves');toast(mandatoIcon('check')+' Carreira excluída')}else{closeModal();renderSaves();toast(mandatoIcon('check')+' Carreira excluída')}}catch(e){toast('Falha ao excluir carreira: '+(e?.message||e),true)}}
function renderAchievements(){const el=document.getElementById('achievements');if(!el)return;const a=user?.achievements||[],wins=(user?.saves||[]).reduce((n,s)=>n+(s.stats?.wins||0),0);el.innerHTML=`<div class="hero"><div><div class="tag">CONQUISTAS DA CONTA</div><h1>Progresso geral</h1><p>Conquistas acumuladas entre todas as carreiras.</p></div></div><div class="grid g4">${cardMetric('Carreiras',(user?.saves||[]).length)}${cardMetric('Vitórias',wins)}${cardMetric('Conquistas',a.length)}${cardMetric('Semanas',(user?.saves||[]).reduce((n,s)=>n+(s.stats?.weeks||0),0))}</div><div class="card" style="margin-top:14px"><h3>Desbloqueadas</h3><div class="list">${a.map(x=>`<div class="item"><b>${escapeHtml(x.title||x.name||'Conquista')}</b><div class="small muted">${escapeHtml(x.text||x.description||'')}</div></div>`).join('')||'<div class="muted">Ainda não há conquistas.</div>'}</div></div>`}
function renderAccountProfile(){const el=document.getElementById('profile');if(!el)return;el.innerHTML=`<div class="hero"><div><div class="tag">PERFIL DA CONTA</div><h1>${escapeHtml(user?.name||'Usuário')}</h1><p>@${escapeHtml(user?.userName||'')} · ${escapeHtml(user?.email||'')} · ${escapeHtml(user?.authProvider||'local')}</p></div>${user?.photoURL?`<img class="avatar" src="${escapeHtml(user.photoURL)}">`:avatarHtml({name:user?.name})}</div><div class="grid g3">${cardMetric('Carreiras',(user?.saves||[]).length)}${cardMetric('Último acesso',user?.lastLogin?new Date(user.lastLogin).toLocaleDateString('pt-BR'):'—')}${cardMetric('Conta criada',user?.createdAt?new Date(user.createdAt).toLocaleDateString('pt-BR'):'—')}</div><div class="card" style="margin-top:14px"><h3>Identidade da conta</h3><p class="muted">O perfil da conta é separado de qualquer personagem. Alterar seu nome aqui não altera personagens salvos.</p></div>`}
function renderHelp(){const el=document.getElementById('help');if(!el)return;el.innerHTML=`<div class="hero"><div><div class="tag">AJUDA</div><h1>Como usar o MANDATO</h1><p>Conta, saves e carreiras possuem contextos independentes.</p></div></div><div class="grid g2"><div class="card"><h3>Central de Comando</h3><p class="muted">Administre saves e conta. Nenhum menu político aparece aqui.</p></div><div class="card"><h3>Carreira</h3><p class="muted">Ao abrir um save, somente o mundo daquela carreira é carregado.</p></div><div class="card"><h3>Backups</h3><p class="muted">Exporte JSON e importe como cópia independente.</p></div><div class="card"><h3>Contas e salvamento</h3><p class="muted">As contas e carreiras ficam salvas persistentemente neste navegador. Você não precisa criar a mesma conta novamente.</p></div></div>`}
function renderCredits(){const el=document.getElementById('credits');if(!el)return;el.innerHTML=`<div class="hero"><div><div class="tag">CRÉDITOS</div><h1>MANDATO</h1><p>Simulador Político</p></div></div><div class="grid g2"><div class="card"><h2>Desenvolvido por @whrsgabriel</h2><p class="muted">Projeto de simulação política com carreiras independentes, mundo dinâmico, eleições, partidos, notícias, economia e decisões com consequências.</p></div><div class="card"><h3>Transparência</h3><p class="muted">Dados reais de referência são identificados como reais e separados dos acontecimentos fictícios do universo simulado. Integrações externas, quando não configuradas, permanecem claramente indicadas.</p></div></div>`}
function renderAccountDashboard(){const el=document.getElementById('command');if(!el)return;const saves=[...(user?.saves||[])].sort((a,b)=>(b.lastAccessAt||b.updatedAt||0)-(a.lastAccessAt||a.updatedAt||0)),last=saves[0],totalE=saves.reduce((n,s)=>n+(s.stats?.elections||0),0),wins=saves.reduce((n,s)=>n+(s.stats?.wins||0),0);el.innerHTML=`<div class="commandHero"><div class="card"><div class="tag">CENTRAL DE COMANDO</div><h1>Olá, ${escapeHtml(user?.name||'Usuário')}.</h1><p>Data de acesso: ${new Date(user?.lastLogin||Date.now()).toLocaleString('pt-BR')}</p><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="newCareerModal()">＋ CRIAR NOVA CARREIRA</button>${last?`<button class="btn" onclick="loadSave('${last.id}')">▶ CONTINUAR ÚLTIMA CARREIRA</button>`:''}</div></div><div class="card"><div class="profileLine">${user?.photoURL?`<img class="avatar" src="${escapeHtml(user.photoURL)}">`:avatarHtml({name:user?.name})}<div><b>${escapeHtml(user?.name||'Usuário')}</b><div class="small muted">@${escapeHtml(user?.userName||'')}</div></div></div><p class="small muted" style="margin-top:12px">A conta administra saves. O mundo político só existe dentro de uma carreira aberta.</p></div></div><div class="grid g4">${cardMetric('Carreiras',saves.length)}${cardMetric('Eleições',totalE)}${cardMetric('Vitórias',wins)}${cardMetric('Conquistas',(user?.achievements||[]).length)}</div><div class="card" style="margin-top:14px"><div class="row"><div><div class="tag">CARREIRA JOGADA RECENTEMENTE</div><h2 style="margin:.2rem 0">Seus mundos</h2></div><button class="btn" onclick="showAccountView('saves')">VER TODOS</button></div><div class="grid g3" style="margin-top:12px">${saves.slice(0,3).map(saveCardCompact).join('')||`<div class="emptyState"><h2>Você ainda não possui carreiras</h2><p class="muted">Crie sua primeira carreira para começar um mundo político independente.</p><button class="btn primary" onclick="newCareerModal()">CRIAR PRIMEIRA CARREIRA</button></div>`}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Atividade recente</h3><div class="list">${saves.flatMap(s=>(s.history||[]).slice(-3).map(h=>`<div class="item"><b>${escapeHtml(h.title||'Acontecimento')}</b><div class="small muted">${escapeHtml(s.name)} · ${escapeHtml(h.date||'')}</div></div>`)).slice(-6).reverse().join('')||'<div class="muted">Nenhuma atividade registrada.</div>'}</div></div><div class="card"><h3>Notificações da conta</h3><p class="muted">${saves.length?'Seus saves estão disponíveis e separados por identificador próprio.':'Não há notificações porque nenhuma carreira foi criada.'}</p><button class="btn" onclick="showAccountView('settings')">ABRIR CONFIGURAÇÕES</button></div></div>`}
function saveCardCompact(s){return `<div class="card"><div class="profileLine">${avatarHtml(s.character,true)}<div><b>${escapeHtml(s.name)}</b><div class="small muted">${escapeHtml(s.character?.politicalName||'')} · ${escapeHtml(s.character?.office||'Cidadão')}</div></div></div><p class="small muted" style="margin-top:10px">${escapeHtml(s.character?.party||'Sem partido')} · ${escapeHtml(s.character?.spectrum||'Sem posição')} · ${escapeHtml(s.country||'Brasil')} · ${escapeHtml(s.region||s.character?.uf||'')}</p><p class="small muted">Salvo em ${new Date(s.updatedAt||Date.now()).toLocaleString('pt-BR')}</p><div class="saveTools"><button class="btn primary sm" onclick="loadSave('${s.id}')">CONTINUAR</button><button class="btn sm" onclick="showSaveDetails('${s.id}')">DETALHES</button></div></div>`}
function renderSaves(){const el=document.getElementById('saves');if(!el)return;const arr=[...(user?.saves||[])].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));el.innerHTML=`<div class="hero"><div><div class="tag">BIBLIOTECA DE CARREIRAS</div><h1>Meus saves</h1><p>Cada save possui um ID, personagem, mundo e estado próprios.</p></div><button class="btn primary" onclick="newCareerModal()">＋ NOVA CARREIRA</button></div><div class="saveSearch"><input placeholder="Pesquisar save, personagem ou partido" oninput="window.saveSearch=this.value;renderSaves()" value="${escapeHtml(window.saveSearch||'')}"><select onchange="window.saveSort=this.value;renderSaves()"><option value="updated">Último salvamento</option><option value="created">Criação</option><option value="name">Nome</option></select><button class="btn" onclick="importSave()">IMPORTAR BACKUP</button></div><div class="grid g2">${arr.filter(s=>{const q=(window.saveSearch||'').toLowerCase();return !q||(s.name+' '+(s.character?.politicalName||'')+' '+(s.character?.party||'')).toLowerCase().includes(q)}).map(saveCardFull).join('')||'<div class="emptyState"><h2>Você ainda não possui carreiras</h2><p class="muted">Crie a primeira ou restaure um backup válido.</p><button class="btn primary" onclick="newCareerModal()">CRIAR PRIMEIRA CARREIRA</button></div>'}</div>`}
function saveCardFull(s){return `<div class="card"><div class="row"><div class="profileLine">${avatarHtml(s.character,true)}<div><div class="tag">${escapeHtml(s.scenario?.mode||'atual')} · ${new Date(s.updatedAt||Date.now()).toLocaleDateString('pt-BR')}</div><h3>${escapeHtml(s.name)}</h3></div></div><span class="pill">${escapeHtml(s.character?.office||'Cidadão')}</span></div><p>${escapeHtml(s.character?.politicalName||'')} · ${escapeHtml(s.character?.party||'Sem partido')} · ${escapeHtml(s.character?.spectrum||'Sem posição')}</p><p class="small muted">${escapeHtml(s.country||'Brasil')} · ${escapeHtml(s.region||s.character?.uf||'')} · ${escapeHtml(s.municipality||s.character?.city||'')} · jogo em ${dateLabel(s.date)}</p><div class="saveTools"><button class="btn primary sm" onclick="loadSave('${s.id}')">CONTINUAR</button><button class="btn sm" onclick="showSaveDetails('${s.id}')">DETALHES</button><button class="btn sm" onclick="renameSave('${s.id}')">RENOMEAR</button><button class="btn sm" onclick="duplicateSave('${s.id}')">DUPLICAR</button><button class="btn sm" onclick="exportSpecificSave('${s.id}')">EXPORTAR</button><button class="btn danger sm" onclick="requestDeleteSave('${s.id}')">EXCLUIR</button></div></div>`}

function campaignOfficeLevel(office){const x=String(office||'').toLowerCase();if(/vereador|prefeito/.test(x))return 'municipal';if(/governador|deputado estadual/.test(x))return 'state';return 'federal'}

function ensureCampaignStrategy(s){
 if(!s.campaignStrategy||typeof s.campaignStrategy!=='object')s.campaignStrategy={office:null,startedAt:null,priorities:[],history:[],speeches:[],proposalIds:[],promiseLedger:[],coherence:50,opportunism:0,lastChangedAt:null,changeCount:0};

function buildVoterSegments(s){

  {id:'familias',name:'Famílias e moradores locais',size:24,weights:{saude:1.25,educacao:1.25,habitacao:1.2,social:1.15,infraestrutura:1.1}},
  {id:'trabalhadores',name:'Trabalhadores e empregados',size:20,weights:{economia:1.35,seguranca:1.05,infraestrutura:1.1,direitos:1.1}},
  {id:'jovens',name:'Jovens e estudantes',size:16,weights:{educacao:1.25,tecnologia:1.25,cultura:1.15,economia:1.05,ambiente:1.1}},

  {id:'agricultores',name:'Agricultores e produtores',size:rural?10:5,weights:{agricultura:1.65,infraestrutura:1.2,regional:1.35,ambiente:1.05}},
  {id:'idosos',name:'Pessoas idosas',size:8,weights:{saude:1.5,social:1.3,seguranca:1.05}}
 ];
 // Local problems create stronger attention without turning any theme into an automatic vote source.
 if(/santana|macapá|macapa/i.test(city)||uf==='AP'){const c=segments.find(x=>x.id==='comunidades');c.weights.habitacao+=.15;c.weights.infraestrutura+=.2;c.weights.regional+=.15}

function campaignContext(office){
 const level=campaignOfficeLevel(office),city=String(save.municipality||save.character?.city||''),region=String(save.region||save.character?.uf||'');
 const relevance={};
 MANDATO_CAMPAIGN_THEMES.forEach(t=>{const allowed=(t[level]||[]).some(x=>String(office||'').toLowerCase().includes(x));relevance[t.id]=allowed?1:.35});
 const c=save.character||{};
 // Competence and local context shape relevance; no theme is equally important everywhere.
 if(level==='municipal'){relevance.habitacao*=1.35;relevance.infraestrutura*=1.3;relevance.saude*=1.2;relevance.educacao*=1.2;relevance.regional*=1.15;relevance.ambiente*=1.1}
 if(level==='state'){relevance.infraestrutura*=1.25;relevance.seguranca*=1.25;relevance.regional*=1.25;relevance.agricultura*=1.15}
 if(level==='federal'){relevance.economia*=1.25;relevance.fiscal*=1.2;relevance.agricultura*=1.15;relevance.tecnologia*=1.1}
 if(/AP|PA|AM|RO|RR|AC/.test(region))relevance.regional*=1.12,relevance.infraestrutura*=1.08,relevance.agricultura*=1.08;
 if(/macap|santana/i.test(city))relevance.habitacao*=1.1,relevance.saneamento=(relevance.saneamento||1)*1.1,relevance.infraestrutura*=1.12;
 return relevance;
}

function campaignDraftWeight(id,value){const n=Number(value)||0;let p=campaignStrategyDraft.find(x=>x.id===id);if(n===0){campaignStrategyDraft=campaignStrategyDraft.filter(x=>x.id!==id);return}if(!p){p={id,weight:n,reason:'',setAt:save.date};campaignStrategyDraft.push(p)}else p.weight=n;p.reason=p.reason||''}

function strategyCoherence(){ensureCampaignStrategy(save);const cs=save.campaignStrategy;const top=cs.priorities.filter(x=>x.weight>=2);if(!top.length)return 50;let matches=0,total=0;save.proposals.forEach(p=>{const text=String(p.title||p.name||'')+' '+String(p.area||'')+' '+String(p.description||p.desc||'');top.forEach(x=>{total++;const t=campaignTheme(x.id);if(t&&t.areas.some(a=>text.toLowerCase().includes(a.toLowerCase())))matches++})});const proposalScore=total?matches/total*100:50;const historyPenalty=Math.min(30,Math.max(0,cs.opportunism||0));return clamp((cs.coherence*0.55)+(proposalScore*.3)+((100-historyPenalty)*.15));}

function syncCareerDraft(){if(careerStep===1){careerDraft.saveName=val('cSave')||careerDraft.saveName;careerDraft.description=val('cDesc');careerDraft.cover=val('cCover');careerDraft.organization=val('cOrg')||'padrão'}if(careerStep===2){careerDraft.name=val('cName')||careerDraft.name;careerDraft.politicalName=val('cPol');careerDraft.age=Number(val('cAge'))||28;careerDraft.gender=val('cGender');careerDraft.profession=val('cProfession');careerDraft.education=val('cEducation');careerDraft.socialOrigin=val('cSocialOrigin');careerDraft.zone=val('cZone');careerDraft.experiencePath=val('cExperience');careerDraft.birthPlace=val('cBirthPlace');careerDraft.residence=val('cResidence');careerDraft.personalHistory=val('cHistory');careerDraft.biography=val('cBio')}if(careerStep===3){careerDraft.country=val('cCountry')||'Brasil';careerDraft.region=val('cUF')||careerDraft.region;careerDraft.municipality=val('cCity')||careerDraft.municipality;careerDraft.year=Number(val('cYear'))||2026}if(careerStep===7){careerDraft.difficulty=val('cDifficulty')||'normal';careerDraft.timeSpeed=val('cSpeed')||'normal';careerDraft.eventFrequency=val('cEvents')||'normal';careerDraft.realism=val('cRealism')||'padrão';careerDraft.rules=val('cRules')}}
function calculateCharacterAttributes(d){const p=String(d.profession||'').toLowerCase(),e=String(d.education||'').toLowerCase(),x=String(d.experiencePath||'').toLowerCase();let a={communication:48,oratory:45,negotiation:42,organization:45,administration:40,strategy:40,credibility:48,leadership:38};const add=(k,v)=>a[k]=clamp(a[k]+v);if(/advogado|jornalista|comunicador/.test(p)){add('communication',7);add('oratory',6)}if(/professor|médico|economista|engenheiro|pesquisador/.test(p)){add('credibility',6);add('strategy',4)}if(/empresário/.test(p)){add('negotiation',6);add('organization',5)}if(/servidor público|policial/.test(p)){add('administration',7);add('organization',5)}if(/sindicalista/.test(p)){add('negotiation',7);add('leadership',6)}if(/graduação|pós|mestrado|doutorado/.test(e)){add('strategy',5);add('organization',3)}if(/mestrado|doutorado/.test(e))add('credibility',4);if(/assessor|parlamentar|vereador|secretário|dirigente|gestor|candidato/.test(x)){add('organization',7);add('strategy',6);add('negotiation',5);add('leadership',4)}if(/ativista|líder comunitário|sindical/.test(x)){add('leadership',8);add('communication',4)}if(/estudantil/.test(x)){add('communication',4);add('organization',4)}return a}
function citiesForCareer(){const uf=document.getElementById('cUF'),city=document.getElementById('cCity');if(!uf||!city)return;const list=states[uf.value]||[];city.innerHTML=list.map(x=>`<option value="${escapeHtml(x)}" ${careerDraft.municipality===x?'selected':''}>${escapeHtml(x)}</option>`).join('');if(list.includes(careerDraft.municipality))city.value=careerDraft.municipality}
