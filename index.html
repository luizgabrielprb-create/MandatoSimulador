function partyV6Tab(tab){document.querySelectorAll('.partyTabPanel').forEach(x=>x.classList.toggle('active',x.dataset.partyPanel===tab));document.querySelectorAll('.partyTabs button').forEach(x=>x.classList.toggle('primary',x.dataset.partyTab===tab))}
function partyV6Back(to){closeModal();if(to==='wizard'){try{renderCareerWizard()}catch(e){console.error(e)}}else{try{showCareerView('party')}catch(e){console.error(e)}}}
function partyV6Search(){const q=String(window.partySearch||'').trim().toLowerCase();return MANDATO_PARTY_CATALOG_V6.filter(p=>!q||`${p.sigla} ${p.name} ${p.number}`.toLowerCase().includes(q))}
window.showParty=function(sigla){partyV6Profile(sigla,'wizard')};window.showRealParty=function(sigla){partyV6Profile(sigla,'party')};
window.renderParty=function(){const el=document.getElementById('party');if(!el||!save)return;const list=partyV6Search();el.innerHTML=`<div class="partyCatalogHero"><div><div class="tag">PARTIDOS E FILIAÇÃO</div><h1>Cadastro completo de partidos</h1><p>30 legendas individualizadas. Dados oficiais, dados editoriais e dados de carreira permanecem separados.</p></div><div class="partyCatalogTools"><button class="btn" onclick="window.partySearch='';renderParty()">LIMPAR PESQUISA</button></div></div><div class="card" style="margin-top:14px"><div class="field"><label>Pesquisar por nome, sigla ou número</label><input value="${partyV6Esc(window.partySearch||'')}" placeholder="Ex.: PT, 13, Trabalhadores" oninput="window.partySearch=this.value;renderParty()"></div><div class="small muted">${list.length} de ${MANDATO_PARTY_CATALOG_V6.length} partidos · referência ${MANDATO_PARTY_V6_UPDATED}.</div></div><div class="grid g3" style="margin-top:14px">${list.map(p=>`<article class="card partyCatalogCard"><div class="partyBrand">${partyV6Mark(p)}<div><span class="pill">${partyV6Esc(p.sigla)}</span><h3>${partyV6Esc(p.name)}</h3></div><strong style="margin-left:auto">${partyV6Esc(p.number)}</strong></div><p class="small muted">TSE: ${partyV6Esc(p.registrationDate||'Não confirmado')} · ${partyV6Esc(p.classification)}</p><p>${partyV6Esc(p.features)}</p><div class="partyCardFooter actions"><button class="btn sm" onclick="showRealParty('${partyV6Esc(p.sigla)}')">VER PERFIL</button><button class="btn primary sm" onclick="requestPartyAffiliation('${partyV6Esc(p.sigla)}')">INICIAR FILIAÇÃO</button></div></article>`).join('')||'<div class="card partyEmpty">Nenhum partido encontrado.</div>'}</div><div class="card" style="margin-top:14px"><h3>Nota editorial</h3><p class="small muted">${partyV6Esc(PARTY_V6_EDITORIAL_NOTE)}</p></div>`}
const partyV6LegacyAffiliation=window.requestPartyAffiliation;window.requestPartyAffiliation=function(sigla){const p=partyV6Get(sigla);if(!p||!save)return toast('Partido não encontrado.',true);if(typeof partyV6LegacyAffiliation==='function'&&partyV6LegacyAffiliation!==window.requestPartyAffiliation)return partyV6LegacyAffiliation(sigla);return toast('Fluxo de filiação não disponível.',true)};
function partyV6Validate(data){if(!Array.isArray(data)||data.length!==30)return{ok:false,error:'O catálogo precisa conter exatamente 30 partidos.'};const ids=new Set(),sigs=new Set(),nums=new Set();for(const p of data){if(!p.id||!p.sigla||!p.name||!p.number)return{ok:false,error:`Cadastro incompleto para ${p.sigla||'(sem sigla)'}`};if(ids.has(p.id))return{ok:false,error:`ID duplicado: ${p.id}`};if(sigs.has(p.sigla))return{ok:false,error:`Sigla duplicada: ${p.sigla}`};if(nums.has(String(p.number)))return{ok:false,error:`Número eleitoral duplicado: ${p.number}`};ids.add(p.id);sigs.add(p.sigla);nums.add(String(p.number));if(!/^\d+$/.test(String(p.number))||Number(p.number)<10||Number(p.number)>90)return{ok:false,error:`Número inválido em ${p.sigla}`}}return{ok:true}}
window.renderAdminPartyCatalogV5=function(){if(!isAdminAuthorized())return'<div class="stateCard errorState"><div class="tag">ADMINISTRADOR</div><h2>Acesso bloqueado</h2><p class="muted">Somente identidade administrativa autorizada pode alterar o catálogo partidário.</p></div>';return `<div class="hero"><div><div class="tag">CATÁLOGO V6</div><h1>Partidos — cadastro mestre</h1><p>O catálogo é separado dos saves e permite correções futuras sem alterar carreiras.</p></div></div><div class="card" style="margin-top:14px"><div class="grid g4">${cardMetric('Partidos',MANDATO_PARTY_CATALOG_V6.length)}${cardMetric('Federações',Object.keys(MANDATO_PARTY_FEDERATION_PARTIES).length)}${cardMetric('Versão',6)}${cardMetric('Atualização',MANDATO_PARTY_V6_UPDATED)}</div></div><div class="grid g3" style="margin-top:14px">${MANDATO_PARTY_CATALOG_V6.map(p=>`<div class="card"><div class="row"><div class="partyBrand">${partyV6Mark(p)}<div><b>${partyV6Esc(p.sigla)}</b><div class="small muted">${partyV6Esc(p.name)}</div></div></div><span>${partyV6Esc(p.number)}</span></div><div class="small muted" style="margin-top:10px">${partyV6Esc(p.president||'Sem liderança confirmada')}</div><div class="actions" style="margin-top:10px"><button class="btn sm" onclick="partyV6EditPrompt('${partyV6Esc(p.sigla)}')">EDITAR</button><button class="btn sm" onclick="showRealParty('${partyV6Esc(p.sigla)}')">VER PERFIL</button></div></div>`).join('')}</div>`}
window.partyV6EditPrompt=function(sigla){if(!isAdminAuthorized())return toast('Acesso administrativo bloqueado.',true);const p=partyV6Get(sigla||'');if(!p)return toast('Selecione um partido para editar.',true);const fields=[['name','Nome completo'],['number','Número eleitoral'],['historicalFoundation','Fundação histórica'],['creationDate','Criação formal'],['registrationDate','Registro/deferimento TSE'],['president','Presidente nacional'],['presidentStartDate','Início do mandato'],['site','Site oficial'],['address','Endereço'],['phone','Telefone'],['email','E-mail'],['brandColor','Cor principal'],['logoUrl','URL do logotipo'],['classification','Classificação aproximada'],['classificationBasis','Justificativa/base da classificação'],['economic','Posição econômica'],['social','Posição social'],['state','Papel do Estado'],['priorities','Propostas e prioridades'],['officialProgramSummary','Resumo do programa oficial'],['observedPractice','Atuação observada'],['directories','Diretórios estaduais/municipais'],['electionHistory','Histórico eleitoral'],['adminNote','Nota administrativa']];const body=`<div class="partyProfile"><div class="row"><div><div class="tag">ADMINISTRAÇÃO · ${partyV6Esc(p.sigla)}</div><h2>Editar cadastro</h2></div><button class="btn sm" onclick="closeModal()">FECHAR</button></div><div class="partyAdminGrid" style="margin-top:14px">${fields.map(([k,l])=>`<div class="field"><label>${partyV6Esc(l)}</label><textarea id="pv6_${partyV6Esc(k)}">${partyV6Esc(p[k]??'')}</textarea></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="partyV6SaveEdit('${partyV6Esc(p.sigla)}')">SALVAR CADASTRO</button></div></div>`;modal(body)};
window.partyV6SaveEdit=function(sigla){if(!isAdminAuthorized())return toast('Acesso administrativo bloqueado.',true);const p=partyV6Get(sigla);if(!p)return toast('Partido não encontrado.',true);const keys=['name','number','historicalFoundation','creationDate','registrationDate','president','presidentStartDate','site','address','phone','email','brandColor','logoUrl','classification','classificationBasis','economic','social','state','priorities','officialProgramSummary','observedPractice','directories','electionHistory','adminNote'];const next=MANDATO_PARTY_CATALOG_V6.map(x=>x.sigla===sigla?{...x}:x),n=next.find(x=>x.sigla===sigla);keys.forEach(k=>{const v=document.getElementById('pv6_'+k)?.value??'';n[k]=v.trim()||null});n.updatedAt=new Date().toISOString().slice(0,10);const check=partyV6Validate(next);if(!check.ok)return toast(check.error,true);MANDATO_PARTY_CATALOG_V6=next;window.MANDATO_PARTY_CATALOG_V6=next;partyV6Save(next);closeModal();toast('Cadastro partidário atualizado.');if(appState.context==='admin')renderAdminContext()};
try{const check=partyV6Validate(MANDATO_PARTY_CATALOG_V6);if(!check.ok)throw new Error(check.error);window.MANDATO_PARTY_CATALOG_V6=MANDATO_PARTY_CATALOG_V6}catch(e){console.error('Falha no catálogo V6',e)}
</script></body>

<script id="mandato-party-v6-slim">
/* MANDATO V6 — CATÁLOGO ENXUTO: somente conteúdo editorial informado pelo usuário. */
(function(){
  const keep=['sigla','name','number','classification','history','economic','social','state','priorities','features','foundation','logoUrl'];
  const esc=v=>typeof partyV6Esc==='function'?partyV6Esc(v):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function cleanParty(p){
    const n={};
    keep.forEach(k=>{if(p && p[k]!==null && p[k]!==undefined && String(p[k]).trim()!=='') n[k]=String(p[k]).trim()});
    n.sigla=p.sigla;n.name=p.name;n.number=String(p.number||MANDATO_REAL_PARTIES.find(r=>r.sigla===p.sigla)?.number||'');
    return n;
  }
  const source=Array.isArray(window.MANDATO_PARTY_CATALOG_V6)?window.MANDATO_PARTY_CATALOG_V6:(typeof MANDATO_PARTY_CATALOG_V6!=='undefined'?MANDATO_PARTY_CATALOG_V6:[]);
  const slim=source.map(cleanParty).filter(p=>p.sigla&&p.name);
  window.MANDATO_PARTY_CATALOG_V6=slim;
  try{MANDATO_PARTY_CATALOG_V6=slim}catch(e){}
  window.partyV6Get=function(sigla){return window.MANDATO_PARTY_CATALOG_V6.find(p=>p.sigla===sigla)||null};
  window.partyV6Search=function(){const q=String(window.partySearch||'').trim().toLowerCase();return window.MANDATO_PARTY_CATALOG_V6.filter(p=>!q||`${p.sigla} ${p.name}`.toLowerCase().includes(q))};
  window.renderParty=function(){
    const el=document.getElementById('party'); if(!el||!save)return;
    const list=window.partyV6Search();
    el.innerHTML=`<div class="partyCatalogHero"><div><div class="tag">PARTIDOS</div><h1>Partidos</h1><p>Somente as informações editoriais informadas no catálogo.</p></div><div class="partyCatalogTools"><button class="btn" onclick="window.partySearch='';renderParty()">LIMPAR PESQUISA</button></div></div><div class="card" style="margin-top:14px"><div class="field"><label>Pesquisar por nome ou sigla</label><input value="${esc(window.partySearch||'')}" placeholder="Ex.: PT" oninput="window.partySearch=this.value;renderParty()"></div><div class="small muted">${list.length} partidos</div></div><div class="grid g3" style="margin-top:14px">${list.map(p=>`<article class="card partyCatalogCard"><div class="partyBrand"><div class="partyLogoWrap">${p.logoUrl?`<img class="partyLogoImg" src="${esc(p.logoUrl)}" alt="Logo ${esc(p.sigla)}" loading="lazy">`:`<div class="partyMonogram">${esc(p.sigla)}</div>`}</div><div><span class="pill">${esc(p.sigla)}</span><h3>${esc(p.name)}</h3></div></div>${p.classification?`<p><b>Classificação:</b> ${esc(p.classification)}</p>`:''}${p.features?`<p>${esc(p.features)}</p>`:''}<div class="partyCardFooter actions"><button class="btn sm" onclick="showRealParty('${esc(p.sigla)}')">VER PERFIL</button><button class="btn primary sm" onclick="requestPartyAffiliation('${esc(p.sigla)}')">INICIAR FILIAÇÃO</button></div></article>`).join('')||'<div class="card partyEmpty">Nenhum partido encontrado.</div>'}</div>`;
  };
  window.partyV6Profile=function(sigla,returnTo){
    const p=window.partyV6Get(sigla); if(!p)return toast('Partido não encontrado.',true);
    const rows=[];
    if(p.classification)rows.push(['Classificação',p.classification]);
    if(p.foundation)rows.push(['Fundação',p.foundation]);
    if(p.history)rows.push(['História',p.history]);
    if(p.economic)rows.push(['Economia',p.economic]);
    if(p.social)rows.push(['Social',p.social]);
    if(p.state)rows.push(['Papel do Estado',p.state]);
    if(p.priorities)rows.push(['Prioridades',p.priorities]);
    if(p.features)rows.push(['Características',p.features]);
    const body=`<div class="partyProfile"><div class="row"><div class="partyBrand"><div class="partyLogoWrap" style="width:72px;height:72px">${p.logoUrl?`<img class="partyLogoImg" src="${esc(p.logoUrl)}" alt="Logo ${esc(p.sigla)}">`:`<div class="partyMonogram">${esc(p.sigla)}</div>`}</div><div><div class="tag">PARTIDO</div><h2>${esc(p.name)}</h2><div class="small muted">${esc(p.sigla)}</div></div></div><button class="btn sm" onclick="partyV6Back('${returnTo||'party'}')">VOLTAR</button></div><div class="partyMetaGrid" style="margin-top:14px">${rows.map(x=>`<div class="partyMeta"><div class="small muted">${esc(x[0])}</div><b>${esc(x[1])}</b></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="requestPartyAffiliation('${esc(p.sigla)}')">INICIAR FILIAÇÃO</button></div></div>`;
    modal(body);window.partyV6Current=sigla;
  };
  window.showParty=function(sigla){partyV6Profile(sigla,'wizard')};
  window.showRealParty=function(sigla){partyV6Profile(sigla,'party')};
  /* Regrava o catálogo local já limpo, sem os campos removidos. */
  try{localStorage.setItem('mandato_party_catalog_v6',JSON.stringify(window.MANDATO_PARTY_CATALOG_V6))}catch(e){}
})();
</script>

<script>
(function(){
'use strict';
const ADMIN_EMAIL='luizgabrielprb@gmail.com';
const AUDIT_KEY='mandato_admin_audit_v1';
const GLOBAL_KEY='mandato_admin_global_v1';
const BACKUP_KEY='mandato_admin_backups_v1';
const GEO_KEY='mandato_admin_geo_v1';
const adminState={module:'dashboard',query:'',filter:'all',period:30};
window.MANDATO_ADMIN_OWNER_EMAIL=ADMIN_EMAIL;
window.MANDATO_ADMIN_EMAILS=Array.from(new Set([ADMIN_EMAIL].concat(window.MANDATO_ADMIN_EMAILS||[])));
function adminEmail(){return String(user?.email||'').trim().toLowerCase()}
function adminLocalAllowed(){return adminEmail()===ADMIN_EMAIL||String(user?.adminStatus||'').toLowerCase()==='admin'}
function adminAudit(){try{return JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]')}catch(e){return[]}}
function saveAudit(a){try{localStorage.setItem(AUDIT_KEY,JSON.stringify(a.slice(-1000)))}catch(e){}}
function audit(action,entity,id,detail,scope){const a=adminAudit();a.push({id:uid(),at:Date.now(),admin:ADMIN_EMAIL,action,entity,idRef:id||null,detail:detail||'',scope:scope||'global'});saveAudit(a)}
function globalSettings(){try{return JSON.parse(localStorage.getItem(GLOBAL_KEY)||'{}')}catch(e){return{}}}
function saveGlobalSettings(v){try{localStorage.setItem(GLOBAL_KEY,JSON.stringify(v))}catch(e){} }
function backups(){try{return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]')}catch(e){return[]}}
function saveBackups(v){try{localStorage.setItem(BACKUP_KEY,JSON.stringify(v.slice(-20)))}catch(e){}}
function geoData(){try{return JSON.parse(localStorage.getItem(GEO_KEY)||'{"regions":[],"cities":[]}')}catch(e){return{regions:[],cities:[]}}}
function saveGeo(v){try{localStorage.setItem(GEO_KEY,JSON.stringify(v))}catch(e){}}
function safeDate(v){return v?new Date(v).toLocaleString('pt-BR'): '—'}
function allUsers(){return dbAll().catch(()=>[])}
function allWorlds(users){const out=[];(users||[]).forEach(u=>(u.saves||[]).forEach(s=>out.push({owner:u,save:s})));return out}
function countCandidates(worlds){return worlds.reduce((n,w)=>n+(w.save?.world?.candidates?.length||0)+1,0)}
function isAdminAuthorized(){return adminLocalAllowed()}
window.isAdminAuthorized=isAdminAuthorized;
window.mandatoAdminAudit=audit;
function deny(){toast('Acesso administrativo bloqueado.',true);return false}
function requireAdmin(){return isAdminAuthorized()||deny()}
function adminEscape(v){return escapeHtml(v??'')}
function adminNav(){return [
 ['dashboard','Visão geral'],['users','Usuários'],['worlds','Mundos e carreiras'],['parties','Partidos'],['candidates','Candidatos'],['elections','Eleições'],['campaigns','Campanhas'],['governments','Governos'],['legislative','Legislativo'],['economy','Economia'],['polls','Pesquisas'],['news','Notícias e eventos'],['calendar','Calendário'],['geography','Geografia'],['progression','Progressão'],['settings','Configurações globais'],['io','Importação e exportação'],['backups','Backups'],['audit','Auditoria'],['integrity','Integridade e manutenção']
]}
function ensureAdminUI(){const layout=document.getElementById('adminLayout');if(!layout)return;const side=layout.querySelector('.adminSide');const main=layout.querySelector('.main');if(!side||!main)return;
 side.innerHTML='<div class="navgroup">ADMINISTRAÇÃO</div><div class="small muted" style="padding:0 10px 10px">'+adminEscape(adminEmail())+' · '+(adminEmail()===ADMIN_EMAIL?'OWNER':'ADMIN')+'</div>'+adminNav().map(x=>'<button class="navbtn" data-admin-module="'+x[0]+'">'+x[1]+'</button>').join('')+'<button class="navbtn" data-admin-back="1">Voltar à Central</button><div class="sideCredit">Desenvolvido por @whrsgabriel</div>';
 main.innerHTML='<section class="view active" id="adminWorkspace"></section>';
 side.querySelectorAll('[data-admin-module]').forEach(b=>b.onclick=()=>{adminState.module=b.dataset.adminModule;adminState.query='';renderAdminContext()});
 side.querySelector('[data-admin-back]')?.addEventListener('click',()=>showAccountView('command'));
}
function setAdminActive(){document.querySelectorAll('#adminLayout [data-admin-module]').forEach(b=>b.classList.toggle('active',b.dataset.adminModule===adminState.module))}
function adminHeader(title,sub,actions){return '<div class="adminHeader"><div><div class="tag">CENTRO DE CONTROLE</div><h1>'+adminEscape(title)+'</h1><p>'+adminEscape(sub||'')+'</p></div><div class="adminTools">'+(actions||'')+'</div></div>'}
function adminSearch(){return '<div class="adminSearch"><span>⌕</span><input id="adminQuery" value="'+adminEscape(adminState.query)+'" placeholder="Buscar neste módulo…" oninput="window.mandatoAdminSearch(this.value)"></div>'}
window.mandatoAdminSearch=function(v){adminState.query=v||'';renderAdminContext()}
function adminBtn(label,fn,primary){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>'}
function adminKpi(label,value,sub){return '<div class="adminKpi"><div class="label">'+adminEscape(label)+'</div><div class="value">'+adminEscape(String(value))+'</div><div class="sub">'+adminEscape(sub||'')+'</div></div>'}
function adminTable(headers,rows){return '<div class="adminTableWrap"><table class="adminTable"><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.join('')||'<tr><td colspan="'+headers.length+'"><div class="adminEmpty">Nenhum registro encontrado.</div></td></tr>')+'</tbody></table></div>'}
function adminConfirm(message){return confirm(message)}
async function adminSnapshot(){const users=await dbAll();return {version:1,exportedAt:new Date().toISOString(),application:'MANDATO',users,partyCatalog:window.MANDATO_PARTY_CATALOG_V6||[],global:globalSettings(),geo:geoData(),audit:adminAudit()}}
function downloadJSON(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.adminExportSnapshot=async function(){if(!requireAdmin())return;const s=await adminSnapshot();downloadJSON('MANDATO_ADMIN_BACKUP_'+new Date().toISOString().slice(0,10)+'.json',s);audit('export','snapshot',null,'Exportação administrativa completa');toast('Exportação criada com os dados disponíveis.')}
window.adminCreateBackup=async function(){if(!requireAdmin())return;const s=await adminSnapshot();const b=backups();b.push({id:uid(),createdAt:Date.now(),label:'Backup administrativo',snapshot:s});saveBackups(b);audit('backup.create','snapshot',b[b.length-1].id,'Backup local criado');renderAdminContext();toast('Backup administrativo criado.')}
window.adminDownloadBackup=async function(id){if(!requireAdmin())return;const b=backups().find(x=>x.id===id);if(!b)return toast('Backup não encontrado.',true);downloadJSON('MANDATO_BACKUP_'+new Date(b.createdAt).toISOString().replace(/[:.]/g,'-')+'.json',b.snapshot);audit('backup.export','snapshot',id,'Backup exportado')}
function filtered(list,fields){const q=adminState.query.trim().toLowerCase();return !q?list:list.filter(x=>fields.map(f=>String(typeof f==='function'?f(x):x?.[f]??'')).join(' ').toLowerCase().includes(q))}
async function renderDashboard(){const users=await dbAll(),worlds=allWorlds(users),aud=adminAudit(),saves=worlds.map(x=>x.save),events=saves.reduce((n,s)=>n+(s.events?.length||0),0),elections=saves.reduce((n,s)=>n+(s.elections?.length||0),0),news=saves.reduce((n,s)=>n+(s.news?.length||0),0),polls=saves.reduce((n,s)=>n+(s.polls?.length||0),0);const days=Math.max(1,Number(adminState.period)||30),cut=Date.now()-days*86400000,active=users.filter(u=>(u.lastLogin||0)>=cut).length;const recent=aud.slice(-8).reverse();return adminHeader('Visão geral','Estado real dos dados disponíveis no armazenamento atual.',adminBtn('EXPORTAR BACKUP','adminExportSnapshot()')+adminBtn('CRIAR BACKUP','adminCreateBackup()',true))+ '<div class="adminNotice">Modo de armazenamento: <b>'+adminEscape(storageMode)+'</b>. Autorização local ativa para '+ADMIN_EMAIL+'. Segurança de servidor requer backend configurado.</div><div style="margin-top:14px" class="adminKpis">'+adminKpi('Usuários',users.length,'contas registradas')+adminKpi('Ativos no período',active,'últimos '+days+' dias')+adminKpi('Mundos / carreiras',saves.length,'saves persistidos')+adminKpi('Partidos',((window.MANDATO_PARTY_CATALOG_V6||[]).length),'catálogo atual')+'</div><div class="adminKpis">'+adminKpi('Eleições',elections,'registros simulados')+adminKpi('Pesquisas',polls,'registros simulados')+adminKpi('Notícias',news,'registros armazenados')+adminKpi('Eventos',events,'registros armazenados')+'</div><div class="adminGrid"><div class="card"><div class="row"><h3>Atividade administrativa</h3><select onchange="adminState.period=Number(this.value);renderAdminContext()"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select></div><div class="adminTimeline">'+(recent.map(x=>'<div class="item"><b>'+adminEscape(x.action)+'</b><div class="small muted">'+safeDate(x.at)+' · '+adminEscape(x.entity)+' · '+adminEscape(x.detail)+'</div></div>').join('')||'<div class="adminEmpty">Nenhuma ação administrativa registrada.</div>')+'</div></div><div class="card"><h3>Integridade rápida</h3><p class="muted">Verifique referências e inconsistências antes de qualquer reparo.</p><div class="actions">'+adminBtn('EXECUTAR DIAGNÓSTICO','adminRunIntegrity()',true)+adminBtn('ABRIR LOGS','adminGo(\'audit\')')+'</div></div></div>'}
window.adminGo=function(m){adminState.module=m;renderAdminContext()}
async function renderUsers(){
 const users=filtered(await dbAll(),[u=>u.email,u=>u.name,u=>u.userName,u=>u.id]);
 const rows=users.map(u=>{
  const id=adminEscape(u.id), owner=u.email?.toLowerCase()===ADMIN_EMAIL, admin=String(u.adminStatus||'').toLowerCase()==='admin', suspended=u.adminStatus==='suspended';
  const role=suspended?'SUSPENSA':admin?'ADMIN':'USUÁRIO';
  const roleActions=owner?'<span class="adminBadge">OWNER</span>':(admin?`<button class="btn sm" onclick="adminUserRole('${id}',false)">REMOVER ADMIN</button>`:`<button class="btn sm primary" onclick="adminUserRole('${id}',true)">DAR ADMIN</button>`);
  const statusAction=suspended?`<button class="btn sm" onclick="adminUserToggle('${id}',false)">REATIVAR</button>`:`<button class="btn sm" onclick="adminUserToggle('${id}',true)">SUSPENDER</button>`;
  return `<tr><td><b>${adminEscape(u.name)}</b><div class="small muted">${adminEscape(u.email)}</div></td><td>${id}</td><td>${safeDate(u.createdAt)}</td><td>${safeDate(u.lastLogin)}</td><td>${(u.saves||[]).length}</td><td><span class="adminBadge ${suspended?'err':'ok'}">${role}</span> ${owner?'<span class="adminBadge">OWNER</span>':''}</td><td><button class="btn sm" onclick="adminUserView('${id}')">VER</button> ${roleActions} ${statusAction} <button class="btn sm" onclick="adminUserRevoke('${id}')">REVOGAR SESSÕES</button> ${owner?'':'<button class="btn sm adminDanger" onclick="adminUserDelete(\''+id+'\')">EXCLUIR</button>'}</td></tr>`;
 });
 return adminHeader('Usuários','Todas as contas disponíveis no armazenamento atual. O proprietário não pode ser removido/rebaixado.',adminSearch()+adminBtn('EXPORTAR','adminExportSnapshot()'))+adminTable(['Conta','ID','Cadastro','Último acesso','Mundos','Função / estado','Ações'],rows)
}
window.adminUserView=async function(id){if(!requireAdmin())return;const u=(await dbAll()).find(x=>x.id===id);if(!u)return;modal('<div class="row"><div><div class="tag">USUÁRIO</div><h2>'+adminEscape(u.name)+'</h2></div><button class="btn sm" onclick="closeModal()">FECHAR</button></div><div class="adminGrid" style="margin-top:14px"><div class="card"><b>E-mail</b><p>'+adminEscape(u.email)+'</p><b>ID</b><p class="small muted">'+adminEscape(u.id)+'</p></div><div class="card"><b>Conta</b><p>Criada: '+safeDate(u.createdAt)+'</p><p>Último acesso: '+safeDate(u.lastLogin)+'</p><p>Carreiras: '+((u.saves||[]).length)+'</p></div></div><div class="card" style="margin-top:14px"><h3>Histórico administrativo</h3><div class="adminTimeline">'+adminAudit().filter(a=>a.idRef===id).slice(-10).reverse().map(a=>'<div class="item"><b>'+adminEscape(a.action)+'</b><div class="small muted">'+safeDate(a.at)+' · '+adminEscape(a.detail)+'</div></div>').join('')||'<div class="muted">Sem ações administrativas.</div>'+'</div></div>')}
window.adminUserRevoke=async function(id){if(!requireAdmin())return;const users=await dbAll(),u=users.find(x=>x.id===id);if(!u)return;if(u.email?.toLowerCase()===ADMIN_EMAIL)return toast('As sessões da conta principal não podem ser revogadas pelo próprio painel.',true);if(!adminConfirm('Revogar as sessões desta conta?'))return;u.sessionVersion=Number(u.sessionVersion||0)+1;await dbPut(u);audit('user.sessions.revoke','user',id,'Versão de sessão incrementada; sessões antigas deixam de ser aceitas na próxima restauração',id);renderAdminContext();toast('Sessões revogadas.')}
window.adminUserRole=async function(id,grant){if(!requireAdmin())return;const users=await dbAll(),u=users.find(x=>x.id===id);if(!u)return;const owner=u.email?.toLowerCase()===ADMIN_EMAIL;if(owner)return toast('O proprietário principal sempre permanece administrador.',true);if(!adminConfirm((grant?'Dar acesso de administrador para ':'Remover acesso de administrador de ')+u.email+'?'))return;u.adminStatus=grant?'admin':'active';u.adminRole=grant?'admin':'user';u.adminStatusAt=Date.now();await dbPut(u);audit(grant?'user.admin.grant':'user.admin.revoke','user',id,(grant?'Administrador concedido':'Administrador removido'));renderAdminContext();toast(grant?'Administrador concedido.':'Acesso de administrador removido.')}
window.adminUserDelete=async function(id){if(!requireAdmin())return;const users=await dbAll(),u=users.find(x=>x.id===id);if(!u)return;if(u.email?.toLowerCase()===ADMIN_EMAIL)return toast('A conta principal não pode ser excluída pelo painel.',true);if(!adminConfirm('EXCLUIR DEFINITIVAMENTE a conta '+u.email+' e seus mundos?'))return;await dbDelete(id);audit('user.delete','user',id,'Conta e dados relacionados removidos com confirmação',id);closeModal();renderAdminContext();toast('Conta excluída.')}
window.adminUserToggle=async function(id,suspend){if(!requireAdmin())return;const users=await dbAll(),u=users.find(x=>x.id===id);if(!u)return;if(u.email?.toLowerCase()===ADMIN_EMAIL)return toast('A conta principal não pode ser suspensa ou rebaixada.',true);if(!adminConfirm((suspend?'Suspender':'Reativar')+' esta conta?'))return;u.adminStatus=suspend?'suspended':(String(u.adminRole||'').toLowerCase()==='admin'?'admin':'active');u.adminStatusAt=Date.now();await dbPut(u);audit(suspend?'user.suspend':'user.reactivate','user',id,(suspend?'Conta suspensa':'Conta reativada'));renderAdminContext();toast(suspend?'Conta suspensa.':'Conta reativada.')}
async function renderWorlds(){const users=await dbAll();let worlds=filtered(allWorlds(users),[x=>x.owner?.email,x=>x.owner?.name,x=>x.save?.name,x=>x.save?.id,x=>x.save?.country,x=>x.save?.region]);const rows=worlds.map(w=>'<tr><td><b>'+adminEscape(w.save.name)+'</b><div class="small muted">'+adminEscape(w.save.id)+'</div></td><td>'+adminEscape(w.owner?.email)+'</td><td>'+adminEscape(w.save.character?.politicalName||w.save.character?.name)+'</td><td>'+adminEscape(w.save.country)+' · '+adminEscape(w.save.region)+'</td><td>'+adminEscape(w.save.character?.office||'Cidadão')+'</td><td>'+safeDate(w.save.updatedAt)+'</td><td><button class="btn sm" onclick="adminWorldView(\''+adminEscape(w.owner.id)+'\',\''+adminEscape(w.save.id)+'\')">VER</button></td></tr>');return adminHeader('Mundos e carreiras','Cada carreira permanece vinculada ao proprietário original.',adminSearch()+adminBtn('DIAGNÓSTICO','adminRunIntegrity()',true))+adminTable(['Mundo','Proprietário','Personagem','Território','Cargo','Atualizado','Ações'],rows)}
window.adminWorldView=async function(ownerId,saveId){if(!requireAdmin())return;const u=(await dbAll()).find(x=>x.id===ownerId),s=u?.saves?.find(x=>String(x.id)===String(saveId));if(!u||!s)return;const issues=adminValidateSave(s);modal('<div class="row"><div><div class="tag">MUNDO</div><h2>'+adminEscape(s.name)+'</h2></div><button class="btn sm" onclick="closeModal()">FECHAR</button></div><div class="adminGrid" style="margin-top:14px"><div class="card"><b>Proprietário</b><p>'+adminEscape(u.email)+'</p><b>Data</b><p>'+adminEscape(s.date)+' · semana '+adminEscape(s.week)+'</p><b>Estado</b><p>'+adminEscape(s.character?.office||'Cidadão')+' · '+adminEscape(s.character?.party||'Independente')+'</p></div><div class="card"><b>Conteúdo</b><p>'+((s.news||[]).length)+' notícias · '+((s.events||[]).length)+' eventos</p><p>'+((s.elections||[]).length)+' eleições · '+((s.polls||[]).length)+' pesquisas</p><p>'+((s.proposals||[]).length)+' propostas</p></div></div><div class="card" style="margin-top:14px"><h3>Integridade</h3><p>'+ (issues.length?'<span class="adminBadge err">'+issues.length+' problema(s)</span>':'<span class="adminBadge ok">OK</span>')+'</p>'+issues.map(x=>'<div class="small muted">• '+adminEscape(x)+'</div>').join('')+'</div><div class="actions" style="margin-top:14px">'+(issues.length?'<button class="btn" onclick="adminRepairSave(\''+adminEscape(ownerId)+'\',\''+adminEscape(saveId)+'\')">REPARAR CAMPOS SEGUROS</button>':'')+'<button class="btn adminDanger" onclick="adminDeleteWorld(\''+adminEscape(ownerId)+'\',\''+adminEscape(saveId)+'\')">EXCLUIR MUNDO</button></div>')}
function adminValidateSave(s){const e=[];if(!s.id)e.push('ID ausente');if(!s.ownerId)e.push('ownerId ausente');if(!s.character)e.push('character ausente');if(!s.world)e.push('world ausente');if(!Array.isArray(s.news))e.push('news não é array');if(!Array.isArray(s.elections))e.push('elections não é array');if(!s.date)e.push('data ausente');return e}
window.adminRepairSave=async function(ownerId,saveId){if(!requireAdmin())return;const users=await dbAll(),u=users.find(x=>x.id===ownerId),idx=u?.saves?.findIndex(x=>String(x.id)===String(saveId));if(!u||idx<0)return;if(!adminConfirm('Reparar somente campos estruturais ausentes deste mundo?'))return;const before=JSON.stringify(u.saves[idx]);u.saves[idx]=normalizeSave(u.saves[idx],u.id);await dbPut(u);audit('world.repair','save',saveId,'Reparo estrutural seguro; dados existentes preservados',ownerId);closeModal();renderAdminContext();toast('Reparo concluído.');}
window.adminDeleteWorld=async function(ownerId,saveId){if(!requireAdmin())return;if(!adminConfirm('EXCLUIR este mundo definitivamente? A operação afeta somente o proprietário indicado.'))return;const users=await dbAll(),u=users.find(x=>x.id===ownerId);if(!u)return;u.saves=(u.saves||[]).filter(x=>String(x.id)!==String(saveId));await dbPut(u);audit('world.delete','save',saveId,'Mundo excluído com confirmação',ownerId);closeModal();renderAdminContext();toast('Mundo excluído.')}

window.adminPartyCreate=function(){if(!requireAdmin())return;window.__adminPartyLogoClear=false;modal('<div class="tag">PARTIDO FICTÍCIO</div><h2>Novo partido</h2><div class="formgrid"><div class="field"><label>Sigla</label><input id="admPartySigla"></div><div class="field"><label>Nome</label><input id="admPartyName"></div><div class="field"><label>Número</label><input id="admPartyNum"></div><div class="field"><label>Fundação</label><input id="admPartyFoundation"></div><div class="field" style="grid-column:1/-1"><label>Classificação editorial simulada</label><input id="admPartyClass"></div><div class="field" style="grid-column:1/-1"><label>História</label><textarea id="admPartyHistory"></textarea></div><div class="field" style="grid-column:1/-1"><label>Logo do partido</label><div class="adminPartyLogoDrop"><div class="adminPartyLogoPreview" id="admPartyLogoPreview"><span class="small muted">SEM LOGO</span></div><div><input id="admPartyLogoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="adminPartyLogoPreviewFile(this)"><div class="adminPartyLogoHelp">PNG, JPG, WebP ou SVG. A imagem enviada é compactada para o catálogo. Também é possível usar uma URL abaixo.</div></div></div><input id="admPartyLogoUrl" placeholder="URL da logo (opcional)" style="margin-top:10px"></div></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="adminPartySaveNew()">CRIAR</button></div>')}
window.adminPartyLogoPreviewFile=function(input){const f=input?.files?.[0],box=document.getElementById('admPartyLogoPreview');if(!box)return;if(!f){box.innerHTML='<span class="small muted">SEM LOGO</span>';return}if(!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type))return toast('Formato de logo não suportado.',true);const r=new FileReader();r.onload=()=>{box.innerHTML='<img src="'+adminEscape(r.result)+'" alt="Prévia da logo">'};r.readAsDataURL(f)};
async function adminPartyLogoData(inputId,urlId){const file=document.getElementById(inputId)?.files?.[0];if(file){if(file.size>8*1024*1024)throw new Error('A imagem deve ter no máximo 8 MB.');return await adminPartyImageToDataUrl(file)}const url=(document.getElementById(urlId)?.value||'').trim();if(url){if(!/^https?:\/\//i.test(url)&&!/^data:image\//i.test(url))throw new Error('A URL da logo deve começar com http://, https:// ou data:image/.');return url}return null}
function adminPartyImageToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));r.onload=()=>{if(/^image\/svg\+xml$/i.test(file.type)){const text=String(r.result||'');if(text.length>1000000)return reject(new Error('SVG muito grande.'));return resolve('data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(text))))}const img=new Image();img.onload=()=>{const max=320,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/webp',.86))};img.onerror=()=>reject(new Error('Imagem inválida.'));img.src=String(r.result)};r.readAsDataURL(file)})}
window.adminPartySaveNew=async function(){if(!requireAdmin())return;const sigla=val('admPartySigla').toUpperCase();const name=val('admPartyName');if(!sigla||!name)return toast('Sigla e nome são obrigatórios.',true);const ps=partyCatalog();if(ps.some(p=>p.sigla===sigla||String(p.name||'').toLowerCase()===name.toLowerCase()))return toast('Partido duplicado.',true);let logo=null;try{logo=await adminPartyLogoData('admPartyLogoFile','admPartyLogoUrl')}catch(e){return toast(e.message,true)}ps.push({sigla,name,number:val('admPartyNum'),foundation:val('admPartyFoundation'),classification:val('admPartyClass'),history:val('admPartyHistory'),logoUrl:logo,fictional:true,createdAt:new Date().toISOString()});partyV6Save(ps);window.MANDATO_PARTY_CATALOG_V6=ps;try{MANDATO_PARTY_CATALOG_V6=ps}catch(e){}audit('party.create','party',sigla,logo?'Partido fictício criado com logo':'Partido fictício criado');closeModal();renderAdminContext();toast('Partido criado.')}

async function renderGeography(){const g=geoData();return adminHeader('Geografia','Base territorial nativa do jogo + extensões fictícias administrativas.',adminBtn('NOVA REGIÃO','adminGeoCreateRegion()',true)+adminBtn('NOVA CIDADE','adminGeoCreateCity()'))+'<div class="adminNotice">Os estados/municípios nativos continuam separados das extensões fictícias armazenadas pelo painel.</div><div class="adminGrid" style="margin-top:14px"><div class="card"><h3>Estados nativos</h3><p class="metric">'+Object.keys(stateNames).length+'</p><p class="muted">'+Object.values(stateNames).join(' · ')+'</p></div><div class="card"><h3>Extensões fictícias</h3><p class="metric">'+(g.regions.length+g.cities.length)+'</p><p class="muted">'+g.regions.length+' regiões · '+g.cities.length+' cidades</p></div></div><div class="adminGrid" style="margin-top:14px"><div class="card"><h3>Regiões adicionadas</h3>'+(g.regions.map(r=>'<div class="item"><b>'+adminEscape(r.name)+'</b><div class="small muted">'+adminEscape(r.code||'')+'</div></div>').join('')||'<div class="muted">Nenhuma.</div>')+'</div><div class="card"><h3>Cidades adicionadas</h3>'+(g.cities.map(c=>'<div class="item"><b>'+adminEscape(c.name)+'</b><div class="small muted">'+adminEscape(c.region||'')+'</div></div>').join('')||'<div class="muted">Nenhuma.</div>')+'</div></div>'}

window.adminGeoSaveRegion=function(){const n=val('admGeoName'),c=val('admGeoCode');if(!n)return toast('Nome obrigatório.',true);const g=geoData();if(g.regions.some(x=>x.code===c||x.name.toLowerCase()===n.toLowerCase()))return toast('Região duplicada.',true);g.regions.push({id:uid(),name:n,code:c,fictional:true});saveGeo(g);audit('geography.create','region',g.regions.at(-1).id,'Região fictícia criada');closeModal();renderAdminContext()}
window.adminGeoCreateCity=function(){if(!requireAdmin())return;const g=geoData();modal('<h2>Nova cidade fictícia</h2><div class="field"><label>Nome</label><input id="admGeoCity"></div><div class="field"><label>Região/UF</label><input id="admGeoCityRegion"></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="adminGeoSaveCity()">CRIAR</button></div>')}
window.adminGeoSaveCity=function(){const n=val('admGeoCity'),r=val('admGeoCityRegion');if(!n)return toast('Nome obrigatório.',true);const g=geoData();if(g.cities.some(x=>x.name.toLowerCase()===n.toLowerCase()&&x.region===r))return toast('Cidade duplicada.',true);g.cities.push({id:uid(),name:n,region:r,fictional:true});saveGeo(g);audit('geography.create','city',g.cities.at(-1).id,'Cidade fictícia criada');closeModal();renderAdminContext()}
async function renderProgression(){const users=await dbAll(),worlds=allWorlds(users),ach=users.reduce((n,u)=>n+(u.achievements||[]).length,0),mil=worlds.reduce((n,w)=>n+(w.save.achievements||[]).length,0);return adminHeader('Progressão','Conquistas e marcos realmente armazenados.',adminBtn('EXPORTAR','adminExportSnapshot()'))+'<div class="adminKpis">'+adminKpi('Conquistas de conta',ach,'registros')+adminKpi('Marcos de carreira',mil,'registros')+adminKpi('Usuários',users.length,'contas')+adminKpi('Mundos',worlds.length,'carreiras')+'</div><div class="card"><p class="muted">O painel não concede recompensas automaticamente. Alterações de progresso exigem operação explícita e auditoria.</p></div>'}
async function renderSettings(){const g=globalSettings();return adminHeader('Configurações globais','Parâmetros administrativos separados das configurações de cada carreira.',adminBtn('SALVAR','adminSaveSettings()',true))+ '<div class="adminGrid"><div class="card"><h3>Simulação</h3><div class="field"><label>Frequência global de eventos</label><select id="admGlobalEvents"><option '+(g.eventFrequency==='low'?'selected':'')+' value="low">Baixa</option><option '+(!g.eventFrequency||g.eventFrequency==='normal'?'selected':'')+' value="normal">Normal</option><option '+(g.eventFrequency==='high'?'selected':'')+' value="high">Alta</option></select></div><div class="field"><label>Velocidade padrão</label><select id="admGlobalSpeed"><option value="slow">Lenta</option><option '+(!g.timeSpeed||g.timeSpeed==='normal'?'selected':'')+' value="normal">Normal</option><option '+(g.timeSpeed==='fast'?'selected':'')+' value="fast">Rápida</option></select></div></div><div class="card"><h3>Manutenção</h3><div class="field"><label>Aviso global</label><textarea id="admMaintenance">'+adminEscape(g.maintenance||'')+'</textarea></div><div class="small muted">Esses valores não sobrescrevem configurações individuais dos saves.</div></div></div>'}
window.adminSaveSettings=function(){if(!requireAdmin())return;const old=globalSettings(),next={...old,eventFrequency:val('admGlobalEvents'),timeSpeed:val('admGlobalSpeed'),maintenance:val('admMaintenance'),updatedAt:Date.now()};saveGlobalSettings(next);audit('settings.update','global','global','Configurações globais alteradas: '+JSON.stringify(next));renderAdminContext();toast('Configurações globais salvas.')}
async function renderIO(){return adminHeader('Importação e exportação','Operações administrativas com validação antes de persistir.',adminBtn('EXPORTAR SNAPSHOT','adminExportSnapshot()',true))+ '<div class="adminGrid"><div class="card"><h3>Importar snapshot</h3><p class="muted">Aceita JSON exportado pelo próprio MANDATO. Primeiro valida; depois solicita confirmação.</p><input id="adminImportFile" type="file" accept="application/json,.json"><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="adminPreviewImport()">VALIDAR ARQUIVO</button></div><div id="adminImportResult" class="small muted" style="margin-top:10px"></div></div><div class="card"><h3>Escopo</h3><p>Usuários, mundos, catálogo partidário, configurações, geografia e auditoria.</p><p class="small muted">Não são aceitos comandos, scripts ou consultas arbitrárias.</p></div></div>'}
window.adminPreviewImport=function(){if(!requireAdmin())return;const f=document.getElementById('adminImportFile')?.files?.[0];if(!f)return toast('Selecione um JSON.',true);const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const errs=[];if(x.application!=='MANDATO')errs.push('arquivo não é um snapshot MANDATO');if(!Array.isArray(x.users))errs.push('users ausente ou inválido');if(!Array.isArray(x.partyCatalog))errs.push('partyCatalog ausente ou inválido');document.getElementById('adminImportResult').textContent=errs.length?'Inválido: '+errs.join('; '):'Válido: '+x.users.length+' usuário(s), '+x.partyCatalog.length+' partido(s). Clique novamente para confirmar a importação.';if(!errs.length&&confirm('Confirmar importação? Ela pode substituir registros existentes pelos IDs presentes no arquivo.'))adminApplyImport(x)}catch(e){document.getElementById('adminImportResult').textContent='JSON inválido: '+e.message}};r.readAsText(f)}
async function adminApplyImport(x){const current=await dbAll();for(const incoming of x.users){if(!incoming?.id)continue;const existing=current.find(u=>u.id===incoming.id);if(existing?.email?.toLowerCase()===ADMIN_EMAIL&&incoming.email?.toLowerCase()!==ADMIN_EMAIL){toast('Importação recusada: a conta principal não pode ser rebaixada.',true);return}await dbPut(incoming)}if(Array.isArray(x.partyCatalog)){partyV6Save(x.partyCatalog);window.MANDATO_PARTY_CATALOG_V6=x.partyCatalog;try{MANDATO_PARTY_CATALOG_V6=x.partyCatalog}catch(e){}}if(x.global)saveGlobalSettings(x.global);if(x.geo)saveGeo(x.geo);audit('import.apply','snapshot',null,'Snapshot importado com confirmação');toast('Importação concluída.');renderAdminContext()}
async function renderBackups(){const bs=backups().slice().reverse();return adminHeader('Backups','Backups locais do estado administrativo disponível neste navegador.',adminBtn('CRIAR BACKUP','adminCreateBackup()',true))+adminTable(['Criado','ID','Usuários no snapshot','Partidos','Ações'],bs.map(b=>'<tr><td>'+safeDate(b.createdAt)+'</td><td class="small">'+adminEscape(b.id)+'</td><td>'+((b.snapshot?.users||[]).length)+'</td><td>'+((b.snapshot?.partyCatalog||[]).length)+'</td><td><button class="btn sm" onclick="adminDownloadBackup(\''+adminEscape(b.id)+'\')">EXPORTAR</button></td></tr>'))}
async function renderAudit(){let a=adminAudit().slice().reverse();if(adminState.query)a=a.filter(x=>[x.action,x.entity,x.detail,x.idRef].join(' ').toLowerCase().includes(adminState.query.toLowerCase()));return adminHeader('Auditoria','Histórico das operações administrativas registradas pelo painel.',adminSearch()+adminBtn('EXPORTAR','adminExportAudit()'))+adminTable(['Data','Ação','Entidade','Referência','Escopo','Detalhe'],a.slice(0,500).map(x=>'<tr><td>'+safeDate(x.at)+'</td><td>'+adminEscape(x.action)+'</td><td>'+adminEscape(x.entity)+'</td><td class="small">'+adminEscape(x.idRef||'—')+'</td><td>'+adminEscape(x.scope||'global')+'</td><td>'+adminEscape(x.detail)+'</td></tr>'))}
window.adminExportAudit=function(){if(!requireAdmin())return;downloadJSON('MANDATO_ADMIN_AUDITORIA_'+new Date().toISOString().slice(0,10)+'.json',adminAudit());audit('audit.export','audit',null,'Log administrativo exportado')}
async function renderIntegrity(){const users=await dbAll(),worlds=allWorlds(users),issues=[];const ids=new Set();users.forEach(u=>{if(!u.id)issues.push('Usuário sem ID');if(!u.email)issues.push('Usuário '+u.id+' sem e-mail');(u.saves||[]).forEach(s=>{if(ids.has(s.id))issues.push('ID de save duplicado: '+s.id);ids.add(s.id);adminValidateSave(s).forEach(e=>issues.push((u.email||u.id)+': '+e+' em '+(s.name||s.id)))})});const p=partyCatalog();const pn=new Set();p.forEach(x=>{if(pn.has(x.sigla))issues.push('Partido duplicado: '+x.sigla);pn.add(x.sigla);if(!x.name)issues.push('Partido sem nome: '+x.sigla)});return adminHeader('Integridade e manutenção','Verificações não destrutivas dos dados atuais.',adminBtn('EXECUTAR NOVAMENTE','renderAdminContext()',true))+ '<div class="adminKpis">'+adminKpi('Usuários',users.length,'verificados')+adminKpi('Mundos',worlds.length,'verificados')+adminKpi('Partidos',p.length,'verificados')+adminKpi('Problemas',issues.length,issues.length?'requer atenção':'nenhum encontrado')+'</div><div class="card">'+(issues.length?'<div class="adminTimeline">'+issues.slice(0,200).map(x=>'<div class="item"><span class="adminBadge err">PROBLEMA</span> '+adminEscape(x)+'</div>').join('')+'</div>':'<div class="adminEmpty">Nenhuma inconsistência estrutural encontrada.</div>')+'</div>'}
window.adminRunIntegrity=function(){adminState.module='integrity';renderAdminContext()}
async function renderModule(){const m=adminState.module;let out;if(m==='dashboard')out=await renderDashboard();else if(m==='users')out=await renderUsers();else if(m==='worlds')out=await renderWorlds();else if(m==='parties')out=await renderParties();else if(m==='candidates')out=await (window.renderCandidates?window.renderCandidates():renderCandidates());else if(m==='elections')out=await (window.renderElections?window.renderElections():renderElections());else if(m==='campaigns')out=await (window.renderCampaigns?window.renderCampaigns():renderCampaigns());else if(m==='governments')out=await (window.renderGovernments?window.renderGovernments():renderGovernments());else if(m==='legislative')out=await (window.renderLegislative?window.renderLegislative():renderLegislative());else if(m==='economy')out=await (window.renderEconomy?window.renderEconomy():renderEconomy());else if(m==='polls')out=await (window.renderPolls?window.renderPolls():renderPolls());else if(m==='news')out=await (window.renderNews?window.renderNews():renderNews());else if(m==='calendar')out=await renderAdminCalendarModule();else if(m==='geography')out=await renderGeography();else if(m==='progression')out=await (window.renderProgression?window.renderProgression():renderProgression());else if(m==='settings')out=await renderSettings();else if(m==='io')out=await renderIO();else if(m==='backups')out=await renderBackups();else if(m==='audit')out=await renderAudit();else if(m==='integrity')out=await renderIntegrity();else out=await renderDashboard();return out}
async function renderAdminContext(){if(!requireAdmin())return;ensureAdminUI();setAdminActive();const el=document.getElementById('adminWorkspace');if(!el)return;el.innerHTML='<div class="stateCard"><div class="spinner"></div><h3>Carregando módulo</h3><p class="muted">Consultando os dados persistidos.</p></div>';try{el.innerHTML=await renderModule()}catch(e){el.innerHTML='<div class="stateCard errorState"><h2>Falha no módulo administrativo</h2><p class="muted">'+adminEscape(e.message||e)+'</p></div>';audit('module.error','admin',adminState.module,String(e.message||e))}}
window.renderAdminContext=renderAdminContext;
window.showAdminView=function(v){adminState.module=v||'dashboard';renderAdminContext()}
const oldShowAdminLayout=window.showAdminLayout;
window.showAdminLayout=function(){if(!requireAdmin())return;setContext('admin');ensureAdminUI();renderAdminContext()}
const oldRenderAccountDashboard=window.renderAccountDashboard;
if(typeof oldRenderAccountDashboard==='function'){window.renderAccountDashboard=oldRenderAccountDashboard}
const adminMountObserver=new MutationObserver(function(){if(!user||!isAdminAuthorized())return;const layout=document.getElementById('accountLayout');if(!layout||layout.classList.contains('hidden'))return;const side=layout.querySelector('.accountSide');if(!side||side.querySelector('[data-open-admin]'))return;const b=document.createElement('button');b.className='navbtn';b.setAttribute('data-open-admin','1');b.textContent='Painel administrativo';b.onclick=()=>showAdminLayout();const credit=side.querySelector('.sideCredit');side.insertBefore(b,credit||null)});adminMountObserver.observe(document.body,{childList:true,subtree:true});
window.__adminAllWorlds=allWorlds;window.__adminFiltered=filtered;window.__adminSearch=adminSearch;window.__adminTable=adminTable;window.__adminRequireAdmin=requireAdmin;window.__adminEscape=adminEscape;window.__adminHeader=adminHeader;window.__adminBtn=adminBtn;window.__adminAudit=audit;window.__adminValidateSave=adminValidateSave;window.__adminPartyCatalog=partyCatalog;
window.__adminRenderCandidatesBase=renderCandidates;window.__adminRenderElectionsBase=renderElections;window.__adminRenderCampaignsBase=renderCampaigns;window.__adminRenderGovernmentsBase=renderGovernments;window.__adminRenderLegislativeBase=renderLegislative;window.__adminRenderEconomyBase=renderEconomy;window.__adminRenderPollsBase=renderPolls;window.__adminRenderNewsBase=renderNews;window.__adminRenderCalendarBase=renderAdminCalendarModule;window.__adminRenderProgressionBase=renderProgression;
const oldLogin=window.login;
window.login=async function(){await oldLogin?.apply(this,arguments)};
const oldRestore=window.restoreAuthSession;
window.restoreAuthSession=async function(){const ok=await oldRestore?.apply(this,arguments);if(ok&&user?.adminStatus==='suspended'){clearSession();user=null;toast('Conta suspensa.',true);setContext('auth');await authScreen();return false}return ok}
const oldBoot=window.boot;
window.boot=async function(){return oldBoot?.apply(this,arguments)};
})();
</script>

<script>
(function(){
'use strict';
const allWorlds=window.__adminAllWorlds,filtered=window.__adminFiltered,requireAdmin=window.__adminRequireAdmin,adminEscape=window.__adminEscape,adminHeader=window.__adminHeader,adminBtn=window.__adminBtn,adminSearch=window.__adminSearch,adminTable=window.__adminTable,audit=window.__adminAudit,adminValidateSave=window.__adminValidateSave,partyCatalog=window.__adminPartyCatalog;
async function worlds(){return allWorlds(await dbAll())}
function worldOptions(ws,selected){return ws.map(w=>'<option value="'+adminEscape(w.owner.id+'|'+w.save.id)+'" '+(selected===w.owner.id+'|'+w.save.id?'selected':'')+'>'+adminEscape(w.save.name)+' — '+adminEscape(w.owner.email)+'</option>').join('')}
function parseWorld(v){const [ownerId,saveId]=String(v||'').split('|');return{ownerId,saveId}}
async function worldByKey(v){const k=parseWorld(v),u=(await dbAll()).find(x=>x.id===k.ownerId),s=u?.saves?.find(x=>String(x.id)===String(k.saveId));return u&&s?{owner:u,save:s}:null}
window.adminCandidateCreate=async function(){if(!requireAdmin())return;const ws=await worlds();if(!ws.length)return toast('Não existem mundos para receber um candidato.',true);modal('<h2>Novo candidato simulado</h2><div class="formgrid"><div class="field" style="grid-column:1/-1"><label>Mundo</label><select id="admCandWorld">'+worldOptions(ws)+'</select></div><div class="field"><label>Nome público</label><input id="admCandName"></div><div class="field"><label>Partido</label><input id="admCandParty"></div><div class="field"><label>Cargo</label><input id="admCandOffice"></div><div class="field"><label>Estado/região</label><input id="admCandRegion"></div><div class="field"><label>Experiência</label><input id="admCandExp" type="number" value="3"></div><div class="field"><label>Popularidade</label><input id="admCandPop" type="number" value="50" min="0" max="100"></div><div class="field"><label>Reputação</label><input id="admCandRep" type="number" value="50" min="0" max="100"></div></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="adminCandidateSaveNew()">CRIAR CANDIDATO</button></div>')}
window.adminCandidateSaveNew=async function(){if(!requireAdmin())return;const w=await worldByKey(val('admCandWorld'));const name=val('admCandName');if(!w||!name)return toast('Mundo e nome são obrigatórios.',true);w.save.world=w.save.world||{};w.save.world.candidates=Array.isArray(w.save.world.candidates)?w.save.world.candidates:[];if(w.save.world.candidates.some(c=>String(c.politicalName||c.name).toLowerCase()===name.toLowerCase()))return toast('Candidato duplicado neste mundo.',true);const c={id:uid(),name,politicalName:name,party:val('admCandParty'),office:val('admCandOffice')||'Candidato',state:val('admCandRegion')||w.save.region,experience:Number(val('admCandExp'))||0,popularity:clamp(Number(val('admCandPop'))||50),reputation:clamp(Number(val('admCandRep'))||50),influence:40,active:true,simulated:true,history:[]};w.save.world.candidates.push(c);w.save.updatedAt=Date.now();await dbPut(w.owner);audit('candidate.create','candidate',c.id,'Candidato simulado criado',w.owner.id);closeModal();renderAdminContext();toast('Candidato criado.')}
window.adminCandidateEdit=async function(ownerId,saveId,cid){if(!requireAdmin())return;const u=(await dbAll()).find(x=>x.id===ownerId),s=u?.saves?.find(x=>String(x.id)===String(saveId)),c=s?.world?.candidates?.find(x=>String(x.id||x.politicalName)===String(cid));if(!u||!s||!c)return;modal('<h2>Editar candidato</h2><div class="formgrid"><div class="field"><label>Nome público</label><input id="admCandName" value="'+adminEscape(c.politicalName||c.name)+'"></div><div class="field"><label>Partido</label><input id="admCandParty" value="'+adminEscape(c.party||'')+'"></div><div class="field"><label>Cargo</label><input id="admCandOffice" value="'+adminEscape(c.office||'')+'"></div><div class="field"><label>Experiência</label><input id="admCandExp" type="number" value="'+adminEscape(c.experience||0)+'"></div><div class="field"><label>Popularidade</label><input id="admCandPop" type="number" value="'+adminEscape(c.popularity||0)+'"></div><div class="field"><label>Reputação</label><input id="admCandRep" type="number" value="'+adminEscape(c.reputation||0)+'"></div></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="adminCandidateSaveEdit(\''+adminEscape(ownerId)+'\',\''+adminEscape(saveId)+'\',\''+adminEscape(cid)+'\')">SALVAR</button></div>')}
window.adminCandidateSaveEdit=async function(ownerId,saveId,cid){if(!requireAdmin())return;const u=(await dbAll()).find(x=>x.id===ownerId),s=u?.saves?.find(x=>String(x.id)===String(saveId)),c=s?.world?.candidates?.find(x=>String(x.id||x.politicalName)===String(cid));if(!u||!s||!c)return;c.politicalName=val('admCandName')||c.politicalName;c.name=c.politicalName;c.party=val('admCandParty');c.office=val('admCandOffice');c.experience=Number(val('admCandExp'))||0;c.popularity=clamp(Number(val('admCandPop'))||0);c.reputation=clamp(Number(val('admCandRep'))||0);s.updatedAt=Date.now();await dbPut(u);audit('candidate.update','candidate',cid,'Candidato atualizado',ownerId);closeModal();renderAdminContext();toast('Candidato atualizado.')}
async function electionCreate(){if(!requireAdmin())return;const ws=await worlds();if(!ws.length)return toast('Crie um mundo antes de cadastrar uma eleição.',true);modal('<h2>Nova eleição simulada</h2><div class="formgrid"><div class="field" style="grid-column:1/-1"><label>Mundo</label><select id="admElecWorld">'+worldOptions(ws)+'</select></div><div class="field"><label>Cargo</label><input id="admElecOffice" value="Vereador"></div><div class="field"><label>Data</label><input id="admElecDate" type="date"></div><div class="field"><label>Sistema</label><select id="admElecSystem"><option value="proporcional">Proporcional</option><option value="majoritária-1-turno">Majoritária — 1 turno</option><option value="majoritária-2-turnos">Majoritária — 2 turnos</option></select></div><div class="field"><label>Vagas</label><input id="admElecSeats" type="number" value="1" min="1"></div><div class="field"><label>Segundo turno</label><select id="admElecRunoff"><option value="false">Não</option><option value="true">Sim</option></select></div></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="adminElectionSaveNew()">CRIAR ELEIÇÃO</button></div>')}
window.adminElectionCreate=electionCreate;
window.adminElectionSaveNew=async function(){if(!requireAdmin())return;const w=await worldByKey(val('admElecWorld'));if(!w)return;const e={id:uid(),date:val('admElecDate')||w.save.date,year:Number((val('admElecDate')||w.save.date).slice(0,4)),office:val('admElecOffice')||'Vereador',system:val('admElecSystem'),seats:Math.max(1,Number(val('admElecSeats'))||1),runoff:val('admElecRunoff')==='true',status:'planejada',participants:[],results:[],simulated:true,createdByAdmin:true};w.save.elections=Array.isArray(w.save.elections)?w.save.elections:[];w.save.elections.push(e);await dbPut(w.owner);audit('election.create','election',e.id,'Eleição simulada criada',w.owner.id);closeModal();renderAdminContext();toast('Eleição criada.')}
window.adminElectionManage=async function(ownerId,saveId,eid){if(!requireAdmin())return;const u=(await dbAll()).find(x=>x.id===ownerId),s=u?.saves?.find(x=>String(x.id)===String(saveId)),e=s?.elections?.find(x=>String(x.id)===String(eid));if(!u||!s||!e)return;const next=e.status==='encerrada'?'planejada':e.status==='planejada'?'em andamento':'encerrada';if(!adminConfirm('Alterar estado desta eleição para '+next+'?'))return;e.status=next;await dbPut(u);audit('election.status','election',eid,'Estado alterado para '+next,ownerId);renderAdminContext()}
async function campaignEdit(){if(!requireAdmin())return;const ws=await worlds();if(!ws.length)return;modal('<h2>Editar estratégia de campanha</h2><div class="field"><label>Mundo</label><select id="admCampWorld">'+worldOptions(ws)+'</select></div><div class="field"><label>Cargo</label><input id="admCampOffice"></div><div class="field"><label>Coerência (0–100)</label><input id="admCampCoh" type="number" min="0" max="100" value="50"></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="adminCampaignSave()">SALVAR</button></div>')}
window.adminCampaignCreate=campaignEdit;
window.adminCampaignSave=async function(){if(!requireAdmin())return;const w=await worldByKey(val('admCampWorld'));if(!w)return;w.save.campaignStrategy=w.save.campaignStrategy||{priorities:[],history:[],coherence:50};w.save.campaignStrategy.office=val('admCampOffice')||w.save.campaignStrategy.office||w.save.character?.office||'Prefeito';w.save.campaignStrategy.coherence=clamp(Number(val('admCampCoh'))||50);w.save.campaignStrategy.lastChangedAt=w.save.date;await dbPut(w.owner);audit('campaign.update','campaign',w.save.id,'Estratégia de campanha atualizada pelo administrador',w.owner.id);closeModal();renderAdminContext();toast('Estratégia atualizada.')}

const _oldRenderElections=window.renderElections;window.renderElections=async function(){const users=await dbAll(),ws=allWorlds(users),list=[];ws.forEach(w=>(w.save.elections||[]).forEach(e=>list.push({e,owner:w.owner,save:w.save})));const f=filtered(list,[x=>x.e.office,x=>x.e.result,x=>x.e.party,x=>x.save.name,x=>x.owner.email]);return adminHeader('Eleições','Resultados e registros eleitorais armazenados por mundo.',adminSearch()+adminBtn('NOVA ELEIÇÃO','adminElectionCreate()',true))+adminTable(['Data','Cargo','Partido','Estado','Votos','Mundo','Ações'],f.map(x=>'<tr><td>'+adminEscape(x.e.date||x.save.date)+'</td><td>'+adminEscape(x.e.office||'—')+'</td><td>'+adminEscape(x.e.party||'—')+'</td><td>'+adminEscape(x.e.status||x.e.result||'—')+'</td><td>'+adminEscape(x.e.votes||0)+'</td><td>'+adminEscape(x.save.name)+'</td><td><button class="btn sm" onclick="adminElectionManage(\''+adminEscape(x.owner.id)+'\',\''+adminEscape(x.save.id)+'\',\''+adminEscape(x.e.id)+'\')">ALTERAR ESTADO</button></td></tr>'))}
