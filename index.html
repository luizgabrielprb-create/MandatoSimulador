function createCareer(){syncCareerDraft();if(!user)return;const startDate=`${careerDraft.year||2026}-01-05`,data={...careerDraft,saveName:careerDraft.saveName||'Minha carreira',startDate,uf:careerDraft.region,city:careerDraft.municipality,initialOffice:careerDraft.initialSituation==='Parlamentar'?'Parlamentar':careerDraft.initialSituation==='Governante'?'Governante':'Cidadão'};let s=normalizeSave(newSave(data),user.id);s.name=data.saveName;s.description=data.description;s.country=data.country;s.region=data.uf;s.municipality=data.city;s.character.profession=data.profession;s.character.education=data.education;s.character.gender=data.gender;s.character.socialOrigin=data.socialOrigin;s.character.zone=data.zone;s.character.experiencePath=data.experiencePath;s.character.residence=data.residence;s.character.birthPlace=data.birthPlace||s.character.birthPlace;s.character.personalHistory=data.personalHistory;s.character.initialSituation=data.initialSituation;s.character.attributes=calculateCharacterAttributes(data);Object.assign(s.character,s.character.attributes);s.character.experience=({"Cidadão sem experiência política":0,"Ativista comunitário":1,"Líder estudantil":2,"Liderança sindical":3,"Assessor parlamentar":5,"Vereador":5,"Secretário municipal":6,"Dirigente partidário":7,"Candidato anterior":4,"Parlamentar":8,"Gestor público":8}[data.experiencePath]||0);s.settings.eventFrequency=data.eventFrequency;s.settings.realism=data.realism;s.scenario.rules=data.rules;s.history=[];seedRelations(s);seedNews(s);s.history.push({date:s.date,title:'Carreira criada',text:`${s.character.politicalName} iniciou uma trajetória em um mundo independente.`});if(s.character.party)s.history.push({date:s.date,title:'Filiação inicial',text:`Filiação registrada no partido ${s.character.party}.`});user.saves.push(deepClone(s));save=deepClone(s);appState.activeSaveId=s.id;persistUser().then(()=>{closeModal();showCareerLayout();renderCareerApp();showCareerView('dashboard');toast(mandatoIcon('check')+' Carreira criada e salva')}).catch(e=>toast('Falha ao criar carreira: '+e.message,true))}
async function register(){
 if(authBusy)return;clearAuthError();const name=document.getElementById('aName')?.value.trim(),un=document.getElementById('aUser')?.value.trim(),email=document.getElementById('aEmail')?.value.trim().toLowerCase(),pass=document.getElementById('aPass')?.value;
 if(!name||!un||!email||pass.length<4)return authError('Preencha todos os campos. A senha deve ter pelo menos 4 caracteres.',[!name?'aName':'',!un?'aUser':'',!email?'aEmail':'',pass.length<4?'aPass':''].filter(Boolean));
 setAuthBusy(true,'CRIAR CONTA');
 try{const all=await dbAll();if(all.some(x=>String(x.email||'').toLowerCase()===email)){showAuth('login');prefillKnownAccount(email);authError('Esta conta já existe. Entre nela para recuperar seus saves e progresso.',['aEmail']);return;}if(all.some(x=>String(x.userName||'').toLowerCase()===un.toLowerCase()))return authError('Este nome de usuário já está em uso. Escolha outro.',['aUser']);const hp=await hashPassword(pass);user=normalizeUser(blankProfile(name,un,email));user.passwordHash=hp.hash;user.passwordSalt=hp.salt;user.passwordHashAlgo='PBKDF2-SHA256';user.authProvider='local';await dbPut(user);rememberKnownAccount(user);createSession(user.id,true);enterGame()}catch(e){authError('Não foi possível criar a conta. Verifique o armazenamento do navegador e tente novamente.')}finally{setAuthBusy(false,'CRIAR CONTA')}}
async function login(){
 if(authBusy)return;clearAuthError();const email=document.getElementById('aEmail')?.value.trim().toLowerCase(),pass=document.getElementById('aPass')?.value;
 if(!email||!pass)return authError('Informe seu e-mail e sua senha.',[!email?'aEmail':'',!pass?'aPass':''].filter(Boolean));
 setAuthBusy(true);
 try{const all=await dbAll(),found=all.find(x=>x.email===email);if(!found||!(await verifyPassword(pass,found)))return authError('E-mail ou senha incorretos.',['aEmail','aPass']);if(found.adminStatus==='suspended')return authError('Esta conta está suspensa.',['aEmail','aPass']);user=normalizeUser(found);
   if(found.passwordHashAlgo!=='PBKDF2-SHA256'){const hp=await hashPassword(pass);user.passwordHash=hp.hash;user.passwordSalt=hp.salt;user.passwordHashAlgo='PBKDF2-SHA256';}
   user.lastLogin=Date.now();await dbPut(user);rememberKnownAccount(user);const remember=document.getElementById('aRemember')?.checked!==false;createSession(user.id,remember);enterGame();
 }catch(e){authError('Não foi possível concluir o login. Verifique sua conexão/armazenamento e tente novamente.')}finally{setAuthBusy(false,'ENTRAR')}}
async function restoreAuthSession(){const session=readSession();if(!session)return false;try{const u=await dbGet(session.data.userId);if(!u||u.authProvider==='google'){if(u?.authProvider==='google')clearSession();return false}if(u.adminStatus==='suspended'){clearSession();return false}if(Number(session.data.sessionVersion||0)!==Number(u.sessionVersion||0)){clearSession();return false}user=normalizeUser(u);user.lastLogin=user.lastLogin||Date.now();await dbPut(user);if(mandatoInterfaceSession)enterGame();return true}catch(e){clearSession();return false}}
function initializeApplication(){
 appState.initialized=true;
 // A escolha de interface é obrigatória a cada abertura/recarregamento.
 // Ela não é persistida e não altera conta, saves ou progresso.
 showMandatoInterfaceChooser();
 initDB().then(async()=>{
   if(window.MANDATO_FIREBASE_CONFIG?.apiKey)await window.initMandatoCloud?.();
   if(await restoreAuthSession())return;
   if(firebaseReady){try{await firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);firebaseAuth.onAuthStateChanged(async g=>{if(!g||user)return;try{const all=await dbAll();let u=all.find(x=>x.googleUid===g.uid)||all.find(x=>x.email===g.email?.toLowerCase());if(u){u.googleUid=g.uid;u.authProvider='google';u.photoURL=g.photoURL||u.photoURL||'';u.lastLogin=Date.now();await dbPut(u);user=u;if(mandatoInterfaceSession)enterGame()}}catch(e){}})}catch(e){}}
 }).catch(e=>{
   appState.error=e;
   // A escolha continua disponível mesmo se o armazenamento falhar.
 });
}

function renderProposals(){const el=document.getElementById('proposals');if(!el||!save)return;advEnsureSave(save);el.innerHTML=`<div class="hero"><div><div class="tag">PROPOSTAS E PROJETOS</div><h1>Trajetória das propostas</h1><p>Fluxos diferentes para iniciativas legislativas, administrativas, comunitárias e de campanha.</p></div><button class="btn primary" onclick="newProposal()">+ NOVA PROPOSTA</button></div><div class="grid g4">${cardMetric('Em andamento',save.proposals.filter(p=>!['Aprovada','Rejeitada','Arquivada','Avaliação'].includes(p.stage)).length)}${cardMetric('Apoio médio',Math.round(save.proposals.reduce((a,p)=>a+p.support,0)/Math.max(1,save.proposals.length))+'%')}${cardMetric('Aprovadas',save.proposals.filter(p=>p.stage==='Aprovada').length)}${cardMetric('Em avaliação',save.proposals.filter(p=>p.stage==='Avaliação').length)}</div><div class="grid g2" style="margin-top:14px">${save.proposals.map(p=>`<div class="card"><div class="row"><div><div class="tag">${escapeHtml(p.kind)} · ${escapeHtml(p.area)}</div><h3>${escapeHtml(p.title)}</h3></div><span class="pill">${escapeHtml(p.priority)}</span></div><p class="small muted">${escapeHtml(p.description||p.desc)}</p>${advRenderStatus(p.stage,p.kind)}<div style="margin-top:10px" class="miniBar"><i style="width:${clamp(p.support)}%"></i></div><div class="row small muted" style="margin-top:5px"><span>Apoio ${Math.round(p.support)}%</span><span>Oposição ${Math.round(p.opposition)}%</span></div><div class="actions" style="margin-top:12px"><button class="btn primary sm" onclick="advanceProposalStage('${p.id}')">AVANÇAR TRAMITAÇÃO</button><button class="btn sm" onclick="showProposalDetails('${p.id}')">DETALHES</button></div><div class="small muted" style="margin-top:8px">Atualizada em ${escapeHtml(p.updated||p.created)} · custo ${money(p.cost)}</div></div>`).join('')||'<div class="card"><h3>Nenhuma proposta</h3><p class="muted">Crie a primeira proposta da carreira.</p></div>'}</div>`}
function showProposalDetails(id){const p=save.proposals.find(x=>x.id===id);if(!p)return;modal(`<div class="row"><div><div class="tag">PROPOSTA</div><h2>${escapeHtml(p.title)}</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><div class="grid g2"><div class="softPanel"><b>Problema</b><p>${escapeHtml(p.problem||'Não informado')}</p><b>Objetivos</b><p>${escapeHtml(p.objectives||'Não informado')}</p><b>Justificativa</b><p>${escapeHtml(p.justification||'Não informado')}</p></div><div class="softPanel"><b>Financiamento</b><p>${escapeHtml(p.funding)} · ${money(p.cost)}</p><b>Prazo</b><p>${escapeHtml(p.deadline||'Não definido')}</p><b>Indicadores</b><p>${escapeHtml(p.indicators||'Não definidos')}</p></div></div><div class="card" style="margin-top:12px"><h3>Histórico da tramitação</h3><div class="timeline">${p.history.slice().reverse().map(h=>`<div class="timelineItem"><b>${escapeHtml(h.stage)}</b><div class="small muted">${escapeHtml(h.date)} · ${escapeHtml(h.note)}</div></div>`).join('')}</div></div>`)}
function renderCalendar(){const el=document.getElementById('calendar');if(!el||!save)return;advEnsureSave(save);const d=advNow(),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),start=(first.getDay()+6)%7;const cells=[];for(let i=0;i<start;i++)cells.push(`<div class="calendarDay mutedDay"></div>`);for(let day=1;day<=days;day++){const ds=iso(new Date(year,month,day));const ev=save.calendar.filter(x=>x.date===ds&&x.status!=='cancelado').sort((a,b)=>a.time.localeCompare(b.time));cells.push(`<div class="calendarDay ${ds===save.date?'today':''}"><b>${day}</b>${ev.map(e=>`<div class="calendarEvent" onclick="calendarDetails('${e.id}')"><b>${escapeHtml(e.time)}</b> ${escapeHtml(e.title)}</div>`).join('')||'<div class="small muted" style="margin-top:8px">—</div>'}</div>`)}const upcoming=save.calendar.filter(e=>e.date>=save.date&&e.status!=='cancelado').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,10);el.innerHTML=`<div class="hero"><div><div class="tag">CALENDÁRIO POLÍTICO</div><h1>${MANDATO_MONTHS[month]} de ${year}</h1><p>Agenda, prazos e compromissos são objetos do mundo do save.</p></div><div class="actions"><button class="btn primary" onclick="newCalendarEvent()">+ COMPROMISSO</button><button class="btn" onclick="advanceGame(1)">+1 DIA</button><button class="btn" onclick="advanceGame(7)">+1 SEMANA</button><button class="btn" onclick="advanceToDatePrompt()">ATÉ DATA</button></div></div><div class="card"><div class="calendarGrid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="small muted" style="text-align:center">${x}</div>`).join('')}${cells.join('')}</div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Próximos compromissos</h3>${upcoming.map(e=>`<div class="item"><div class="row"><b>${escapeHtml(e.title)}</b><span class="pill">${escapeHtml(e.importance)}</span></div><div class="small muted">${escapeHtml(e.date)} · ${escapeHtml(e.time)}–${escapeHtml(e.endTime)} · ${escapeHtml(e.location||'local não definido')}</div><div class="actions" style="margin-top:7px"><button class="btn sm" onclick="calendarDetails('${e.id}')">ABRIR</button></div></div>`).join('')||'<div class="muted">Nenhum compromisso futuro.</div>'}</div><div class="card"><h3>Linha do tempo política</h3><div class="timeline">${save.history.slice(-8).reverse().map(h=>`<div class="timelineItem"><b>${escapeHtml(h.title)}</b><div class="small muted">${escapeHtml(h.date)} · ${escapeHtml(h.text)}</div></div>`).join('')}</div></div></div>`}
function newCalendarEvent(){modal(`<div class="row"><h2>Novo compromisso</h2><button class="btn sm" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Título</label><input id="ceTitle"></div><div class="field"><label>Tipo</label><select id="ceType">${['Reunião partidária','Sessão legislativa','Votação','Audiência pública','Debate','Entrevista','Evento de campanha','Convenção partidária','Viagem','Reunião com aliados','Entrevista coletiva','Prazo de proposta','Posse','Reunião de governo','Evento comunitário','Compromisso internacional','Prazo administrativo','Outro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="ceDate" type="date" value="${save.date}"></div><div class="field"><label>Hora</label><input id="ceTime" type="time" value="09:00"></div><div class="field"><label>Fim</label><input id="ceEnd" type="time" value="10:00"></div><div class="field"><label>Local</label><input id="ceLocation"></div><div class="field"><label>Importância</label><select id="ceImportance"><option>normal</option><option>alta</option><option>baixa</option></select></div><div class="field"><label>Participantes</label><input id="ceParticipants"></div><div class="field" style="grid-column:1/-1"><label>Descrição</label><textarea id="ceDesc"></textarea></div></div><div class="actions"><button class="btn primary" onclick="createCalendarEvent()">ADICIONAR</button></div>`)}
function createCalendarEvent(){const e=addCalendarEvent({title:val('ceTitle')||'Compromisso',type:val('ceType'),date:val('ceDate'),time:val('ceTime'),endTime:val('ceEnd'),location:val('ceLocation'),importance:val('ceImportance'),participants:val('ceParticipants').split(',').map(x=>x.trim()).filter(Boolean),description:val('ceDesc')});if(!e)return toast('Há conflito de horário ou horário inválido.',true);advHistory('Compromisso adicionado',`"${e.title}" foi incluído na agenda.`,e.id);saveState('Agenda atualizada');closeModal();renderCareerApp();showCareerView('calendar')}
function calendarDetails(id){const e=save.calendar.find(x=>x.id===id);if(!e)return;modal(`<div class="row"><div><div class="tag">${escapeHtml(e.type)}</div><h2>${escapeHtml(e.title)}</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><p>${escapeHtml(e.date)} · ${escapeHtml(e.time)}–${escapeHtml(e.endTime)} · ${escapeHtml(e.location||'Local não definido')}</p><p>${escapeHtml(e.description||'Sem descrição.')}</p><p class="small muted">Participantes: ${escapeHtml(e.participants.join(', ')||'não definidos')}</p><div class="actions"><button class="btn" onclick="calendarComplete('${e.id}')">${e.status==='concluído'?'CONCLUÍDO':'MARCAR CONCLUÍDO'}</button><button class="btn" onclick="calendarReschedule('${e.id}')">REAGENDAR</button><button class="btn danger" onclick="calendarCancel('${e.id}')">CANCELAR</button></div>`)}
function calendarComplete(id){const e=save.calendar.find(x=>x.id===id);if(!e)return;e.status='concluído';e.completedAt=save.date;advHistory('Compromisso concluído',`"${e.title}" foi concluído.`,e.id);advNotify('Evento concluído','Compromisso concluído',e.title,'calendar',e.id,e.id,false);saveState('Compromisso concluído');closeModal();renderCareerApp();showCareerView('calendar')}
function calendarCancel(id){const e=save.calendar.find(x=>x.id===id);if(!e)return;e.status='cancelado';advHistory('Compromisso cancelado',`"${e.title}" foi cancelado.`,e.id);addNews('POLÍTICA','Compromisso cancelado',`O compromisso "${e.title}" foi cancelado e a agenda foi atualizada.`,'info','BRASIL',{importance:'normal',relatedCharacters:e.participants});saveState('Agenda atualizada');closeModal();renderCareerApp();showCareerView('calendar')}
function calendarReschedule(id){const e=save.calendar.find(x=>x.id===id);if(!e)return;const nd=prompt('Nova data (AAAA-MM-DD):',e.date);if(!nd)return;const nt=prompt('Nova hora:',e.time);if(!nt)return;if(advCalendarConflict(nd,nt,e.endTime,id))return toast('Conflito de horário.',true);e.date=nd;e.time=nt;e.status='pendente';advHistory('Compromisso reagendado',`"${e.title}" foi movido para ${nd} às ${nt}.`,e.id);saveState('Agenda atualizada');renderCareerApp();showCareerView('calendar')}
function advanceToDatePrompt(){const target=prompt('Avançar até qual data? (AAAA-MM-DD)',save.date);if(!target)return;advanceGame(target)}
function advanceGame(amount){if(!save)return;let target;if(typeof amount==='number'){if(amount<=0)return;const d=advNow();d.setDate(d.getDate()+amount);target=iso(d)}else target=amount;if(target<=save.date)return toast('O jogo não pode voltar no tempo por esta função.',true);const diff=advDaysBetween(save.date,target);if(diff>90&&!confirm(`Você está avançando ${diff} dias. Deseja continuar?`))return;const pending=save.calendar.filter(e=>e.date>save.date&&e.date<=target&&e.status==='pendente'&&e.importance==='alta');if(pending.length&&!confirm(`Há ${pending.length} compromisso(s) importante(s) no intervalo. Avançar mesmo assim?`))return;for(let i=0;i<diff;i++){const d=new Date(save.date+'T12:00:00');d.setDate(d.getDate()+1);save.date=iso(d);save.year=d.getFullYear();dailyWorldTick()}save.week=Math.floor(advDaysBetween(`${save.year}-01-01`,save.date)/7)+1;save.stats.weeks++;advHistory('Tempo avançou',`A simulação avançou ${diff} dia(s), até ${dateLabel(save.date)}.`);if(save.settings.autosave)saveState(`Tempo avançado até ${dateLabel(save.date)}`);renderCareerApp();showCareerView(appState.careerView||'calendar')}
function dailyWorldTick(){if(!save)return;const d=advNow();if(d.getDay()===1){simulateEconomy();simulateWorld();}processDeadlines();processCalendarConsequences();if(Math.random()<0.10)generateContextualMessage();if(Math.random()<0.12)generateContextualNews();if(Math.random()<0.05)generateContextualEvent();}
function processDeadlines(){save.proposals.forEach(p=>{if(p.deadline&&p.deadline<save.date&&!['Aprovada','Rejeitada','Arquivada','Avaliação'].includes(p.stage)){p.stage='Atrasada';p.status='Atrasada';advHistory('Prazo vencido',`O prazo de "${p.title}" venceu sem conclusão.`,p.id);advNotify('Prazo vencendo','Prazo de proposta vencido',p.title,'proposals',p.id,p.id,true)}})}
function processCalendarConsequences(){save.calendar.filter(e=>e.date===save.date&&e.status==='pendente').forEach(e=>{if(e.importance==='alta')advNotify('Reunião próxima','Compromisso importante hoje',e.title,'calendar',e.id,e.id,true)})}
function generateContextualMessage(){const options=[];const rel=save.relations.filter(r=>r.relation>25);if(rel.length){const r=pick(rel);options.push(()=>advMessage({sender:r.name,senderType:'político',subject:pick(['Podemos conversar sobre a próxima votação?','Tenho uma proposta para sua agenda','Convite para uma reunião']),text:pick([`Acho que podemos avançar em uma pauta de interesse comum. Você teria disponibilidade?`,`Gostaria de apresentar uma alternativa antes da próxima decisão.`,`Há um ponto da agenda que merece negociação antes de seguirmos.`]),category:'Política',importance:Math.random()<.25?'alta':'normal',actions:['responder','marcar_reunião'],relatedCharacter:r.id}))}options.push(()=>{const invitation=Math.random()<.45;return advMessage({sender:pick(['Assessoria','Liderança comunitária','Jornalista','Organizador de debate']),subject:invitation?pick(['Convite para agenda','Convite para debate','Convite para reunião']):pick(['Solicitação de posicionamento','Demanda recebida','Pedido de entrevista']),text:invitation?pick(['Gostaríamos de contar com sua participação em uma atividade.','Há uma reunião importante na próxima semana e sua presença foi solicitada.','Um debate foi organizado e você foi convidado.']):pick(['Recebemos uma demanda que precisa de resposta.','Precisamos saber sua posição antes do próximo evento.','A equipe solicita seu posicionamento sobre esta pauta.']),category:invitation?'Convites':pick(['Comunidade','Imprensa','Política']),importance:invitation?'alta':'normal',actions:invitation?['accept','decline','propor_data','arquivar']:['responder','arquivar']})});pick(options)()}
function generateContextualNews(){const p=save.proposals.find(x=>x.stage==='Em implementação'||x.stage==='Implementação'||x.stage==='Aprovada');if(p)addNews('POLÍTICA PÚBLICA','Acompanhamento de proposta',`A agenda do save acompanha os próximos passos de "${p.title}".`,'info','BRASIL',{typeLabel:'Resultado de política pública',importance:'normal',relatedCharacters:p.stakeholders});else {const e=save.events[save.events.length-1];if(e)addNews('POLÍTICA','Repercussão de evento',`${e.title} continua gerando comentários no cenário político simulado.`,'info',e.scope||'BRASIL',{typeLabel:'Repercussão',importance:'normal'})}}
function generateContextualEvent(){const ev={id:uid(),date:save.date,title:pick(['Reunião inesperada altera negociação','Objeção técnica surge em projeto','Demanda comunitária ganha prioridade','Coalizão busca novo acordo']),text:pick(['Uma nova informação exige que os envolvidos revejam a estratégia.','Uma liderança apresentou uma objeção que ainda precisa ser respondida.','A agenda local passou a pressionar os responsáveis pela decisão.']),scope:pick(['MINHA CIDADE','MEU ESTADO','BRASIL']),status:'pendente'};save.events.push(ev);advNotify('Evento','Novo acontecimento político',ev.title,'events',ev.id,ev.id,false);addNews('POLÍTICA','Novo acontecimento no cenário',ev.text,'info',ev.scope,{typeLabel:'Evento simulado',importance:'normal'})}
function renderMessages(){const el=document.getElementById('messages');if(!el||!save)return;advEnsureSave(save);const f=window.mandatoMsgFilter||'Todas';let list=save.messages.filter(m=>!m.archived);if(f==='Não lidas')list=list.filter(m=>!m.read);else if(f==='Importantes')list=list.filter(m=>m.importance==='alta');else if(f==='Arquivadas')list=save.messages.filter(m=>m.archived);else if(f!=='Todas')list=list.filter(m=>m.category===f);el.innerHTML=`<div class="hero"><div><div class="tag">CAIXA DE ENTRADA</div><h1>Mensagens</h1><p>Conversas do mundo simulado geram decisões, convites e compromissos.</p></div><button class="btn" onclick="generateContextualMessage();renderCareerApp();showCareerView('messages')">RECEBER ATUALIZAÇÃO</button></div><div class="chipRow" style="margin-bottom:12px">${MANDATO_MESSAGE_CATEGORIES.map(x=>`<button class="btn sm ${f===x?'primary':''}" onclick="mandatoMsgFilter='${x}';renderMessages()">${x}</button>`).join('')}</div><div class="stack">${list.map(m=>`<div class="card ${m.read?'':'unread'}"><div class="row"><div><div class="tag">${escapeHtml(m.category)} · ${escapeHtml(m.senderType)}</div><h3>${m.read?'':'<span class="noticeDot"></span>'}${escapeHtml(m.subject)}</h3></div><span class="pill">${escapeHtml(m.importance)}</span></div><p class="small muted">${escapeHtml(m.sender)} · ${escapeHtml(m.date)}</p><p>${escapeHtml(m.text)}</p><div class="actions"><button class="btn sm" onclick="openMessage('${m.id}')">ABRIR</button>${!m.read?`<button class="btn sm" onclick="markMessageRead('${m.id}')">MARCAR LIDA</button>`:''}${m.actions?.includes('arquivar')?`<button class="btn sm" onclick="archiveMessage('${m.id}')">ARQUIVAR</button>`:''}</div></div>`).join('')||'<div class="card"><h3>Caixa vazia</h3><p class="muted">O mundo ainda não enviou novas mensagens.</p></div>'}</div>`}
function openMessage(id){const m=save.messages.find(x=>x.id===id);if(!m)return;m.read=true;saveState('Mensagem lida');modal(`<div class="row"><div><div class="tag">${escapeHtml(m.category)}</div><h2>${escapeHtml(m.subject)}</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><p class="small muted">${escapeHtml(m.sender)} · ${escapeHtml(m.date)} · ${escapeHtml(m.senderType)}</p><div class="softPanel"><p>${escapeHtml(m.text)}</p></div><div class="actions" style="margin-top:12px">${m.actions?.includes('responder')?`<button class="btn primary" onclick="replyMessage('${m.id}')">RESPONDER</button>`:''}${m.actions?.includes('accept')?`<button class="btn primary" onclick="acceptMessageInvite('${m.id}')">ACEITAR</button>`:''}${m.actions?.includes('decline')?`<button class="btn danger" onclick="declineMessageInvite('${m.id}')">RECUSAR</button>`:''}${m.actions?.includes('propor_data')?`<button class="btn" onclick="proposeMessageDate('${m.id}')">OUTRA DATA</button>`:''}${m.actions?.includes('marcar_reunião')?`<button class="btn" onclick="messageMeeting('${m.id}')">MARCAR REUNIÃO</button>`:''}<button class="btn" onclick="archiveMessage('${m.id}')">ARQUIVAR</button></div>`);renderMessages()}

function archiveMessage(id){const m=save.messages.find(x=>x.id===id);if(!m)return;m.archived=true;m.read=true;saveState('Mensagem arquivada');closeModal();renderMessages()}
function replyMessage(id){const m=save.messages.find(x=>x.id===id);if(!m)return;const text=prompt('Sua resposta:',`Obrigado pela mensagem, ${m.sender}.`);if(!text)return;const r=advMessage({sender:advActorLabel(),senderType:'jogador',subject:`RE: ${m.subject}`,text,category:m.category,importance:'normal',actions:[]});m.repliedAt=save.date;m.replyId=r.id;advHistory('Mensagem respondida',`Resposta enviada para ${m.sender}.`,m.id);saveState('Resposta enviada');closeModal();renderCareerApp();showCareerView('messages')}
function messageMeeting(id){const m=save.messages.find(x=>x.id===id);if(!m)return;const d=new Date(save.date+'T12:00:00');d.setDate(d.getDate()+1);const ds=iso(d);let e=null;for(const slot of [['10:00','11:00'],['11:30','12:30'],['14:00','15:00'],['16:00','17:00']]){e=addCalendarEvent({date:ds,time:slot[0],endTime:slot[1],type:'Reunião',title:`Reunião — ${m.sender}`,location:'A definir',participants:[m.sender],description:`Reunião originada pela mensagem: ${m.subject}`,importance:'alta',sourceRef:m.id});if(e)break}if(!e)return toast('Não foi possível agendar: todos os horários sugeridos estão ocupados.',true);m.read=true;m.accepted=true;advHistory('Convite convertido em agenda',`A mensagem de ${m.sender} gerou uma reunião.`,m.id);saveState('Reunião agendada');closeModal();renderCareerApp();showCareerView('calendar')}
function acceptMessageInvite(id){const m=save.messages.find(x=>x.id===id);if(!m)return;const d=new Date(save.date+'T12:00:00');d.setDate(d.getDate()+1);let e=null;for(const slot of [['10:00','11:00'],['14:00','15:00'],['16:00','17:00']]){e=addCalendarEvent({date:iso(d),time:slot[0],endTime:slot[1],type:'Convite aceito',title:`${m.subject} — ${m.sender}`,location:'A definir',participants:[m.sender],description:m.text,importance:'alta',sourceRef:m.id});if(e)break}if(!e)return toast('Não há horário livre para aceitar este convite.',true);m.read=true;m.accepted=true;m.decision='aceito';advHistory('Convite aceito',`O convite de ${m.sender} foi aceito e entrou na agenda.`,m.id);advNotify('Convite','Convite aceito',m.subject,'calendar',e.id,m.id,true);saveState('Convite aceito');closeModal();renderCareerApp();showCareerView('calendar')}

function renderNotifications(){const el=document.getElementById('notifications');if(!el||!save)return;const list=save.notifications.filter(n=>!n.dismissed);const unread=list.filter(n=>!n.read).length;el.innerHTML=`<div class="hero"><div><div class="tag">CENTRAL DE NOTIFICAÇÕES</div><h1>Avisos e acontecimentos</h1><p>${unread} não lida(s). Abrir a central não marca tudo automaticamente.</p></div><button class="btn" onclick="dismissReadNotifications()">DISPENSAR LIDAS</button></div><div class="stack">${list.map(n=>`<div class="card ${n.read?'':'unread'} ${n.important?'priorityHigh':''}"><div class="row"><div><div class="tag">${escapeHtml(n.type)} · ${escapeHtml(n.date)}</div><h3>${n.read?'':'<span class="noticeDot"></span>'}${escapeHtml(n.title)}</h3></div><span class="pill">${n.important?'IMPORTANTE':'normal'}</span></div><p>${escapeHtml(n.text)}</p><div class="actions"><button class="btn sm primary" onclick="openNotification('${n.id}')">ABRIR DESTINO</button>${!n.read?`<button class="btn sm" onclick="markNotificationRead('${n.id}')">MARCAR LIDA</button>`:''}<button class="btn sm" onclick="dismissNotification('${n.id}')">DISPENSAR</button></div></div>`).join('')||'<div class="card"><h3>Nenhuma notificação</h3><p class="muted">Tudo tranquilo por enquanto.</p></div>'}</div>`}

function renderNews(){const el=document.getElementById('news');if(!el||!save)return;advEnsureSave(save);const q=window.mandatoNewsFilter||{cat:'Todas',scope:'Todos',recent:false,important:false};let list=save.news.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));if(q.cat!=='Todas')list=list.filter(n=>n.cat===q.cat||n.typeLabel===q.cat);if(q.scope!=='Todos')list=list.filter(n=>n.scope===q.scope);if(q.recent){const cutoff=new Date(save.date+'T12:00:00');cutoff.setDate(cutoff.getDate()-30);list=list.filter(n=>new Date(n.date+'T12:00:00')>=cutoff)}if(q.important)list=list.filter(n=>n.importance==='alta');const cats=['Todas',...Array.from(new Set(save.news.map(n=>n.cat)))];const scopes=['Todos',...Array.from(new Set(save.news.map(n=>n.scope)))];el.innerHTML=`<div class="hero"><div><div class="tag">PORTAL POLÍTICO</div><h1>Feed Político</h1><p>Publicações do universo simulado, com origem e contexto identificados.</p></div></div><div class="card" style="margin-bottom:14px"><div class="formgrid"><div class="field"><label>Categoria</label><select onchange="mandatoNewsFilter.cat=this.value;renderNews()">${cats.map(x=>`<option ${q.cat===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div><div class="field"><label>Região</label><select onchange="mandatoNewsFilter.scope=this.value;renderNews()">${scopes.map(x=>`<option ${q.scope===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn sm ${q.recent?'primary':''}" onclick="mandatoNewsFilter.recent=!mandatoNewsFilter.recent;renderNews()">ÚLTIMOS 30 DIAS</button><button class="btn sm ${q.important?'primary':''}" onclick="mandatoNewsFilter.important=!mandatoNewsFilter.important;renderNews()">IMPORTANTES</button></div></div><div class="feedWrap">${list.map(n=>{n.likes=Number(n.likes)||rndi(8,180);n.views=Number(n.views)||rndi(80,2500);n.shares=Number(n.shares)||rndi(2,140);n.comments=Array.isArray(n.comments)?n.comments:[];return `<article class="feedCard premiumNews"><div class="newsCover"><span class="pill">${escapeHtml(n.cat)}</span><h2>${escapeHtml(n.title)}</h2><p>${escapeHtml(n.text)}</p></div><div class="feedHead"><div class="feedAvatar">${escapeHtml((n.source||'M')[0])}</div><div style="flex:1"><b>${escapeHtml(n.source)}</b><div class="sourceMark">${escapeHtml(n.sourceType)} · ${escapeHtml(n.date)} ${escapeHtml(n.time||'')}</div></div><span class="pill">${escapeHtml(n.importance)}</span></div><div class="feedBody"><div class="small muted">${escapeHtml(n.cat)} · ${escapeHtml(n.scope)}${n.relatedParty?' · '+escapeHtml(n.relatedParty):''}</div></div><div class="newsStats"><span>${mandatoIcon('heart')}${fmt(n.likes)}</span><span>${mandatoIcon('message')}${fmt(n.comments.length)}</span><span>${mandatoIcon('arrow')}${fmt(n.shares)}</span><span>${mandatoIcon('eye')}${fmt(n.views)}</span></div><div class="feedActions"><button class="btn sm" onclick="newsLike('${n.id}')">${mandatoIcon('heart')} Curtir</button><button class="btn sm ${n.favorited?'primary':''}" onclick="newsFavorite('${n.id}')">${mandatoIcon('star')} Salvar</button><button class="btn sm" onclick="openNews('${n.id}')">Abrir</button><button class="btn sm" onclick="newsComment('${n.id}')">Comentar</button></div></article>`}).join('')||'<div class="card"><h3>Nenhuma publicação</h3></div>'}</div>`}
function newsComment(id){const n=save.news.find(x=>x.id===id);if(!n)return;const t=prompt('Comentário simulado:');if(!t?.trim())return;n.comments.push({id:uid(),author:pick(['Cidadão','Analista','Jornalista','Liderança local']),text:t.trim(),date:save.date});n.likes+=rndi(1,8);advHistory('Comentário no feed',`Comentário registrado em "${n.title}".`,n.id);saveState('Comentário registrado');renderNews()}
function renderAchievementsCareer(){const el=document.getElementById('achievementsCareer');if(!el||!save)return;const defs=[['Primeira proposta',()=>save.proposals.length>0],['Primeiro compromisso',()=>save.calendar.length>0],['Primeira mensagem respondida',()=>save.messages.some(m=>m.replyId)],['Primeira notícia favoritada',()=>save.news.some(n=>n.favorited)],['Primeira filiação',()=>save.character.partyHistory.length>0],['Primeira candidatura',()=>save.elections.some(e=>e.candidates.some(c=>c.player))],['Primeira eleição',()=>save.stats.elections>0],['Primeiro mandato',()=>save.stats.wins>0],['Primeira política implementada',()=>save.proposals.some(p=>['Implementação','Avaliação','Aprovada'].includes(p.stage))]];const unlocked=save.achievements||[];defs.forEach(([name,fn])=>{if(fn()&&!unlocked.some(a=>a.name===name))unlocked.push({id:uid(),name,date:save.date})});save.achievements=unlocked;el.innerHTML=`<div class="hero"><div><div class="tag">PROGRESSÃO</div><h1>Conquistas da carreira</h1><p>Conquistas são consequência de ações reais do save.</p></div></div><div class="grid g3">${defs.map(([name,fn])=>`<div class="card"><div class="tag">${fn()?'DESBLOQUEADA':'BLOQUEADA'}</div><h3>${escapeHtml(name)}</h3><p class="small muted">${fn()?'Registrada nesta carreira.':'Ainda não alcançada.'}</p></div>`).join('')}</div>`}

function simulateEconomy(){const e=save.economy,c=save.character;const shock=(c.approval-50)/700;e.growth=clamp(e.growth+rnd(-.25,.25),-3,6);e.inflation=clamp(e.inflation+rnd(-.12,.16)-e.growth*.025,0,15);e.unemployment=clamp(e.unemployment+rnd(-.15,.15)-e.growth*.035,3,18);e.confidence=clamp(e.confidence+shock+rnd(-1.2,1.2));e.debt=clamp(e.debt+rnd(-.25,.35));e.investment=clamp(e.investment+rnd(-.4,.4));e.gdp=clamp(e.gdp*(1+e.growth/520),1,5);if(Math.random()<.05)addNews('ECONOMIA','Indicadores econômicos atualizados','O cenário econômico do save mudou gradualmente com novos dados simulados.','info','BRASIL',{typeLabel:'Análise econômica',importance:'normal'})}

function v4EnsureSave(s){if(!s)return s;s.v4Version=MANDATO_V4_VERSION;s.ownerId=s.ownerId||user?.id||'';s.partiesState=s.partiesState||{};s.partyNegotiations=Array.isArray(s.partyNegotiations)?s.partyNegotiations:[];s.legislature=s.legislature||{houses:{},bills:[],commissions:[],votes:[]};s.government=s.government||{priorities:[],team:[],programs:[],crises:[]};s.budget=s.budget||{revenue:100000000,expenses:85000000,investment:15000000,debt:30000000,year:s.year};s.economy=s.economy||{};s.economy.gdp=Number(s.economy.gdp||100);s.economy.inflation=Number(s.economy.inflation??4.5);s.economy.unemployment=Number(s.economy.unemployment??8);s.economy.growth=Number(s.economy.growth??2);s.economy.income=Number(s.economy.income??100);s.economy.confidence=Number(s.economy.confidence??55);s.world=s.world||makeWorld();s.world.candidates=(s.world.candidates||[]).map(x=>({...x,party:x.party||'',history:Array.isArray(x.history)?x.history:[],active:x.active!==false}));s.world.parties=Array.isArray(s.world.parties)?s.world.parties:[];const ip=s.character.ideologyProfile=(s.character.ideologyProfile&&typeof s.character.ideologyProfile==='object'&&!Array.isArray(s.character.ideologyProfile))?s.character.ideologyProfile:{};ip.positions=ip.positions&&typeof ip.positions==='object'?ip.positions:{};const base={economic:50,social:50,fiscal:50,customs:50,institutional:50,environmental:50,state:50};const ep=String(s.character.experiencePath||'');const prof=String(s.character.profession||'');if(/sindical/i.test(ep)||/sindical/i.test(prof)){base.economic=35;base.social=38;base.fiscal=38}if(/empres|autônom/i.test(prof)){base.economic=68;base.fiscal=62}if(/agricult/i.test(prof))base.environmental=46;if(/policial/i.test(prof)){base.customs=65;base.institutional=58}if(/assistente social|professor|médico/i.test(prof))base.social=40;if(/dirigente partidário|parlamentar|vereador|secretário|gestor/i.test(ep))base.institutional=55;for(const [a,v] of Object.entries(base)){if(!ip.positions[a]||typeof ip.positions[a]!=='object')ip.positions[a]={value:v,confidence:15,sources:['trajetória inicial'],lastDate:s.date};else if(!Number.isFinite(Number(ip.positions[a].value)))ip.positions[a].value=v}if(!Array.isArray(ip.history))ip.history=[];if(!Array.isArray(ip.declarations))ip.declarations=[];if(!Array.isArray(ip.changes))ip.changes=[];ip.version=ip.version||1;for(const rp of MANDATO_REAL_PARTIES){if(!s.world.parties.some(x=>x.sigla===rp.sigla))s.world.parties.push({...rp,influence:rndi(35,75),support:rndi(25,70),simulated:true})}return s}

window.deleteSave=async function(id){if(!user)return;const target=String(id);const before=(user.saves||[]).length;const raw=(user.saves||[]).find(x=>String(x.id)===target&&String(x.ownerId||user.id)===String(user.id));if(!raw)return toast('Mundo não encontrado nesta conta.',true);if(!confirm(`Excluir definitivamente “${raw.name}”?\n\nEsta carreira será removida do armazenamento desta conta.`))return;try{const wasActive=String(save?.id||'')===target;user.saves=(user.saves||[]).filter(x=>String(x.id)!==target);await dbPut(deepClone(user));if(wasActive){save=null;appState.activeSaveId=null}closeModal();renderAccountApp();showAccountView('saves');toast(mandatoIcon('check')+` “${raw.name}” excluído definitivamente.`);if(before===user.saves.length)throw new Error('A exclusão não alterou a coleção de mundos.')}catch(e){toast('Falha ao excluir mundo: '+(e?.message||e),true)}};

/* Catálogo partidário: cadastro factual, federações e identidade editorial separados. */
function v4Compatibility(sigla){if(!save)return {score:0,narrative:'Carregue uma carreira para avaliar compatibilidade.'};const p=v4Identity(sigla),c=save.character,ip=c.ideologyProfile?.positions||{};const weights={economic:1.2,social:1.1,fiscal:.9,customs:1,institutional:1,environmental:.8,state:.8};let total=0,den=0;for(const [a,w] of Object.entries(weights)){const cv=Number(ip[a]?.value??50),pv=Number(p.axes[a]??50);total+=(100-Math.abs(cv-pv))*w;den+=100*w}let score=100-(100-(total/den*100))*1.8;if(c.partyHistory?.some(x=>x.party===sigla))score+=4;if(c.experience>=8)score+=2;score=clamp(score);const all=Object.keys(weights).map(a=>({a,d:Math.abs(Number(ip[a]?.value??50)-Number(p.axes[a]??50))})).sort((x,y)=>x.d-y.d);const convergence=all.slice(0,3).map(x=>x.a),divergence=all.slice(-3).reverse().map(x=>x.a);let narrative=score>=78?'Alta convergência entre trajetória e identidade partidária.':score>=62?'Boa compatibilidade, com divergências administráveis.':score>=45?'Compatibilidade intermediária; a aproximação exigiria negociação.':'Baixa compatibilidade; uma mudança exigiria justificativa e construção de pontes.';return {score:Math.round(score),narrative,convergence,divergence,party:v4Party(sigla),identity:p}}
window.renderParty=function(){const el=document.getElementById('party');if(!el||!save)return;const q=String(window.partySearch||'').toLowerCase();const list=MANDATO_REAL_PARTIES.filter(p=>!q||(p.sigla+' '+p.name).toLowerCase().includes(q));el.innerHTML=`<div class="hero"><div><div class="tag">PARTIDOS, FEDERAÇÕES E FILIAÇÃO</div><h1>Mapa partidário</h1><p>Cadastro eleitoral baseado no TSE; identidade política e aceitação são mecânicas editoriais/simuladas.</p></div></div><div class="card"><div class="field"><label>Pesquisar partido</label><input value="${escapeHtml(window.partySearch||'')}" oninput="window.partySearch=this.value;renderParty()"></div><p class="small muted"><b>${MANDATO_REAL_PARTIES.length} partidos registrados no TSE</b> no cenário de referência · ${MANDATO_FEDERATIONS_V4.length} federações registradas. Federações são entidades separadas das legendas.</p></div><div class="grid g3" style="margin-top:14px">${list.map(p=>{const x=v4Compatibility(p.sigla);return `<div class="card"><div class="row"><div><span class="pill">${escapeHtml(p.sigla)}</span><h3>${escapeHtml(p.name)}</h3></div><b>${escapeHtml(p.number)}</b></div><p class="small muted">Presidência/dados cadastrais: referência TSE · ${escapeHtml(p.sourceDate||'2026')}</p><p>${escapeHtml(x.identity.summary)}</p><div class="row"><span>Compatibilidade</span><b>${x.score}%</b></div><div class="miniBar"><i style="width:${x.score}%"></i></div><p class="small muted">${escapeHtml(x.narrative)}</p><div class="actions"><button class="btn sm" onclick="showRealParty('${p.sigla}')">VER PERFIL</button><button class="btn primary sm" onclick="requestPartyAffiliation('${p.sigla}')">INICIAR FILIAÇÃO</button></div></div>`}).join('')}</div><div class="card" style="margin-top:14px"><h3>Federações registradas</h3>${MANDATO_FEDERATIONS_V4.map(f=>`<div class="item"><div class="row"><b>${escapeHtml(f.name)}</b><span>${escapeHtml(f.date)}</span></div><div class="small muted">${escapeHtml(f.parties.join(' · '))} · ${escapeHtml(f.president)}</div></div>`).join('')}<p class="small muted">Fonte: TSE. Federação não é tratada como uma sigla partidária única.</p></div>`}
window.showRealParty=function(sigla){const p=v4Party(sigla);if(!p)return;const x=v4Identity(sigla),comp=v4Compatibility(sigla),feds=MANDATO_FEDERATIONS_V4.filter(f=>f.parties.includes(sigla));modal(`<div class="row"><div><div class="tag">PARTIDO · ${escapeHtml(p.sigla)}</div><h2>${escapeHtml(p.name)}</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><div class="grid g4">${cardMetric('Legenda',p.number)}${cardMetric('Fundação/registro',p.founded)}${cardMetric('Fonte',p.source||'TSE')}${cardMetric('Compatibilidade',comp.score+'%')}</div><div class="card" style="margin-top:12px"><h3>Identidade política</h3><p>${escapeHtml(x.summary)}</p><div class="grid g2">${Object.entries(x.axes).map(([a,v])=>`<div><div class="row"><span>${escapeHtml(a)}</span><b>${v}</b></div><div class="miniBar"><i style="width:${v}%"></i></div></div>`).join('')}</div><p class="small muted">Escala editorial do MANDATO: não é classificação oficial do TSE.</p></div><div class="card"><h3>Correntes internas modeladas</h3><p class="small muted">${escapeHtml(x.currents.join(' · '))}</p><h3 style="margin-top:10px">Convergências</h3><p class="small">${escapeHtml(comp.convergence.join(' · '))}</p><h3>Divergências</h3><p class="small">${escapeHtml(comp.divergence.join(' · '))}</p><h3>Federação</h3><p class="small">${feds.map(f=>escapeHtml(f.name)).join(' · ')||'Não integra federação registrada no cadastro de referência.'}</p><p class="small muted">Fontes: TSE para cadastro; programas/estatutos/posicionamentos públicos para síntese editorial. Data de referência: 05/10/2026.</p></div>`)};

/* Filiação: nunca troca partido diretamente; gera negociação e resposta contextual. */
window.requestPartyAffiliation=function(sigla){if(!save)return;const p=v4Party(sigla);if(!p)return;const comp=v4Compatibility(sigla),c=save.character;if(c.party===sigla)return toast('Você já está filiado a esta legenda.');const reasons=comp.score>=75?'forte convergência programática':comp.score>=55?'convergência relevante, com divergências negociáveis':'distância programática relevante';modal(`<div class="row"><div><div class="tag">FILIAÇÃO · NEGOCIAÇÃO</div><h2>Aproximação com ${escapeHtml(sigla)}</h2></div><button class="btn sm" onclick="closeModal()">×</button></div><p>${escapeHtml(reasons)}. A aceitação política não é requisito legal de filiação: é uma mecânica de espaço interno do simulador.</p><div class="grid g3">${cardMetric('Compatibilidade',comp.score+'%')}${cardMetric('Reputação',Math.round(c.reputation||0))}${cardMetric('Influência',Math.round(c.influence||0))}</div><div class="field"><label>Justificativa da aproximação</label><textarea id="v4AffReason" placeholder="Explique a trajetória, mudança de posição ou objetivo regional."></textarea></div><div class="actions"><button class="btn" onclick="closeModal()">CANCELAR</button><button class="btn primary" onclick="submitPartyNegotiationV4('${sigla}')">ENVIAR NEGOCIAÇÃO</button></div>`)};
window.submitPartyNegotiationV4=function(sigla){if(!save)return;const p=v4Party(sigla),c=save.character,comp=v4Compatibility(sigla),reason=document.getElementById('v4AffReason')?.value.trim()||'';if(!p)return;const leadership=Number(c.influence||0)*.25+Number(c.reputation||50)*.2+Number(c.partyRep||20)*.15+comp.score*.4;const contradiction=Math.max(0,55-comp.score);const old=c.party;const federation=MANDATO_FEDERATIONS_V4.find(f=>f.parties.includes(sigla));const acceptScore=clamp(leadership-contradiction*.18-(old&&old!==sigla?Math.min(12,(c.partyHistory||[]).length*2):0));const accepted=acceptScore>=52||comp.score>=78&&acceptScore>=45;const negotiation={id:uid(),date:save.date,party:sigla,fromParty:old||null,compatibility:comp.score,acceptance:Math.round(acceptScore),reason,status:accepted?'aceita':'negociação recusada/adiada',internalResistance:Math.round(contradiction),leadershipResistance:Math.round(Math.max(0,50-comp.score*.5)),federation:federation?.name||null};save.partyNegotiations.unshift(negotiation);if(accepted){c.party=sigla;c.partyHistory.push({date:save.date,party:sigla,from:old||null,action:'filiação aceita',reason,compatibility:comp.score});c.partyRep=clamp((c.partyRep||20)+2+(comp.score>=70?2:0));if(comp.score<45&&reason.length<20){c.reputation=clamp((c.reputation||50)-1.2);c.rejection=clamp((c.rejection||20)+1)}addNews('PARTIDOS','Filiação política registrada',`${c.politicalName} passou a integrar ${sigla} após negociação simulada.`,'info',save.region,{typeLabel:'Acontecimento simulado',relatedParty:sigla,importance:'normal'});advNotify('Filiação aprovada','Novo partido registrado',`A aproximação com ${sigla} foi aceita.`,'party',sigla,negotiation.id,true);advHistory('Filiação partidária',`Filiação a ${sigla} aceita. Compatibilidade ${comp.score}%.`,negotiation.id)}else{advNotify('Filiação não concluída','Negociação partidária',`${sigla} não aprovou a aproximação nesta etapa.`,'party',sigla,negotiation.id,true);advHistory('Negociação partidária',`A aproximação com ${sigla} foi recusada ou adiada. Compatibilidade ${comp.score}%.`,negotiation.id);addNews('PARTIDOS','Negociação partidária',`${c.politicalName} negociou com ${sigla}, mas não houve acordo nesta etapa.`,'info',save.region,{typeLabel:'Acontecimento simulado',relatedParty:sigla,importance:'normal'})}saveState('Negociação partidária registrada');closeModal();renderCareerApp();showCareerView('party')};

/* Desfiliação explícita e registro de fidelidade como consequência política. */
window.leavePartyV4=function(){if(!save||!save.character.party)return toast('Você não está filiado a um partido.',true);const old=save.character.party;if(!confirm(`Sair de ${old}? A saída será registrada no histórico e poderá afetar relações políticas.`))return;save.character.party='';save.character.partyHistory.push({date:save.date,party:old,action:'desfiliação',reason:'decisão do personagem'});save.character.partyRep=clamp((save.character.partyRep||20)-3);save.character.relations=save.character.relations||[];advHistory('Desfiliação',`Saída registrada do ${old}.`,old);advNotify('Desfiliação','Mudança partidária registrada',`Você deixou ${old}.`,'party',old,null,true);saveState('Desfiliação registrada');renderCareerApp();showCareerView('party')};

/* Eleição brasileira: majoritária x proporcional. A proporcional usa simulação por médias
   com quociente eleitoral e cláusulas simplificadas explicitadas no resultado. */
function v4OfficeType(office){return ['Vereador','Deputado estadual','Deputado federal'].includes(office)?'proporcional':office==='Senador'?'majoritária-1-turno':'majoritária-2-turnos'}
function v4SimulateProportional(office){const seats=office==='Vereador'?9:office==='Deputado estadual'?24:office==='Deputado federal'?8:0;const parties=MANDATO_REAL_PARTIES.slice(0,Math.min(12,MANDATO_REAL_PARTIES.length));const base=parties.map(p=>{const support=(save.world?.parties||[]).find(x=>x.sigla===p.sigla)?.support||rndi(20,70);return {party:p.sigla,votes:Math.max(100,Math.round(support*1000+rndi(0,3000)))} });const playerParty=save.character.party;if(playerParty&&!base.some(x=>x.party===playerParty))base.push({party:playerParty,votes:Math.round((save.character.popularity||40)*1000)});const total=base.reduce((a,x)=>a+x.votes,0);const quotient=Math.max(1,Math.floor(total/seats));const eligible=base.filter(x=>x.votes>=quotient*.8);const allocation=eligible.map(x=>({party:x.party,votes:x.votes,seats:Math.floor(x.votes/quotient)}));let assigned=allocation.reduce((a,x)=>a+x.seats,0);while(assigned<seats){let best=null;for(const x of allocation){const score=x.votes/(x.seats+1);if(!best||score>best.score)best={x,score}}if(!best)break;best.x.seats++;assigned++}const player=allocation.find(x=>x.party===playerParty);return {system:'proporcional',seats,quotient,validVotes:total,allocation,playerSeats:player?.seats||0,explanation:'Simulação simplificada de distribuição proporcional por quociente e maiores médias; não reproduz uma totalização oficial específica.'}}
function v4Candidates(office){const c=save.character;const arr=[{name:c.politicalName,party:c.party||'Independente',pop:Number(c.popularity||40),rejection:Number(c.rejection||20),isPlayer:true}];(save.world?.candidates||[]).filter(x=>x.office===office||!x.office).slice(0,5).forEach(x=>arr.push({name:x.name,party:x.party||'N/D',pop:Number(x.popularity||40),rejection:Number(x.rejection||20),isPlayer:false}));while(arr.length<4)arr.push({name:`Candidato ${arr.length}`,party:pick(MANDATO_REAL_PARTIES).sigla,pop:rndi(30,65),rejection:rndi(10,40),isPlayer:false});return arr}
function v4MajorityResult(office){const arr=v4Candidates(office).map(x=>({...x,strength:Math.max(1,x.pop*(.75)+(.5-x.rejection/200)*20+rnd(-4,4))}));const total=arr.reduce((a,x)=>a+x.strength,0);arr.forEach(x=>x.votes=x.strength/total*100);arr.sort((a,b)=>b.votes-a.votes);const runoffEligible=['Prefeito','Governador','Presidente da República'].includes(office);let round=1,winner=arr[0];if(runoffEligible&&arr[0].votes<50){round=2;const finalists=arr.slice(0,2);finalists.forEach(x=>x.votes=Math.max(1,x.votes+rnd(3,8)));const t=finalists.reduce((a,x)=>a+x.votes,0);finalists.forEach(x=>x.votes=x.votes/t*100);const winnerFinal=finalists.sort((a,b)=>b.votes-a.votes)[0];arr.forEach(x=>{if(!finalists.includes(x))x.votes=0});winner=winnerFinal}return {system:office==='Senador'?'majoritária-1-turno':'majoritária',round,winner,results:arr}}
const __v4OldRunElection=window.runElection;
window.runElection=function(){if(!save||!pendingElection)return;const office=pendingElection.office||save.character.office||'Vereador';const reason=electionEligibility(office);if(reason)return toast(reason,true);const type=v4OfficeType(office);let outcome;if(type==='proporcional')outcome=v4SimulateProportional(office);else outcome=v4MajorityResult(office);const c=save.character;let win=false,votes=0;if(type==='proporcional'){win=(outcome.playerSeats||0)>0;votes=Math.round((outcome.allocation.find(x=>x.party===c.party)?.votes||0)/Math.max(1,outcome.validVotes)*100)}else{const me=outcome.results.find(x=>x.isPlayer);win=outcome.winner?.isPlayer===true;votes=Number(me?.votes||0)}const result={id:uid(),date:save.date,year:save.year,office,party:c.party||'',result:win?'VITÓRIA':'DERROTA',votes:Math.round(votes*100)/100,system:outcome.system,round:outcome.round||1,details:outcome,simulated:true};save.elections.push(result);save.stats.elections++;if(win){save.stats.wins++;c.popularity=clamp((c.popularity||50)+5);c.reputation=clamp((c.reputation||50)+4);c.influence=clamp((c.influence||30)+5);c.regionalRep=clamp((c.regionalRep||30)+5);c.experience=(c.experience||0)+3;c.office=office}else{save.stats.losses++;c.popularity=clamp((c.popularity||50)-2);c.reputation=clamp((c.reputation||50)-1);c.experience=(c.experience||0)+1}advHistory(win?'Vitória eleitoral':'Derrota eleitoral',`${office}: ${result.result}. Sistema ${outcome.system}.`,result.id);addNews('ELEIÇÕES',win?'Resultado eleitoral favorável':'Resultado eleitoral desfavorável',`${c.politicalName} ${win?'venceu':'não venceu'} a disputa simulada para ${office}.`,'info',save.region,{typeLabel:'Resultado eleitoral simulado',importance:'alta',relatedCharacters:[c.politicalName],relatedParty:c.party||''});advNotify('Resultado eleitoral',result.result,`${office}: ${result.result}.`,'elections',result.id,null,true);pendingElection=null;saveState('Resultado eleitoral registrado');closeModal();renderCareerApp();showCareerView('elections')};

function mandatoHydrateStaticIcons(){
  // Navegação deliberadamente somente textual: ícones funcionais de outras áreas permanecem intactos.
  document.querySelectorAll('.navbtn').forEach(btn=>{
    const label=btn.textContent
      .replace(/^[\s\u2600-\u27ff\u{1F000}-\u{1FAFF}▣＋ⓘ⇥◎◇↔⌖⌁▦☰]+/u,'')
      .trim();
    btn.innerHTML=`<span>${label}</span>`;
  });
  const mobile=document.getElementById('mobileMenuBtn');
  if(mobile) mobile.textContent='MENU';
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  const token=/\$\{mandatoIcon\('([^']+)'\)\}/g;
  nodes.forEach(n=>{if(token.test(n.nodeValue)){const frag=document.createDocumentFragment(),raw=n.nodeValue;let last=0,m;token.lastIndex=0;while((m=token.exec(raw))){if(m.index>last)frag.appendChild(document.createTextNode(raw.slice(last,m.index)));const box=document.createElement('span');box.innerHTML=mandatoIcon(m[1]);frag.appendChild(box.firstChild);last=m.index+m[0].length;}if(last<raw.length)frag.appendChild(document.createTextNode(raw.slice(last)));n.parentNode.replaceChild(frag,n);}});
}

function cloudConfig(){return false}

async function loadScript(src){return new Promise((resolve,reject)=>{if(document.querySelector('script[src="'+src+'"]'))return resolve();const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar '+src));document.head.appendChild(s)})}
async function initMandatoCloud(){
 if(!cloudConfig())return false;
 if(cloudInitPromise)return cloudInitPromise;

   try{
     if(!window.firebase)await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js');
     if(!window.firebase?.auth)await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js');
     if(!window.firebase?.firestore)await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js');
     if(!firebase.apps.length)firebase.initializeApp(window.MANDATO_FIREBASE_CONFIG);
     firebaseAuth=firebase.auth();
     cloudDb=firebase.firestore();
     cloudEnabled=true;
     await firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
     if(!cloudAuthReadyPromise){cloudAuthReadyPromise=new Promise(resolve=>{let done=false;const unsub=firebaseAuth.onAuthStateChanged(u=>{if(done)return;done=true;try{unsub()}catch(e){}resolve(u||null)})})}
     return true;
   }catch(e){cloudEnabled=false;cloudInitPromise=null;console.warn('MANDATO Cloud indisponível:',e);return false}
 })();
 return cloudInitPromise;
}
function cloudRequire(){if(!cloudEnabled||!cloudDb||!firebaseAuth)throw new Error('Sincronização em nuvem não está configurada.');return true}
function cloudUserRef(uid){return cloudDb.collection('users').doc(String(uid))}
function cloudSaveRef(uid,id){return cloudUserRef(uid).collection('saves').doc(String(id))}
function cleanCloudUser(u){const x=deepClone(u||{});delete x.passwordHash;delete x.passwordSalt;delete x.passwordHashAlgo;delete x.saves;delete x.sessionVersion;return x}
async function cloudReadProfile(uid){cloudRequire();const snap=await cloudUserRef(uid).get();return snap.exists?snap.data():null}
async function cloudReadSaves(uid){cloudRequire();const snap=await cloudUserRef(uid).collection('saves').get();return snap.docs.map(d=>d.data())}
async function cloudLoadUser(uid){
 const profile=await cloudReadProfile(uid);
 if(!profile)return null;
 const saves=await cloudReadSaves(uid);
 const u=normalizeUser({...profile,id:String(uid),saves});u.cloudUid=String(uid);u.cloudVersion=CLOUD_VERSION;return u;
}
async function cloudWriteUser(u,targetUid){
 cloudRequire();
 const uid=String(targetUid||u?.cloudUid||u?.id||firebaseAuth.currentUser?.uid||'');
 if(!uid)throw new Error('Identidade Firebase não encontrada.');
 const base=normalizeUser({...u,id:uid});
 const profile=cleanCloudUser(base);profile.id=uid;profile.cloudUid=uid;profile.cloudVersion=CLOUD_VERSION;profile.updatedAt=Date.now();
 await cloudUserRef(uid).set(profile,{merge:true});
 const existing=await cloudUserRef(uid).collection('saves').get();
 const wanted=new Set((base.saves||[]).map(s=>String(s.id)));
 const batch=cloudDb.batch();
 for(const d of existing.docs)if(!wanted.has(d.id))batch.delete(d.ref);
 for(const raw of base.saves||[]){const s=normalizeSave(raw,uid);batch.set(cloudSaveRef(uid,s.id),{...s,ownerId:uid,cloudVersion:CLOUD_VERSION},{merge:true})}
 await batch.commit();
 return {...base,id:uid,saves:base.saves.map(s=>normalizeSave(s,uid))};
}
async function cloudWriteSave(s){
 cloudRequire();
 const uid=String(firebaseAuth.currentUser?.uid||user?.cloudUid||'');
 if(!uid)throw new Error('Sessão de nuvem não encontrada.');
 const x=normalizeSave(s,uid);x.updatedAt=Date.now();x.lastAccessAt=Date.now();x.ownerId=uid;x.cloudVersion=CLOUD_VERSION;
 await cloudSaveRef(uid,x.id).set(x,{merge:true});
 return x;
}
async function cloudDeleteSave(id){cloudRequire();const uid=String(firebaseAuth.currentUser?.uid||user?.cloudUid||'');if(!uid)throw new Error('Sessão de nuvem não encontrada.');await cloudSaveRef(uid,id).delete()}
async function migrateLocalToCloud(uid,localUser){
 const existing=await cloudReadProfile(uid);
 if(existing){
   const cloud=await cloudLoadUser(uid);
   if(localUser?.saves?.length){for(const s of localUser.saves)if(!(cloud.saves||[]).some(x=>String(x.id)===String(s.id)))await cloudWriteSave(s)}
   return cloudLoadUser(uid);
 }
 const migrated=normalizeUser({...localUser,id:uid,saves:localUser?.saves||[]});migrated.email=String(firebaseAuth.currentUser?.email||migrated.email||'').toLowerCase();migrated.authProvider='password';migrated.googleUid='';migrated.cloudUid=uid;migrated.passwordHash=undefined;migrated.passwordSalt=undefined;migrated.passwordHashAlgo=undefined;return cloudWriteUser(migrated);
}
async function cloudEnsureProfile(firebaseUser,seed){
 let u=await cloudLoadUser(firebaseUser.uid);
 if(!u){const isGoogle=firebaseUser.providerData?.some(p=>p.providerId==='google.com');u=normalizeUser({...blankProfile(firebaseUser.displayName||seed?.name||'Usuário',seed?.userName||((firebaseUser.email||'usuario').split('@')[0]),(firebaseUser.email||seed?.email||'').toLowerCase()),id:firebaseUser.uid});u.authProvider=isGoogle?'google':'password';u.cloudUid=firebaseUser.uid;u.googleUid=isGoogle?firebaseUser.uid:'';u.photoURL=firebaseUser.photoURL||'';u.saves=[];u.passwordHash=undefined;u.passwordSalt=undefined;u.passwordHashAlgo=undefined;await cloudWriteUser(u)}
 else{u.authProvider=firebaseUser.providerData?.some(p=>p.providerId==='google.com')?'google':'password';u.cloudUid=firebaseUser.uid;u.email=(firebaseUser.email||u.email||'').toLowerCase();u.name=firebaseUser.displayName||u.name;u.photoURL=firebaseUser.photoURL||u.photoURL||'';u.lastLogin=Date.now();await cloudWriteUser(u)}
 return u;
}
async function cloudRegister(name,un,email,pass){
 await initMandatoCloud();cloudRequire();
 let cred;
 try{cred=await firebaseAuth.createUserWithEmailAndPassword(email,pass)}catch(e){if(e?.code==='auth/email-already-in-use')throw new Error('Este e-mail já possui uma conta na nuvem. Entre com a senha dessa conta.');throw e}
 try{await cred.user.updateProfile({displayName:name});}catch(e){}
 const local=normalizeUser(blankProfile(name,un,email));local.authProvider='password';local.cloudUid=cred.user.uid;local.saves=[];local.passwordHash=undefined;local.passwordSalt=undefined;local.passwordHashAlgo=undefined;const u=await cloudWriteUser(local);return u;
}
async function cloudLogin(email,pass){await initMandatoCloud();cloudRequire();const cred=await firebaseAuth.signInWithEmailAndPassword(email,pass);const u=await cloudEnsureProfile(cred.user);return u}
async function cloudGoogle(){await initMandatoCloud();cloudRequire();const remember=document.getElementById('aRemember')?.checked!==false;await firebaseAuth.setPersistence(remember?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const result=await firebaseAuth.signInWithPopup(provider);return cloudEnsureProfile(result.user)}
async function cloudRestore(){await initMandatoCloud();if(!cloudEnabled)return false;let current=firebaseAuth.currentUser;if(!current){current=await new Promise(resolve=>{let done=false;const unsub=firebaseAuth.onAuthStateChanged(u=>{if(done)return;done=true;try{unsub()}catch(e){}resolve(u||null)})})}if(!current)return false;try{user=await cloudEnsureProfile(current);if(user?.adminStatus==='suspended'){await firebaseAuth.signOut();user=null;return false}enterGame();return true}catch(e){console.error(e);return false}}
async function cloudAllUsers(){cloudRequire();const snap=await cloudDb.collection('users').get();const out=[];for(const d of snap.docs){const p=d.data();const saves=await d.ref.collection('saves').get();out.push(normalizeUser({...p,id:d.id,saves:saves.docs.map(x=>x.data())}))}return out}
async function cloudGetUser(id){cloudRequire();const p=await cloudReadProfile(id);if(!p)return undefined;return cloudLoadUser(id)}
async function cloudPutUser(x){if(!cloudEnabled)return false;const current=String(firebaseAuth.currentUser?.uid||'');const target=String(x?.cloudUid||x?.id||'');if(!current)throw new Error('Sessão de nuvem inexistente.');if(current!==target && !isAdminAuthorized())throw new Error('Acesso negado: esta conta não pertence à sessão atual.');const u=normalizeUser({...x,id:target});const written=await cloudWriteUser(u,target);if(String(user?.id)===target||String(user?.cloudUid)===target)user=written;return true}
async function cloudPutSave(s){const x=await cloudWriteSave(s);if(user){const i=user.saves.findIndex(v=>String(v.id)===String(x.id));if(i>=0)user.saves[i]=deepClone(x);else user.saves.push(deepClone(x))}return true}
async function cloudDelUser(id){cloudRequire();if(!isAdminAuthorized())throw new Error('Apenas o administrador pode excluir contas remotamente.');const ref=cloudUserRef(id),snap=await ref.collection('saves').get();for(const d of snap.docs)await d.ref.delete();await ref.delete()}

const _localDbGet=dbGet,_localDbPut=dbPut,_localDbAll=dbAll,_localDbDelete=dbDelete;
window.dbGet=async function(id){if(cloudEnabled){try{return await cloudGetUser(id)}catch(e){console.warn('Cloud get falhou',e);throw e}}return _localDbGet(id)};
window.dbPut=async function(x){if(cloudEnabled){await cloudPutUser(x);return}return _localDbPut(x)};
window.dbAll=async function(){if(cloudEnabled){try{return await cloudAllUsers()}catch(e){console.warn('Cloud all falhou',e);throw e}}return _localDbAll()};
window.dbDelete=async function(id){if(cloudEnabled)return cloudDelUser(id);return _localDbDelete(id)};

/* Replaces auth entry points with real Firebase Auth when configured. */
const _localRegister=window.register,_localLogin=window.login,_localGoogle=window.loginGoogle,_localRestore=window.restoreAuthSession;
window.register=async function(){
 await loadMandatoFirebaseConfig();if(!cloudConfig())return _localRegister.apply(this,arguments);

window.login=async function(){

window.persistUser=async function(){if(!user)throw new Error('Sessão inexistente');user=normalizeUser(user);if(cloudEnabled){user=await cloudWriteUser(user);appState.pendingSave=false;return}await _localDbPut(user);appState.pendingSave=false};
window.persistActiveSave=async function(){if(!user||!save)return;const normalized=normalizeSave(save,user.id);normalized.updatedAt=Date.now();normalized.lastAccessAt=Date.now();if(cloudEnabled){const x=await cloudWriteSave(normalized);const i=user.saves.findIndex(v=>String(v.id)===String(x.id));if(i<0)user.saves.push(deepClone(x));else user.saves[i]=deepClone(x);save=deepClone(x);appState.activeSaveId=save.id;appState.pendingSave=false;return}const idx=user.saves.findIndex(x=>x.id===normalized.id);if(idx<0)user.saves.push(deepClone(normalized));else user.saves[idx]=deepClone(normalized);save=deepClone(normalized);appState.activeSaveId=save.id;await _localDbPut(user);appState.pendingSave=false};
const _oldLoadSave=window.loadSave;

const _oldDeleteSave=window.deleteSave;

let cloudSaveTimer=null,cloudSaving=false;
window.mandatoCloudScheduleSave=function(reason='alteração'){if(!cloudEnabled||!user||!save||cloudSaving)return;appState.pendingSave=true;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(async()=>{if(cloudSaving||!user||!save)return;cloudSaving=true;try{await window.persistActiveSave()}catch(e){console.warn('Autosave cloud falhou',e);appState.pendingSave=true}finally{cloudSaving=false}},900)};

window.migrateMandatoLocalAccount=async function(localEmail,localPassword){

 if(!Array.isArray(data)||data.length!==30)return {ok:false,error:'O catálogo precisa conter exatamente 30 partidos.'};
 const ids=new Set(),sigs=new Set(),nums=new Set();
 for(const p of data){if(!p.id||!p.sigla||!p.name||!p.number)return {ok:false,error:`Cadastro incompleto para ${p.sigla||'(sem sigla)'}.`};if(ids.has(p.id))return {ok:false,error:`ID duplicado: ${p.id}`};if(sigs.has(p.sigla))return {ok:false,error:`Sigla duplicada: ${p.sigla}`};if(nums.has(String(p.number)))return {ok:false,error:`Número eleitoral duplicado: ${p.number}`};ids.add(p.id);sigs.add(p.sigla);nums.add(String(p.number));if(!/^\d+$/.test(String(p.number))||Number(p.number)<10||Number(p.number)>90)return {ok:false,error:`Número eleitoral inválido em ${p.sigla}.`};}
 return {ok:true}
}

function partyV6Load(){try{const raw=localStorage.getItem(MANDATO_PARTY_CATALOG_STORAGE_V6);if(raw){const x=JSON.parse(raw);if(Array.isArray(x)&&x.length===30)return x.map(p=>({...p,number:String(p.number||MANDATO_REAL_PARTIES.find(r=>r.sigla===p.sigla)?.number||'')}))}}catch(e){}return null}

function partyV6Sources(p){const c=MANDATO_PARTY_CONTACTS?.[p.sigla]||{};return [{label:'TSE — ficha oficial do partido',url:MANDATO_PARTY_TSE_PAGES?.[p.sigla]||MANDATO_TSE_SOURCE_URL,date:MANDATO_PARTY_V6_UPDATED},{label:'Site oficial da legenda',url:c.site||null,date:MANDATO_PARTY_V6_UPDATED},{label:'TSE — partidos registrados e histórico',url:MANDATO_TSE_SOURCE_URL,date:MANDATO_PARTY_V6_UPDATED},{label:'TSE — federações registradas',url:MANDATO_PARTY_SOURCES.federations,date:MANDATO_PARTY_V6_UPDATED},{label:'TSE — contas partidárias / DivulgaSPCA',url:MANDATO_PARTY_SOURCES.accounts,date:MANDATO_PARTY_V6_UPDATED}].filter(x=>x.url)}

 const old=partyV6Load();if(old)return old;
 return MANDATO_REAL_PARTIES.map(p=>{const c=MANDATO_PARTY_CONTACTS?.[p.sigla]||{},h=MANDATO_PARTY_HISTORY?.[p.sigla]||{},e=PARTY_V6_PROFILES[p.sigla]||{};const fed=MANDATO_PARTY_FEDERATION_MAP?.[p.sigla]||null;const rep=MANDATO_PARTY_REP?.[p.sigla]||{};return {id:'party-'+p.sigla.toLowerCase().replace(/[^a-z0-9]+/g,'-'),sigla:p.sigla,name:p.name,number:String(p.number),status:'Registrado no TSE',historicalFoundation:e.foundation||h.foundation||null,creationDate:null,registrationDate:MANDATO_PARTY_REG_DATES?.[p.sigla]||null,history:e.history||h.foundationText||'Histórico detalhado ainda não confirmado no catálogo.',historyEvents:h.events||[],nameChanges:(h.events||[]).filter(x=>/nome|denomina|sigla/i.test(x[1])).map(x=>`${x[0]} — ${x[1]}`),mergers:(h.events||[]).filter(x=>/fus|incorpor/i.test(x[1])).map(x=>`${x[0]} — ${x[1]}`),classification:e.classification||'Não confirmado',classificationBasis:e.basis||'Não confirmado',economic:e.economic||'Não confirmado',social:e.social||'Não confirmado',state:e.state||'Não confirmado',priorities:e.priorities||'Não confirmado',features:e.features||'Não confirmado',officialProgramSummary:null,observedPractice:null,president:c.president||null,presidentStartDate:null,site:c.site||null,address:c.address||null,phone:c.phone||null,email:c.email||null,statuteUrl:MANDATO_PARTY_TSE_PAGES?.[p.sigla]||MANDATO_TSE_SOURCE_URL,programUrl:c.site||null,logoUrl:null,brandColor:null,federation:fed?{name:fed,parties:MANDATO_PARTY_FEDERATION_PARTIES[fed]}:null,representation:{chamber:rep.chamber||null,senate:MANDATO_PARTY_SENATE?.[p.sigla]||null,governors:null,stateDeputies:null,mayors:null,councilors:null,regional:null},electionHistory:null,finance:{partyFund:null,accountsReference:MANDATO_PARTY_SOURCES.accounts},editorialNote:PARTY_V6_EDITORIAL_NOTE,sources:partyV6Sources(p),updatedAt:MANDATO_PARTY_V6_UPDATED,adminNote:''}})

rationDate)],['Classificação aproximada',p.classification],['Presidente nacional',partyV6Val(p.president)],['Início do mandato',partyV6Val(p.presidentStartDate)],['Cor principal',partyV6Val(p.brandColor)],['Logotipo oficial',p.logoUrl?'Disponível':'Não incorporado ao catálogo offline']].map(x=>`<div class="partyMeta"><div class="small muted">${partyV6Esc(x[0])}</div><b>${partyV6Esc(x[1])}</b></div>`).join('')}</div><div class="partyNarrative"><h3>Perfil específico</h3><p>${partyV6Esc(p.history)}</p><h3>Características políticas</h3><p>${partyV6Esc(p.features)}</p></div></section><section class="partyTabPanel" data-party-panel="history"><h3>História e transformações</h3><p>${partyV6Esc(p.history)}</p>${partyV6HistoryHtml(p)}<h3>Mudanças de nome/sigla</h3><p>${partyV6Esc((p.nameChanges||[]).join(' · ')||'Não confirmado')}</p><h3>Fusões e incorporações</h3><p>${partyV6Esc((p.mergers||[]).join(' · ')||'Não confirmado')}</p></section><section class="partyTabPanel" data-party-panel="program"><div class="partyMetaGrid"><div class="partyMeta"><div class="small muted">Classificação aproximada</div><b>${partyV6Esc(p.classification)}</b></div><div class="partyMeta"><div class="small muted">Base da classificação</div><b>${partyV6Esc(p.classificationBasis)}</b></div></div><h3>Posição econômica</h3><p>${partyV6Esc(p.economic)}</p><h3>Posição social</h3><p>${partyV6Esc(p.social)}</p><h3>Papel do Estado</h3><p>${partyV6Esc(p.state)}</p><h3>Propostas e prioridades</h3><p>${partyV6Esc(p.priorities)}</p><h3>Programa oficial</h3><p>${partyV6Esc(p.officialProgramSummary||'Consulte o programa/estatuto na fonte oficial. O catálogo não inventa um resumo quando a versão documental não foi incorporada.')}</p><p class="small muted">${partyV6Esc(p.editorialNote)}</p></section><section class="partyTabPanel" data-party-panel="structure"><div class="partyMetaGrid">${[['Presidente nacional',partyV6Val(p.president)],['Início do mandato',partyV6Val(p.presidentStartDate)],['Site oficial',partyV6Val(p.site)],['Endereço',partyV6Val(p.address)],['Telefone',partyV6Val(p.phone)],['E-mail',partyV6Val(p.email)],['Estatuto',p.statuteUrl?'Fonte TSE disponível':'Não confirmado'],['Diretórios',partyV6Val(p.directories)]].map(x=>`<div class="partyMeta"><div class="small muted">${partyV6Esc(x[0])}</div><b>${partyV6Esc(x[1])}</b></div>`).join('')}</div></section><section class="partyTabPanel" data-party-panel="representation"><h3>Representação política</h3>${partyV6RepresentationHtml(p)}</section><section class="partyTabPanel" data-party-panel="elections"><h3>Histórico eleitoral</h3><p>${partyV6Esc(p.electionHistory||'Não confirmado no catálogo. Consulte o DivulgaCandContas/TSE para resultados e candidaturas por eleição, cargo, estado e município.')}</p></section><section class="partyTabPanel" data-party-panel="federations"><h3>Federação atual</h3>${fed?`<div class="card"><b>${partyV6Esc(fed.name)}</b><p class="small muted">Integrantes: ${fed.parties.map(partyV6Esc).join(' · ')}</p></div>`:'<div class="partyEmpty"><b>Sem federação registrada no cadastro de referência.</b><p class="small muted">Isso não significa ausência de alianças eleitorais históricas.</p></div>'}</section><section class="partyTabPanel" data-party-panel="finance"><h3>Finanças e transparência</h3><div class="partyMetaGrid"><div class="partyMeta"><div class="small muted">Fundo Partidário</div><b>${partyV6Val(p.finance?.partyFund)}</b></div><div class="partyMeta"><div class="small muted">Prestação de contas</div><b>${p.finance?.accountsReference?'Consulta oficial disponível':'Não confirmado'}</b></div></div><p class="small muted">O catálogo não inventa valores financeiros. As contas anuais e eleitorais devem ser consultadas nos sistemas oficiais do TSE.</p></section><section class="partyTabPanel" data-party-panel="sources"><h3>Fontes consultadas</h3>${partyV6SourcesHtml(p)}<div class="partyEmpty" style="margin-top:12px"><b>Última atualização</b><div class="small muted">${partyV6Esc(p.updatedAt)} · catálogo V6</div></div></section></div>`;
 modal(body);window.partyV6Current=sigla;
